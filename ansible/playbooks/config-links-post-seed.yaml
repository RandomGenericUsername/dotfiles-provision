# Config-links post-seed playbook (BUG-006 / Generations v3) — exposes the
# palette and generated-appearance consumers and creates their
# provisioning-owned stable links.
#
# bootstrap order: config-links.yaml (pre-seed settings links) -> runtime-seed
# (commits the v3 generation under state/current) -> THIS playbook (gtk-3.0,
# gtk-4.0, rofi, btop, wlogout) -> display-manager -> verify.
#
# Why the split: the provisioned rofi config hard-imports colors.rasi; linking
# ~/.config/rofi before runtime-seed exposes a launcher whose palette target
# does not exist yet (rofi exits with a theme parse error). Linking the
# consumers only after the seed closes that exposure window. The settings links
# must still run BEFORE the seed because the producer CLIs discover their
# config through ~/.config/<tool>.
#
# v3 locality: config_links only exposes the directories. state_links owns the
# stable consumer links INSIDE those spine dirs, pointing at
# state/current/{palette,appearance}/...; the runtime never writes them and no
# AGS app tag is in the read path.
#
# User-scoped playbook: NO become (the links live under the user's config
# home). gather_facts is REQUIRED for the role's ansible_facts.env derivations.
- name: Link palette and appearance-consumer configs into the XDG config home (post-seed)
  hosts: localhost
  gather_facts: true
  vars:
    config_links_phase: post_seed
  roles:
    - config_links
    - state_links
