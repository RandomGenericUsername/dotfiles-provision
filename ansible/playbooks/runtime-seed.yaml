# Runtime seed playbook (Epic 4 / Generations v3) — commits the runtime's
# initial generation.
#
# Runs `dotfiles-runtime wallpaper set <install>/wallpapers/default.png`,
# which derives palette/effects/icons into the content-addressed cache, stages
# a generation, writes `state/generations/<genHash>/manifest.json` last and
# atomically commits `state/current -> generations/<genHash>` (contracts
# generations.md v0.9.0 §3). It appends the seed history line and reloads
# desktop consumers. This is the ONLY producer of generated artifacts —
# provisioning deploys inputs only; runtime writes live under state/, never
# under <install>/config or <install>/apps/<tag>.
#
# Placement in bootstrap.yaml: after config-links.yaml (the PRE-SEED settings
# links the producer CLIs discover through ~/.config/<tool>) and before
# config-links-post-seed.yaml/display-manager.yaml/verify.yaml. The post-seed
# step exposes rofi/gtk/btop and creates their stable links only AFTER this
# commit (BUG-006). Requires: assets (default.png), cli_tools (the installed
# pinned dotfiles-runtime), runtime_daemon (the producer config), settings
# (ITR/TPR/WEG settings.toml).
#
# User-scoped playbook: NO become (everything the runtime writes lives
# under the user's XDG state dir; running as root would seed root's
# state, not the user's).
#
# Distro-agnostic: seeding is identical on Arch and Debian-family.
#
# gather_facts: true is REQUIRED — the install_dir seam and PATH
# derivation read {{ ansible_facts.env.* }}, populated only after the
# fact-gathering setup module runs.
#
# Check-gating: the seed command is gated `when: not ansible_check_mode`
# (dry-run must be dry — a seed writes cache entries, a generation, the
# current pointer and history).
- name: Seed runtime desktop state from default wallpaper
  hosts: localhost
  gather_facts: true
  vars:
    # Where `uv tool install` dropped the pinned runtime. Resolved exactly as
    # uv does, mirroring cli_tools_bin_dir / runtime_daemon_bin_dir.
    runtime_seed_bin_dir: >-
      {{ ansible_facts.env.UV_TOOL_BIN_DIR
         | default(ansible_facts.env.XDG_BIN_HOME | default(ansible_facts.env.HOME + '/.local/bin', true), true) }}
    # The runtime-owned producer config (runtime REQ-004). runtime_daemon
    # renders it before this playbook; the seed reads it through the runtime.
    # NO producer env is passed here: ambient env is non-authoritative.
    runtime_seed_producer_config: "{{ install_dir | trim }}/config/dotfiles-runtime/producer.json"
    # The ONE committed generation pointer the seed must advance. Everything
    # the runtime writes is under this state root; no install-spine consumer
    # link is part of the seed (provisioning owns those in state_links).
    runtime_seed_state_home: >-
      {{ ansible_facts.env.XDG_STATE_HOME
         | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/state', true) }}
    runtime_seed_current_dir: "{{ runtime_seed_state_home | trim }}/dotfiles/current"
    runtime_seed_generation_manifest: "{{ runtime_seed_current_dir }}/manifest.json"
  tasks:
    - name: Assert install_dir seam is provided
      ansible.builtin.assert:
        that: install_dir is defined and install_dir | trim | length > 0
        fail_msg: >-
          install_dir is undefined or empty — the runtime-seed step requires
          the install_dir seam extra-var (the orchestrator resolves
          $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)

    - name: Check the runtime producer config exists before seeding
      ansible.builtin.stat:
        path: "{{ runtime_seed_producer_config }}"
      register: runtime_seed_producer_config_check

    # Check-gated: a standalone `--check` of this playbook does not run the
    # runtime_daemon role, so the config may legitimately be absent in a dry
    # run; the real seed below is check-gated too.
    - name: Assert the runtime producer config exists before seeding
      ansible.builtin.assert:
        that: runtime_seed_producer_config_check.stat.isreg | default(false)
        fail_msg: >-
          {{ runtime_seed_producer_config }} is missing — runtime_daemon
          renders the producer config before runtime-seed (bootstrap order).
          Without it the runtime cannot resolve the selected producer.
          Re-run the runtime-daemon playbook (or bootstrap in order).
      when: not ansible_check_mode

    # BUG-006: capture the pre-seed generation so a tolerated rc=1 is only
    # accepted when the seed actually committed FRESH state. rc alone is not
    # proof.
    - name: Capture the generation manifest before seeding
      ansible.builtin.stat:
        path: "{{ runtime_seed_generation_manifest }}"
      register: runtime_seed_pre_state
      when: not ansible_check_mode

    - name: Seed runtime state from default wallpaper
      ansible.builtin.command:
        argv:
          - "{{ runtime_seed_bin_dir | trim }}/dotfiles-runtime"
          - wallpaper
          - set
          - "{{ install_dir | trim }}/wallpapers/default.png"
      register: runtime_seed_result
      changed_when: runtime_seed_result.rc == 0
      failed_when: runtime_seed_result.rc not in [0, 1]
      when: not ansible_check_mode

    - name: Capture the generation manifest after seeding
      ansible.builtin.stat:
        path: "{{ runtime_seed_generation_manifest }}"
      register: runtime_seed_post_state
      when: not ansible_check_mode

    - name: Determine whether the seed advanced the generation
      ansible.builtin.set_fact:
        runtime_seed_state_advanced: >-
          {{ (not (runtime_seed_pre_state.stat.exists | default(false)))
             or ((runtime_seed_post_state.stat.checksum | default(''))
                 != (runtime_seed_pre_state.stat.checksum | default('')))
             or ((runtime_seed_post_state.stat.mtime | default(0))
                 > (runtime_seed_pre_state.stat.mtime | default(0))) }}
      when: not ansible_check_mode

    - name: Read the committed generation manifest
      ansible.builtin.slurp:
        src: "{{ runtime_seed_generation_manifest }}"
      register: runtime_seed_manifest_raw
      when:
        - not ansible_check_mode
        - runtime_seed_post_state.stat.exists | default(false)

    - name: Parse the committed generation identity
      ansible.builtin.set_fact:
        runtime_seed_generation: "{{ runtime_seed_manifest_raw.content | b64decode | from_json }}"
      when:
        - not ansible_check_mode
        - runtime_seed_post_state.stat.exists | default(false)

    - name: Read the current pointer target
      ansible.builtin.command:
        argv:
          - readlink
          - "{{ runtime_seed_current_dir }}"
      register: runtime_seed_current_link
      changed_when: false
      when:
        - not ansible_check_mode
        - runtime_seed_post_state.stat.exists | default(false)

    # rc=0 is success even when the commit is a no-op: an idempotent apply
    # derives the same generation and leaves current/manifest.json unchanged,
    # so state_advanced is false and that is expected. Only a tolerated rc=1
    # needs proof of fresh/changed state (BUG-006); a committed valid manifest
    # with the current target matching its generationHash is asserted next.
    - name: Assert the seed produced acceptable generation state
      ansible.builtin.assert:
        that:
          - runtime_seed_result.rc in [0, 1]
          - runtime_seed_post_state.stat.exists | default(false)
          - runtime_seed_post_state.stat.isreg | default(false)
          - runtime_seed_result.rc == 0 or runtime_seed_state_advanced | bool
        fail_msg: >-
          runtime seed did not produce acceptable generation state. rc={{
          runtime_seed_result.rc }};
          state_advanced={{ runtime_seed_state_advanced | default(false) }};
          manifest={{ runtime_seed_generation_manifest }}.
          rc=0 requires an existing current/manifest.json (an unchanged
          generation is a successful idempotent apply); rc=1 additionally
          requires fresh/changed state. Re-run the runtime seed after fixing the
          reported path.
      when: not ansible_check_mode

    # v3 generation self-check: the manifest written last inside the generation
    # names the SAME hash as the current target basename. A v2 current.json or a
    # multi-pointer current/ directory fails this gate.
    - name: Assert the seed committed one complete v3 generation
      ansible.builtin.assert:
        that:
          - runtime_seed_generation.version == 3
          - runtime_seed_generation.generationHash is match('^[0-9a-f]{64}$')
          - runtime_seed_current_link.stdout | trim | basename == runtime_seed_generation.generationHash
          - runtime_seed_generation.appearance.tokensPath == 'appearance/tokens.json'
          - runtime_seed_generation.appearance.targets | length > 0
        fail_msg: >-
          runtime seed did not commit one complete v3 generation (contracts
          generations.md v0.9.0). manifest={{ runtime_seed_generation_manifest }};
          current_target={{ runtime_seed_current_link.stdout | default('') | trim }};
          stdout: {{ runtime_seed_result.stdout | default('') }};
          stderr: {{ runtime_seed_result.stderr | default('') }}.
          The manifest written last must name the current target basename;
          a v2 current.json / multi-pointer current is not a v3 generation.
      when:
        - not ansible_check_mode
        - runtime_seed_post_state.stat.exists | default(false)
