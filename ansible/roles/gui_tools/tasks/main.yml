# GUI tools role — desktop GUI prerequisites that are not AGS app ownership.
#
# The AGS app lifecycle (source placement, quit/restart, launchers, config and
# XDG links) is owned by `ags_apps_units` (the ONLY installer in the final
# all-standalone topology). This role keeps two independent responsibilities:
#   1. get dunst out of the way BEFORE the notification overlay is started, so
#      the standalone `notifications` instance can own
#      org.freedesktop.Notifications (dunst stays installed as a manual
#      fallback);
#   2. pin `inode/directory` to the provisioned file manager for the capture
#      tool's "Show in folder" action.
#
# Ordering: bootstrap imports gui-tools BEFORE ags-apps-units. Starting the
# notification instance while dunst still owns the bus name would leave the
# session without a working notification daemon, and no later task restarts it.
#
# User-scoped: NO become/become_user anywhere.

- name: Stop the dunst user unit so the overlay can own the notification bus
  ansible.builtin.command:
    cmd: "systemctl --user disable --now dunst.service"
  failed_when: false
  changed_when: false
  when: not ansible_check_mode

- name: Mask the dunst user unit (respawn guard)
  ansible.builtin.command:
    cmd: "systemctl --user mask dunst.service"
  failed_when: false
  changed_when: false
  when: not ansible_check_mode

# The capture tool's "Show in folder" action xdg-opens the recording's parent
# DIRECTORY. With no explicit handler the mime database resolves
# inode/directory by its own ordering, which picked kitty-open.desktop — so
# "Show in folder" launched a terminal instead of the file manager (reported
# live). thunar is the provisioned file manager (packages.yaml), so pin it.
# `xdg-mime default` merges the entry into ~/.config/mimeapps.list rather than
# replacing it, so the user's other associations survive; re-running writes the
# same value, hence changed_when: false.
- name: Default the directory handler to the provisioned file manager
  ansible.builtin.command:
    cmd: "xdg-mime default thunar.desktop inode/directory"
  changed_when: false
  when: not ansible_check_mode
