# GUI tools role vars — the desktop GUI prerequisites that are NOT AGS app
# ownership.
#
# RETIRED OWNERSHIP (REQ-008 final all-standalone topology): this role used to
# carry an AGS instance lifecycle (quit every app after placement, restart the
# always-on subset) and per-app placement manifests. Both are gone. Every AGS
# app is installed, quiesced, started and verified by `ags_apps_units` from the
# one composition app list; a second instance list here would let provisioning
# and the installer disagree about which process owns an app.
#
# What remains is genuinely role-local and independent of AGS app ownership:
#   - stop/mask dunst before the notifications overlay starts, so the overlay can
#     own org.freedesktop.Notifications (dunst is the fallback, not a racer);
#   - pin the directory handler for the capture tool's "Show in folder" action.
#
# gui_tools runs BEFORE ags-apps-units in bootstrap order precisely so dunst is
# out of the way when the installer starts the always-on notification instance.

# gui_tools_xdg_state_home: kept for parity with the sibling roles and for any
#   future state-dir need. The per-instance AGS log dir is now ensured by
#   ags_apps_units (`<state>/ags`), not here.
gui_tools_xdg_state_home: "{{ ansible_facts.env.XDG_STATE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/state', true) }}"

# gui_tools_masked_user_units: the systemd --user unit(s) that must be stopped
#   and masked so the notification overlay can own the notification bus.
gui_tools_masked_user_units:
  - dunst.service
