# Assets role vars (Story 2.6; pinned corpus since S1).
#
# The role deploys the asset kinds into the install spine that the filesystem
# role (2.5) created (FR-17, chaining-spine.md). Since S1 the corpus is a PINNED
# DATA REPO (spine AD-6/AD-13): the role shallow-clones `assets.repo` at
# `assets.tag` ONCE into <install>/assets/<tag>/, drops the clone's .git, records
# the tag in <install>/assets/pinned, and every copy reads that checkout. No task
# reads a composition-repo tree or the network after the clone.
#
# The desired asset list lives in dotfiles/provisioning/assets.yaml (Story 2.1),
# whose `assets:` block is the single source of truth for repo/tag/classes. Ansible
# does NOT read manifests — the role mirrors the pin here and a structural test
# locks parity (TestAssetsVars.test_parity_with_manifest).

# assets_repo / assets_pinned_tag / assets_classes: the mirror of the manifest's
#   `assets:` block (spine AD-6). `assets_classes` is the destination class map:
#   class name -> {dest, schema}, class-local and never an absolute path.
assets_repo: https://github.com/RandomGenericUsername/dotfiles-assets
assets_pinned_tag: v0.21.3
assets_classes:
  icons: { dest: icons, schema: icons/schema.json }
  templates: { dest: templates, schema: "**/*.vars.schema.json" }
  configs: { dest: configs, schema: null }
  content: { dest: content, schema: null }
  desktop: { dest: desktop, schema: desktop/desktop.yaml }
  skins: { dest: skins, schema: skins/schema.json }

# assets_schema_support: the AD-12 consumer support WINDOW — the one
#   `schema_major` this consumer accepts, per SCHEMA-BEARING class. The corpus
#   states each contract's major in a repo-local file (catalog.yaml maps them:
#   icons/schema.json, templates/**/*.vars.schema.json, desktop/desktop.yaml,
#   skins/schema.json), and the major moves INDEPENDENTLY of the repo tag. A
#   tag that ships a contract this consumer cannot parse must fail BEFORE the
#   first copy, not deploy a corpus whose shapes the renderer reads wrongly.
#
#   `configs` and `content` are deliberately ABSENT: they ship no schema file
#   (catalog.yaml: `schema: null` / `schema_major: null`). An absent version is
#   the statement that there is no contract to version, not a gap to fill in.
#
#   The role reads every contract from the pinned checkout after the clone and
#   asserts its major equals the value here (icons + desktop + skins are
#   slurped, templates are found with `**/*.vars.schema.json` and slurped one
#   by one), naming the offending file and this window in the fail_msg.
#   `verify` mirrors the map as `verify_assets_schema_support` and re-asserts
#   the DEPLOYED copies; deploy-coverage locks the two maps equal.
assets_schema_support:
  icons: 1
  templates: 1
  desktop: 1
  skins: 2

# assets_checkout_root / assets_pinned_file: the fetched unit and its pin.
#   The checkout lands at <install>/assets/<tag>/ (the only new spine path,
#   AD-7) and the pin file sits BESIDE the tag dir, one line, exactly the
#   cli-tools/<name>/pinned shape. Trim lock: both consume the same validated
#   {{ install_dir | trim }} value the fail-loud assert enforces.
assets_checkout_root: "{{ install_dir | trim }}/assets/{{ assets_pinned_tag }}"
assets_pinned_file: "{{ install_dir | trim }}/assets/pinned"

# assets_weg_bin_dir: uv's executable directory where the cli_tools role (2.4)
#   installs `weg` via `uv tool install`. Resolved EXACTLY as uv does (and in
#   lockstep with cli_tools_bin_dir): $UV_TOOL_BIN_DIR -> $XDG_BIN_HOME ->
#   $HOME/.local/bin. The previous value hardcoded $HOME/.local/bin, which
#   under a custom XDG layout points at a dir `weg` is never installed to, so
#   "Ensure weg is available" failed on a fresh machine (VM-verified 2026-08-19).
#   Uses ansible_facts.env (NOT the deprecated top-level ansible_env fact).
assets_weg_bin_dir: >-
  {{ ansible_facts.env.UV_TOOL_BIN_DIR
     | default(ansible_facts.env.XDG_BIN_HOME | default(ansible_facts.env.HOME + '/.local/bin', true), true) }}

# assets_deploy_dirs: the install-spine segments this role deploys into.
#   Re-ensured as directories before the unarchive task (unarchive does NOT
#   create its `dest`); the filesystem role (2.5) already created them on the
#   bootstrap chain, this keeps the role self-contained on a direct run.
#   config-in-spine (2026-08-16): tpr-templates land at
#   config/theme-producer/templates and weg-effects at config/weg.
#   REQ-020: `skins` is the canonical skin-plane root the runtime reads FIRST
#   (`<install>/skins`, dotfiles-runtime `derive._skin_roots`).
assets_deploy_dirs:
  - wallpapers
  - icon-templates
  - icon-mappings
  - config/theme-producer/templates
  - config/weg
  - skins

# assets_wallpapers_tarball: the wallpaper archive INSIDE the pinned checkout.
#   Absolute (it derives from the install spine), so the task uses it verbatim.
assets_wallpapers_tarball: "{{ assets_checkout_root }}/content/wallpapers/wallpapers.tar.gz"

# assets_wallpapers_dest: the unarchive dest. Trim lock: consumes the same
#   validated `{{ install_dir | trim }}` value the fail-loud assert enforces.
assets_wallpapers_dest: "{{ install_dir | trim }}/wallpapers"

# assets_tpr_pinned_tag / assets_tpr_templates_source: REQ-010, the same
#   pinned-checkout shape for the sole palette producer. tpr ships its
#   projection catalog at `src/theme_producer/defaults/templates/`; the
#   runtime's TprAdapter reads the DEPLOYED copy at
#   `<install>/config/theme-producer/templates` (never the checkout). The pin
#   derives from `cli_tools_tags.tpr` — the fact the cli_tools role publishes
#   from the composition manifest (REQ-014) — so a manifest bump moves this
#   path too. The role asserts the resolved dir exists before the copy so a
#   missing/mis-pinned checkout fails loud instead of silently deploying
#   nothing. The checkout dir is the cli_tools entry `name` (`tpr`), matching
#   <install>/cli-tools/<name>/<tag>; only the DEPLOYED config dir uses the
#   `theme-producer` name.
assets_tpr_pinned_tag: "{{ cli_tools_tags.tpr }}"
assets_tpr_templates_source: >-
  {{ install_dir | trim }}/cli-tools/tpr/{{ assets_tpr_pinned_tag }}/src/theme_producer/defaults/templates

# assets_copies: the directory-based asset kinds as (name, kind, source,
#   target) mirroring the manifest. Since S1 every `source` is an ABSOLUTE path
#   INTO the pinned assets checkout, so the synchronize task uses it verbatim
#   (no repo-root prefix). Every `source` ENDS WITH `/` so synchronize lands the
#   contents directly in the target — rsync trailing-slash semantics (no
#   accidental nested dir), with delete: true making the deploy an exact mirror
#   of the pinned tree. `target` IS the AssetKind.spine_segment() of the kind —
#   parity-locked by the structural test.
#
# config-in-spine (2026-08-16): the tpr-templates target moved from
#   <install>/tpr-templates to <install>/config/theme-producer/templates
#   (TPR's templates are TOOL CONFIG — the config-links role symlinks
#   ~/.config/theme-producer -> <install>/config/theme-producer,
#   so tpr's native XDG discovery finds them through the link). icon-templates
#   and icon-mappings stay under the spine root (machine assets, not tool
#   configs — they have no XDG stop to satisfy).
#
# btop authored themes are NOT in this list: they are shipped into
#   <install>/config/btop/themes/ by the btop_config role (its with_fileglob
#   seam), which reads the same pinned checkout via
#   btop_config_authored_themes_repo_dir. There is no AssetKind for them, and
#   the destination is owned by that role — see AD-7.
#
# REQ-020: the `skins` class is ROOT-LEVEL DATA (manifests, templates, the
#   vendored contracts/PIN and the local schema envelope) deployed verbatim to
#   <install>/skins. Like icons, it has no XDG stop; unlike a tool config it is
#   never linked into ~/.config. It is data only: no template render, no
#   validation script, no runtime reconcile. The runtime reads manifests and
#   templates from <install>/skins before config/skins or the pinned assets
#   checkout (dotfiles-runtime derive._skin_roots).
assets_copies:
  - { name: icon-templates, kind: icon-template, source: "{{ assets_checkout_root }}/icons/templates/", target: icon-templates }
  - { name: icon-mappings, kind: icon-mapping, source: "{{ assets_checkout_root }}/icons/mappings/", target: icon-mappings }
  - { name: skins, kind: skins, source: "{{ assets_checkout_root }}/skins/", target: skins }

# assets_checkout_copies: the copies whose source is already an ABSOLUTE
#   install-spine path (a pinned CLI checkout), deployed by the same
#   synchronize module in its own loop so the repo-root prefix is never applied
#   to it. Partition, not a duplicate list: the two loops together cover
#   `assets_copies` ∪ `assets_checkout_copies` exactly (parity-locked).
assets_checkout_copies:
  - { name: tpr-templates, kind: tpr-template, source: "{{ assets_tpr_templates_source }}/", target: config/theme-producer/templates }

# (2026-09-07) icon-mappings is CONVERGE again, like every other copy: the
# authoring model is repo-authoritative — the editor targets the repo
# manifest when a checkout is present (spine copy otherwise) and bootstrap
# propagates repo edits to the spine on every run. A brief seed-once
# experiment (machine-owned manifest) was reverted the same day: it broke
# the "edit repo, bootstrap, deployed" workflow, which is the user's intent.

# assets_weg_effects_target: the weg dump-effects emit target — a FILE, not a
#   dir; never a member of assets_deploy_dirs or assets_copies. Trim lock.
#   config-in-spine (2026-08-16): moved from <install>/weg-effects.yaml to
#   <install>/config/weg/effects.yaml (WEG's effects catalog is TOOL CONFIG —
#   ~/.config/weg is symlinked to <install>/config/weg, so weg's native XDG
#   discovery of ~/.config/weg/effects.yaml finds it through the link).
assets_weg_effects_target: "{{ install_dir | trim }}/config/weg/effects.yaml"
