# power_options role tasks (REQ-003).
#
# Arch-only in practice: the power-options package and /etc/power-options come
# from the Arch package set. On another distro the directory is absent and every
# mutating task is skipped. The playbook runs with become:true (the profile
# files and the daemon are system-scoped).
- name: Check the power-options profile directory
  ansible.builtin.stat:
    path: "{{ power_options_profile_dir }}"
  register: power_options_profile_dir_stat
  changed_when: false

- name: Check the expected power-options Bluetooth profiles exist
  ansible.builtin.stat:
    path: "{{ power_options_profile_dir }}/{{ item }}"
  loop: "{{ power_options_bt_profiles }}"
  register: power_options_profile_files
  when: power_options_profile_dir_stat.stat.isdir | default(false)

- name: Assert every expected power-options profile exists
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      the power-options profile {{ item.item }} is missing from
      {{ power_options_profile_dir }}/. The package layout changed; update
      power_options_bt_profiles instead of silently leaving Bluetooth blocked.
  loop: "{{ power_options_profile_files.results }}"
  when: power_options_profile_dir_stat.stat.isdir | default(false)

- name: Disable Bluetooth soft-blocking in the power profiles
  ansible.builtin.replace:
    path: "{{ power_options_profile_dir }}/{{ item }}"
    regexp: '^block_bt = true$'
    replace: 'block_bt = false'
  loop: "{{ power_options_bt_profiles }}"
  register: power_options_bt_replace
  when: power_options_profile_dir_stat.stat.isdir | default(false)

- name: Record that the Bluetooth profile policy is applied
  ansible.builtin.copy:
    dest: "{{ power_options_marker }}"
    content: "{{ power_options_marker_content }}"
    mode: "0644"
  register: power_options_marker_write
  when: power_options_profile_dir_stat.stat.isdir | default(false)

# The daemon reads the TOMLs at startup; `refresh-full` alone keeps the old
# in-memory profile (observed live: Powersave still blocked after the file
# rewrite). Restart first, then apply the current profile. The marker write is
# part of the trigger so a policy_version bump restarts an already-false set.
- name: Restart power-options to reload the edited profiles
  ansible.builtin.systemd_service:
    name: power-options.service
    state: restarted
  when:
    - power_options_profile_dir_stat.stat.isdir | default(false)
    - power_options_bt_replace.changed | default(false)
      or power_options_marker_write.changed | default(false)

- name: Refresh the active power profile after changing the Bluetooth setting
  ansible.builtin.command:
    argv:
      - power-daemon-mgr
      - refresh-full
  changed_when: false
  when:
    - power_options_profile_dir_stat.stat.isdir | default(false)
    - power_options_bt_replace.changed | default(false)
      or power_options_marker_write.changed | default(false)
