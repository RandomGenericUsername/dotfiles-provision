# state_links role vars — provisioning-owned stable links for the non-runtime
# palette and generated-appearance consumers (Generations v3, dotfiles-v3
# docs/107 §2.7 and docs/108 W-2.5).

# state_links_xdg_state_home: the runtime-owned state home. Honors
#   $XDG_STATE_HOME with the spec default ~/.local/state, via
#   ansible_facts.env (F4 lock). One XDG read for the whole role.
state_links_xdg_state_home: "{{ ansible_facts.env.XDG_STATE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/state', true) }}"

# state_links_state_current_dir / _palette_dir / _appearance_dir: the single
#   committed `current` pointer plus the generation-local palette and generated
#   appearance directories the stable links name. Never a generation-specific
#   path: `current` is the one atomic hop.
state_links_state_current_dir: "{{ state_links_xdg_state_home | trim }}/dotfiles/current"
state_links_state_current_palette_dir: "{{ state_links_state_current_dir }}/palette"
state_links_state_current_appearance_dir: "{{ state_links_state_current_dir }}/appearance"

# state_links_spine_config_dir: the config-in-spine root the config-links role
#   exposes at ~/.config/<name>. The stable links are files INSIDE these
#   provisioning-owned dirs; no AGS app spine link (config/<configDir> ->
#   <install>/apps/<tag>) is ever a destination here.
state_links_spine_config_dir: "{{ install_dir | trim }}/config"

# state_links_consumers: one stable link per non-runtime consumer.
#   `spine` is the destination relative to <install>/config; `base` is the
#   generation directory under state/current (`palette` or `appearance`); and
#   `target` is the artifact inside it. The runtime never repoints these links;
#   a new generation is visible through `current`.
#
#   wlogout was the first generated-appearance consumer. Phase 3A-4 adds the
#   format-aware GTK3, GTK4 and rofi consumers, and the window-role slice adds
#   kitty: gtk/rofi import their sibling appearance sheet/artifact last, kitty
#   imports its generated `appearance.conf` between colors and local.conf, and
#   each link resolves to the runtime's `current/appearance/<consumer>.<ext>`.
#   None points through a generation directory or an `<install>/apps/<tag>`
#   path.
state_links_consumers:
  - { base: palette, spine: gtk-3.0/colors.css, target: colors.gtk.css }
  - { base: palette, spine: gtk-4.0/colors.css, target: colors.adw.css }
  - { base: palette, spine: rofi/colors.rasi, target: colors.rasi }
  - { base: palette, spine: btop/themes/colors.btop.theme, target: colors.btop.theme }
  - { base: appearance, spine: wlogout/appearance.css, target: wlogout.css }
  - { base: appearance, spine: gtk-3.0/appearance.css, target: gtk3.css }
  - { base: appearance, spine: gtk-4.0/appearance.css, target: gtk4.css }
  - { base: appearance, spine: rofi/appearance.rasi, target: rofi.rasi }
  - { base: appearance, spine: kitty/appearance.conf, target: kitty.conf }
