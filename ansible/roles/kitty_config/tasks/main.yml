# Kitty-config role — renders the user's kitty.conf from the Jinja template that
# ships in the pinned `dotfiles-assets` corpus (`templates/kitty/kitty.conf.j2`,
# read from <install>/assets/<tag>/ since S3) into the config-in-spine home
# <install>/config/kitty/kitty.conf, resolving the runtime palette include to the
# actual provisioned state path. The role supplies the value; the corpus supplies
# the file and its one-name contract (spine AD-8).
#
# Design:
# - The FIRST task is the fail-loud install_dir seam assert, verbatim from the
#   sibling roles (zsh_config / wlogout_config). install_dir is deliberately
#   never defaulted (group_vars/all.yml), so a missing spine root aborts before
#   any template evaluates.
# - The rendered kitty.conf includes, in order:
#     include <state>/dotfiles/current/colors.kitty   (runtime palette, absolute)
#     include appearance.conf                          (generated skin projection
#                                                       through the stable link)
#     include local.conf                               (optional user overrides)
#     auto_reload_config -1                            (negative seconds =
#                                                       DISABLED; kitty 0.48
#                                                       types this option as a
#                                                       float, so `no` is a parse
#                                                       error. The runtime
#                                                       reloader signals SIGUSR1
#                                                       deterministically)
# - local.conf is created ONLY IF ABSENT (`copy` with `force: false`) so a
#   user's hand-written overrides survive re-provisioning. kitty.conf itself is
#   owned by provisioning and re-rendered on every run (content-compare
#   idempotent).
# - Runs AFTER the runtime owns current/colors.kitty (sibling change) and
#   BEFORE config_links (which symlinks ~/.config/kitty).
# - The `template`/`copy` modules have full check-mode support — no --check gate.
# - User-scoped: NO become.

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that: install_dir is defined and install_dir | trim | length > 0
    fail_msg: >-
      install_dir is undefined or empty — the kitty_config role requires the
      install_dir seam extra-var (the orchestrator resolves
      $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)

- name: Ensure kitty config dir exists in the spine
  ansible.builtin.file:
    path: "{{ kitty_config_spine_dir }}"
    state: directory

# The corpus body owns the app-owned structure. Render it to a temporary
# file, then write the final kitty.conf with the ONE provisioning-owned hop
# (appearance.conf before local.conf). Assembling in one pass keeps the
# render idempotent: re-rendering the corpus body into the final file would
# drop the hop and make every run report a change.
- name: Render the pinned kitty config body
  ansible.builtin.template:
    src: "{{ kitty_config_assets_templates_dir }}/kitty/kitty.conf.j2"
    # In a dry run there is no intermediate file to read back, so render
    # straight to the final destination (check mode writes nothing). In a real
    # run render the corpus body to the scratch path, then assemble once.
    dest: >-
      {{ (kitty_config_spine_dir ~ '/kitty.conf')
         if ansible_check_mode
         else kitty_config_corpus_template_path }}
  # Scratch render only; the final assembled kitty.conf below is the task that
  # reports change.
  changed_when: false

- name: Write kitty.conf with the generated appearance include
  ansible.builtin.copy:
    content: >-
      {{ lookup('ansible.builtin.file', kitty_config_corpus_template_path,
      rstrip=false) | replace('include local.conf',
      kitty_config_appearance_include) }}
    dest: "{{ kitty_config_spine_dir }}/kitty.conf"
  when: not ansible_check_mode

- name: Remove the scratch kitty config body
  ansible.builtin.file:
    path: "{{ kitty_config_corpus_template_path }}"
    state: absent
  changed_when: false
  when: not ansible_check_mode

- name: Ensure local.conf exists (never clobber user overrides)
  ansible.builtin.copy:
    content: ""
    dest: "{{ kitty_config_spine_dir }}/local.conf"
    force: false
