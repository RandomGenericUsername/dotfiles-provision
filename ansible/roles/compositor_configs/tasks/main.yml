# Compositor configs role (Story 2.9 / AGS-for-Waybar swap 2026-08-18,
# Epic 4 single-source; pinned corpus since S2) — renders the static skeletons
# from the PINNED assets `configs/` class (`<install>/assets/<tag>/configs/
# {hypr,hyprpaper,rofi}/`, the checkout the assets role materialized) into the
# config-in-spine dirs.
# The AGS apps are NOT placed, generated or validated here. The only AGS
# installer, `ags_apps_units`, owns every app tag and its config/spine/XDG
# links; each app tag carries its own sources and the platform-produced
# icons.json (AD-37). This role is therefore purely compositor config
# (hypr/hyprpaper/rofi/desktop entries).
# Palette fragments are NOT copied here: the runtime seeder owns the
# consumer palette paths (R2 symlinks → current/, rt-4-2) and
# `wallpaper set` keeps them current (FR-19, chaining-spine.md).
#
# Design (locked in Story 2.9 Dev Notes — updated per owner decision
# 2026-08-26: skeletons are repo-authoritative, force:true):
# - The FIRST task is the fail-loud install_dir seam assert, copied verbatim
#   from the filesystem/assets roles: install_dir is
#   deliberately never defaulted (group_vars/all.yml), so an undefined spine
#   root must abort with a friendly message before any task evaluates.
# - Skeletons are repo-authoritative (`force: true`, idempotent): every
#   bootstrap converges to the repo, n runs give the same result. Legacy
#   cleanup tasks remove superseded same-name files (e.g. hypr/hyprland.conf
#   → hypr/hyprland.lua) and relocated directories (the old settings-panel
#   services dir → ags/services, extract-ags-shared-components). NO `creates:`.
# - Skeleton placement uses `ansible.builtin.template` with PER-FILE entries
#   (compositor_configs_skeleton_files), NOT a directory source: review finding
#   2026-08-12 proved `copy` with a directory `src` + `force: false` + a
#   pre-existing dest dir is a SILENT NO-OP (nothing is ever placed). Per-file
#   copy is the only shape where force: false means "transfer if absent".
#   `template` (not `copy`) because `hypr/hyprland.lua` carries one render-time
#   token — the module include dir, resolved from the host's XDG config home.
#   The other 14 skeletons have no Jinja and render byte-identically.
# - S2: the skeleton sources are the PINNED assets corpus
#   (compositor_configs_assets_configs_dir), so a stat+assert on the pinned
#   `configs/` class runs before the placements: a missing or mis-pinned
#   checkout must fail loud and named, not per-file with "Could not find".
# - template module check-mode support is FULL (action plugin predicts changed
#   without writing) — the skeleton placements need NO `not ansible_check_mode`
#   gate.
# - The icon-manifest generation (icons.yaml → icons.json) stays: it converts
#   authored INPUTS (icon-mappings), not generated output.
# - User-scoped privilege context: NO become/become_user anywhere.
# - No composition-repo paths: since S4 every source is an absolute path into the
#   pinned checkout (skeletons under {{ compositor_configs_assets_configs_dir }},
#   desktop entries + toggle-touchpad under
#   {{ compositor_configs_assets_desktop_dir }}). Nothing here reads
#   {{ playbook_dir }}.
#   The deferred "default colors fallback" is a Phase 2 concern, NOT added here.
# - Don't-clobber guard (Story 1.12, RETIRED in Epic 4): the guard used to
#   protect runtime R2 symlinks from fragment-copy overwrites. The fragment
#   copies are deleted (rt-4-1) and the R2 symlinks are created by the
#   runtime seeder itself (rt-4-2), so there is nothing left to guard —
#   provisioning never writes palette fragments anywhere. The
#   compositor_configs_state_current_dir var is retained for documentation.
# - copy does NOT create dest parents for file sources — the config dirs are
#   re-ensured first (mirror of the 2.6 "Ensure asset deploy targets exist"
#   pattern) so a direct compositor-configs.yaml run is self-contained.
# - No manifest parity: there is NO dotfiles/provisioning/compositor-configs.yaml
#   manifest — the five manifests are locked in Story 2.1; the compositor
#   content contract lives in the skeleton files (2.8)
#   and is locked by the structural test.

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that: install_dir is defined and install_dir | trim | length > 0
    fail_msg: >-
      install_dir is undefined or empty — the compositor_configs role requires
      the install_dir seam extra-var (the orchestrator resolves
      $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)

- name: Ensure compositor config dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop: "{{ compositor_configs_config_dirs }}"

- name: Check the pinned assets configs class exists
  ansible.builtin.stat:
    path: "{{ compositor_configs_assets_configs_dir }}"
  register: compositor_configs_assets_configs_check

- name: Assert the pinned assets configs class is present
  ansible.builtin.assert:
    that: compositor_configs_assets_configs_check.stat.isdir | default(false)
    fail_msg: >-
      the pinned assets configs class is missing at
      {{ compositor_configs_assets_configs_dir }} — the assets role clones
      dotfiles-assets at {{ compositor_configs_assets_pinned_tag }} before this
      role runs (bootstrap order), so a missing checkout means the pin is wrong
      or the clone failed; rendering from a missing source would deploy nothing
  when: not ansible_check_mode

- name: Place compositor skeleton files
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "{{ item.dest }}"
    force: true
  loop: "{{ compositor_configs_skeleton_files }}"
  # --check on a machine that has never fetched the corpus: the assets role's
  # clone is check-gated, so the checkout does not exist yet and there is
  # nothing to render. Skip (no mutation, no false prediction) instead of
  # failing the dry run; a REAL run reaches the assert above first and fails
  # loud on a bad pin. A provisioned machine still predicts every change.
  when: not ansible_check_mode or compositor_configs_assets_configs_check.stat.isdir | default(false)

# Desktop entries (spine AD-10 layers 1-3). The corpus ships the entries plus
# `desktop.yaml`; layer 2 is HERE and it runs BEFORE the copy:
#   * a missing `requires` binary FAILS the run, naming the entry and the binary
#     (a menu entry that launches nothing is the defect AD-10 exists for);
#   * a missing `optional` binary is reported and THAT ENTRY is skipped — the
#     payload's package belongs to another role, so its absence must not fail a
#     provision, and a dead entry must not be deployed either.
# Assets declares the lists; this role resolves them against the target, which is
# the whole reason the lists do not live in this repo (a data repo cannot know a
# host). `command -v` is the resolution: it honors the target's PATH, so a user
# with a ~/.local/bin install passes exactly like a package install.
- name: Check the pinned assets desktop class (entries, contract, helper script)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ compositor_configs_assets_desktop_dir }}"
    - "{{ compositor_configs_assets_desktop_dir }}/applications"
    - "{{ compositor_configs_assets_desktop_dir }}/scripts/toggle-touchpad"
    - "{{ compositor_configs_desktop_contract_file }}"
  register: compositor_configs_desktop_sources_check

- name: Assert the pinned assets desktop class is present
  ansible.builtin.assert:
    that:
      - compositor_configs_desktop_sources_check.results | selectattr('stat.exists') | list | length == compositor_configs_desktop_sources_check.results | length
    fail_msg: >-
      the pinned assets desktop class is incomplete under
      {{ compositor_configs_assets_desktop_dir }} — the assets role clones
      dotfiles-assets at {{ compositor_configs_assets_pinned_tag }} before this
      role runs (bootstrap order); a missing entries dir, helper script or
      desktop.yaml means the pin is wrong or the clone failed, and deploying from
      it would ship nothing (or an unresolved entry) silently
  when: not ansible_check_mode

- name: Read the desktop class contract
  ansible.builtin.slurp:
    src: "{{ compositor_configs_desktop_contract_file }}"
  register: compositor_configs_desktop_contract_raw
  when: not ansible_check_mode

- name: Parse the desktop class contract
  ansible.builtin.set_fact:
    compositor_configs_desktop_contract: "{{ compositor_configs_desktop_contract_raw.content | b64decode | from_yaml }}"
  when: not ansible_check_mode

- name: Assert the contract and this role describe the same desktop entries
  ansible.builtin.assert:
    that:
      - compositor_configs_desktop_contract.entries | map(attribute='file') | sort | list == compositor_configs_desktop_entries | map(attribute='file') | sort | list
    fail_msg: >-
      the pinned desktop class contract ({{ compositor_configs_desktop_contract_file }})
      and this role's compositor_configs_desktop_entries disagree — the deployed
      set and the layer-2 resolution must be the same set, or a deployed entry
      would never have had its binaries resolved (a stale pin bump in one place)
  when: not ansible_check_mode

- name: Build the desktop-entry binary resolution list
  ansible.builtin.set_fact:
    compositor_configs_desktop_binary_pairs: >-
      {%- set pairs = [] -%}
      {%- for entry in compositor_configs_desktop_contract.entries -%}
      {%- for binary in entry.requires -%}
      {%- set _ = pairs.append({'file': entry.file, 'binary': binary, 'kind': 'required'}) -%}
      {%- endfor -%}
      {%- for binary in entry.optional | default([]) -%}
      {%- set _ = pairs.append({'file': entry.file, 'binary': binary, 'kind': 'optional'}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ pairs }}
  when: not ansible_check_mode

- name: Resolve every desktop-entry binary against the target PATH (layer 2)
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - 'command -v "$1" >/dev/null 2>&1'
      - sh
      - "{{ item.binary }}"
  loop: "{{ compositor_configs_desktop_binary_pairs | default([]) }}"
  loop_control:
    label: "{{ item.kind }}: {{ item.file }} -> {{ item.binary }}"
  register: compositor_configs_desktop_binary_probe
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert every required desktop-entry binary is installed
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: >-
      desktop entry {{ item.item.file }} requires '{{ item.item.binary }}', which
      is not on PATH — the entry would appear in rofi's drun mode and launch
      nothing (spine AD-10). Install the package that provides it (the packages
      role) or provision the desktop entries from a corpus whose contract does
      not require it
  loop: "{{ compositor_configs_desktop_binary_probe.results | default([]) | selectattr('item.kind', 'equalto', 'required') | list }}"
  loop_control:
    label: "{{ item.item.file }} -> {{ item.item.binary }}"
  when: not ansible_check_mode

- name: Report desktop entries skipped for a missing optional binary
  ansible.builtin.debug:
    msg: >-
      desktop entry {{ item.item.file }} is SKIPPED: optional binary
      '{{ item.item.binary }}' is not installed (the entry would launch nothing).
      The provision continues; that one menu entry is not deployed
  loop: "{{ compositor_configs_desktop_binary_probe.results | default([]) | selectattr('item.kind', 'equalto', 'optional') | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item.file }} -> {{ item.item.binary }}"

- name: Resolve the desktop entries to deploy (drop the skipped ones)
  ansible.builtin.set_fact:
    compositor_configs_desktop_skipped_files: "{{ compositor_configs_desktop_binary_probe.results | default([]) | selectattr('item.kind', 'equalto', 'optional') | rejectattr('rc', 'equalto', 0) | map(attribute='item') | map(attribute='file') | list }}"

- name: Select the deployable desktop entries
  ansible.builtin.set_fact:
    compositor_configs_desktop_deploy_entries: >-
      {{ compositor_configs_desktop_entries
         | rejectattr('file', 'in', compositor_configs_desktop_skipped_files) | list }}

- name: Install desktop helper scripts (touchpad toggle for XF86 binds)
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ item.dest }}"
    force: true
    mode: "0755"
  loop: "{{ compositor_configs_bin_scripts }}"

# App desktop-entry overrides (e.g. TIDAL's Electron /dev/shm flag). The dest
# parent is not created by copy, so it is ensured first — and it must exist
# anyway for the entry to be discoverable by rofi's drun mode.
- name: Ensure XDG data applications dir exists
  ansible.builtin.file:
    path: "{{ compositor_configs_xdg_data_home }}/applications"
    state: directory

- name: Install application desktop entry overrides
  ansible.builtin.copy:
    src: "{{ compositor_configs_assets_desktop_dir }}/applications/{{ item.file }}"
    dest: "{{ item.dest }}"
    force: true
    mode: "0644"
  loop: "{{ compositor_configs_desktop_deploy_entries }}"

- name: Remove legacy hyprland.conf skeleton (superseded by hyprland.lua)
  ansible.builtin.file:
    path: "{{ compositor_configs_spine_config_dir }}/hypr/hyprland.conf"
    state: absent
  when: not ansible_check_mode
