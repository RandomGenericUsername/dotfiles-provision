# Display-manager role vars (working Hyprland login).
#
# DM type (2026-08-19): the provisioned login manager is SDDM + the Pixie
# theme, enabled for a Wayland greeter.
#   SDDM + Pixie — the current, user-approved login. Pixie is a clean
#     Material-Design-3 / Google-Pixel theme. SDDM is configured with a
#     WAYLAND greeter (DisplayServer=wayland) so no X11/GPU grab happens —
#     this avoids the hard-freeze we hit with X11 greeters (lightdm/sddm
#     X11 greeter grabbing the GPU before Hyprland). Hyprland recommends SDDM
#     with its Wayland greeter.
#   greetd + regreet — retained as a fallback path (the previous approach),
#     still fully configured via the regreet templates so a user can switch
#     back by re-enabling greetd.
#
# Distro note: SDDM + Pixie works on Arch (sddm + qt6 in repos; Pixie from
# GitHub main, Qt6 branch). On Debian-family SDDM is available too; the Pixie
# theme is installed the same way. The role keeps the pieces data-driven so
# a distro override can pick the greetd fallback if needed.

# display_manager_type: "sddm-pixie" (default) or "greetd-regreet".
display_manager_type: sddm-pixie

# display_manager_enable_service: the systemd service to enable for the chosen
#   DM type (sddm, or greetd for the fallback).
display_manager_enable_service: "{{ 'sddm' if display_manager_type == 'sddm-pixie' else 'greetd' }}"

# ── The template source (assets `templates` class, spine AD-9) ────────────────
# S3: the five DM templates moved to `dotfiles-assets` (`templates/display-manager/`).
# The role keeps the CONCERN — type selection, package sets, the Pixie repo pin,
# service enablement/disablement, the login-timeout patch and every `become` — and
# renders the file bodies from the pinned checkout the assets role materialized
# before this role runs. Parity-locked to the manifest's `assets.tag` by the
# required-var parity test; trim lock on the seam.
# v0.6.0 (assets req-006) added the `[Wayland] CompositorCommand` body. v0.5.0
# rendered `DisplayServer=wayland` with no compositor at all — the BUG-004
# session bounce.
display_manager_assets_pinned_tag: v0.6.0
display_manager_assets_templates_dir: "{{ install_dir | trim }}/assets/{{ display_manager_assets_pinned_tag }}/templates"

# ── SDDM + Pixie (default) ───────────────────────────────────────────────────

# display_manager_sddm_packages: SDDM (Qt6-capable) + the Qt6 modules Pixie
#   needs (QtQuick.Effects comes from qt6-declarative; qt6-svg for icons), plus
#   the WAYLAND GREETER COMPOSITOR. SDDM's Wayland greeter is a compositor
#   client: DisplayServer=wayland without one makes SDDM fall back to
#   `x11-user`, which starts the login on a new VT and tears it down after
#   ~90 s (BUG-004: `Session started false`). `weston` is SDDM's implicit
#   default compositor (`weston --shell=kiosk`).
#   Name-compatible with Debian-family (sddm, qt6-declarative, qt6-svg, weston).
display_manager_sddm_packages:
  - sddm
  - qt6-declarative
  - qt6-svg
  - weston

# display_manager_pixie_repo: the Pixie SDDM theme (Qt6 main branch) source.
# display_manager_pixie_repo_ref: a COMMIT, not `main` — the login-timeout patch
#   below edits Main.qml, so a moved branch could silently change the patched
#   shape (the fail-closed assert would then stop provisioning). Pin the commit
#   the patch was tested against:
#   1e1a863761f742e8d509d569382b17c112e29fdc = xCaptaiN09/pixie-sddm `main`
#   resolved 2026-10-26 (the planning-time commit). Bump procedure: re-resolve
#   `git ls-remote https://github.com/xCaptaiN09/pixie-sddm.git refs/heads/main`,
#   verify `interval: 5000` still matches exactly once and the theme still
#   starts under weston on the host, then update this pin + verify_pixie_repo_ref
#   and commit both.
display_manager_pixie_repo: https://github.com/xCaptaiN09/pixie-sddm.git
display_manager_pixie_repo_ref: 1e1a863761f742e8d509d569382b17c112e29fdc

# display_manager_pixie_themedir: where the theme is installed for SDDM.
display_manager_pixie_themedir: /usr/share/sddm/themes/pixie

# display_manager_sddm_conf: the theme/engine config SDDM reads.
display_manager_sddm_conf: /etc/sddm.conf.d/10-dotfiles.conf

# display_manager_sddm_display_server: "wayland" (greeter under a Wayland
#   compositor — no X11 GPU grab, the freeze fix) or "x11" (legacy).
#   Do NOT switch to x11 to work around a missing compositor: it reintroduces
#   the X11/GPU hard-freeze this role exists to avoid.
display_manager_sddm_display_server: wayland

# display_manager_sddm_compositor_command: the `[Wayland] CompositorCommand`
#   rendered into the SDDM config (assets v0.6.0 req-006). weston is installed
#   above and asserted present after the package task; the same value is
#   mirrored by verify. A different compositor (cage, sway, …) means changing
#   BOTH this command and the package set, and keeping the preflight in sync.
display_manager_sddm_compositor_command: "weston --shell=kiosk"

# display_manager_disable_services: display managers this role disables so
#   SDDM is the single active login (they would grab the GPU / conflict).
#   Includes the greetd fallback path's services.
display_manager_disable_services:
  - greetd
  - lightdm

# ── greetd + regreet fallback (only used when type == 'greetd-regreet') ──────

# display_manager_greeter_type: the greetd greeter engine (regreet graphical
#   or tuigreet TUI). Distro-aware default; overridable.
display_manager_greeter_type: "{{ 'regreet' if ansible_facts['os_family'] == 'Archlinux' else 'tuigreet' }}"

display_manager_packages_regreet:
  - greetd
  - greetd-regreet
  - cage
display_manager_packages_tuigreet:
  - greetd
  - greetd-tuigreet

display_manager_packages: >-
  {{ display_manager_packages_regreet if display_manager_greeter_type == 'regreet' else display_manager_packages_tuigreet }}

display_manager_greeter_user: greeter
display_manager_greeter_shell: /usr/bin/false
