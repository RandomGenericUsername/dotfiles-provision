# Display-manager role (provisioning a working Hyprland login).
#
# Proviison SDDM + the Pixie theme with a WAYLAND greeter. SDDM's Wayland
# greeter avoids the X11/GPU-grab that hard-froze Hyprland with X11 greeters
# (lightdm / sddm-X11) — it's the Hyprland-recommended and user-approved login.
#
# Role responsibilities (machine-level, become):
#   SDDM + Pixie (default):
#     1. Install sddm + Qt6 deps.
#     2. Fetch the Pixie theme (Qt6 main branch) -> /usr/share/sddm/themes/pixie.
#     3. Write /etc/sddm.conf.d/10-dotfiles.conf (theme=pixie,
#        DisplayServer=wayland, cursor theme).
#     4. Enable sddm; disable other DMs (greetd, lightdm).
#   greetd + regreet (fallback, retained): the old templates/tasks remain but
#     are gated on display_manager_type == 'greetd-regreet' so a user can
#     switch back without losing the working config.
#
# S3 (spine AD-9): the five template BODIES ship in the pinned `dotfiles-assets`
# corpus (`templates/display-manager/`) and are rendered from
# <install>/assets/<tag>/. What stays HERE is the concern this role owns and the
# corpus cannot: DM type selection, the package sets, the Pixie repo pin, the
# login-timeout patch, service enablement/disablement and every `become`.

- name: Assert fact-gathering provided HOME
  ansible.builtin.assert:
    that: ansible_facts.env.HOME is defined and ansible_facts.env.HOME | trim | length > 0
    fail_msg: >-
      ansible_facts.env.HOME is undefined — the display_manager role runs as
      root but relies on gather_facts; ensure gather_facts: true

# ── SDDM + Pixie (default) ────────────────────────────────────────────────────
- name: Install SDDM + Qt6 dependencies
  ansible.builtin.package:
    name: "{{ display_manager_sddm_packages }}"
    state: present
  become: true
  when: display_manager_type == 'sddm-pixie'

# BUG-004 (fail-closed greeter preflight): DisplayServer=wayland is useless
# without a Wayland compositor. SDDM's implicit default is `weston --shell=kiosk`
# (sddm.conf(5)); when the binary is missing it silently falls back to
# `DisplayServer=x11-user`, the login gets a new VT, and the session is torn
# down ~90 s later (`Session started false`). Assert the package landed instead
# of letting the role "succeed" into that fallback.
- name: Check the Wayland greeter compositor is installed
  ansible.builtin.shell: "command -v weston"
  register: display_manager_weston_check
  changed_when: false
  failed_when: false
  when: display_manager_type == 'sddm-pixie' and not ansible_check_mode

- name: Assert the Wayland greeter compositor is installed
  ansible.builtin.assert:
    that:
      - display_manager_weston_check.rc == 0
      - display_manager_weston_check.stdout | trim | length > 0
    fail_msg: >-
      `weston` is missing after the SDDM package install. DisplayServer=wayland
      requires a Wayland compositor; without one SDDM silently falls back to
      x11-user and tears the session down after ~90 s (BUG-004). Fix
      display_manager_sddm_packages / install weston — do not accept the
      x11-user fallback.
  become: true
  when: display_manager_type == 'sddm-pixie' and not ansible_check_mode

- name: Fetch the Pixie theme (Qt6)
  ansible.builtin.git:
    repo: "{{ display_manager_pixie_repo }}"
    dest: "{{ display_manager_pixie_themedir }}"
    version: "{{ display_manager_pixie_repo_ref }}"
    # The theme is fully MANAGED here: the login-timeout patch below edits
    # Main.qml after every fetch, which leaves the clone dirty and would make
    # later runs fail checkout without force. Force-reset on each run; the
    # patch task immediately re-applies.
    force: true
  become: true
  when: display_manager_type == 'sddm-pixie'

# BUG-004: the Pixie ref is pinned, but it is still a third-party tree. A blind
# `lineinfile` with `state: present` is a NO-OP when the pattern is absent (a
# moved/renamed timeout) and would silently restore the greeter auto-logout.
# Read the file first and fail unless the pattern matches exactly once; only
# then replace it.
- name: Read the Pixie theme login timeout source
  ansible.builtin.slurp:
    src: "{{ display_manager_pixie_themedir }}/Main.qml"
  register: display_manager_pixie_main_qml
  become: true
  when: display_manager_type == 'sddm-pixie' and not ansible_check_mode

- name: Assert the login-timeout patch matches exactly once
  ansible.builtin.assert:
    that:
      - >-
        (display_manager_pixie_main_qml.content | b64decode
         | regex_findall('(?m)^\\s*interval: 5000\\s*$')) | length == 1
    fail_msg: >-
      {{ display_manager_pixie_themedir }}/Main.qml must contain exactly one
      `interval: 5000` login-timeout line, but found
      {{ (display_manager_pixie_main_qml.content | b64decode
          | regex_findall('(?m)^\\s*interval: 5000\\s*$')) | length }}.
      The pinned Pixie commit changed shape; update the patch deliberately
      instead of silently no-opping (BUG-004).
  become: true
  when: display_manager_type == 'sddm-pixie' and not ansible_check_mode

- name: Fix SDDM theme login timeout
  ansible.builtin.lineinfile:
    path: /usr/share/sddm/themes/pixie/Main.qml
    regexp: '^\s*interval: 5000'
    line: 'interval: 0'
    state: present
  become: true
  when: display_manager_type == 'sddm-pixie'

- name: Ensure sddm config directory exists
  ansible.builtin.file:
    path: "{{ (display_manager_sddm_conf | dirname) }}"
    state: directory
  become: true
  when: display_manager_type == 'sddm-pixie'

- name: Render SDDM config (Pixie theme, Wayland greeter)
  # Assets v0.6.0's sddm.conf.j2 renders
  # `[Wayland] CompositorCommand={{ display_manager_sddm_compositor_command }}`
  # (default weston --shell=kiosk). The role var is in scope as the render
  # context; the preflight above proves the command's package is present.
  ansible.builtin.template:
    src: "{{ display_manager_assets_templates_dir }}/display-manager/sddm.conf.j2"
    dest: "{{ display_manager_sddm_conf }}"
    mode: "0644"
  become: true
  when: display_manager_type == 'sddm-pixie'

# ── greetd + regreet fallback (retained) ──────────────────────────────────────
- name: Ensure greetd + the selected greeter are installed
  ansible.builtin.package:
    name: "{{ display_manager_packages }}"
    state: present
  become: true
  when: display_manager_type == 'greetd-regreet'

- name: Ensure greetd config directory exists
  ansible.builtin.file:
    path: /etc/greetd
    state: directory
  become: true
  when: display_manager_type == 'greetd-regreet'

- name: Ensure regreet state/log dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/lib/regreet
    - /var/log/regreet
  become: true
  when: display_manager_type == 'greetd-regreet'

- name: Render greetd config (Cage + regreet)
  ansible.builtin.template:
    src: "{{ display_manager_assets_templates_dir }}/display-manager/config.toml.j2"
    dest: /etc/greetd/config.toml
    mode: "0644"
  become: true
  when: display_manager_type == 'greetd-regreet'

# ── Common: enable the chosen DM, disable the rest ───────────────────────────
- name: Remove the old display-manager.service alias
  ansible.builtin.file:
    path: /etc/systemd/system/display-manager.service
    state: absent
  become: true
  failed_when: false

- name: Enable the display manager
  ansible.builtin.systemd:
    name: "{{ display_manager_enable_service }}"
    enabled: true
    daemon_reload: true
  become: true

- name: Set default target to graphical
  ansible.builtin.command: systemctl set-default graphical.target
  become: true
  changed_when: false
  when: display_manager_type == 'sddm-pixie'

- name: Disable the other display managers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
  loop: "{{ display_manager_disable_services }}"
  become: true
  failed_when: false
