# Verify role vars (Story 2.12).
#
# The role asserts the ten done-criteria (plan §8, SPEC.md CAP-3) against
# PROVISIONED locations — the user config home (~/.config/... via
# verify_xdg_config_home) and the install spine (via install_dir) — so a single
# `verify` run / the aggregate `bootstrap.yaml` can assert all preconditions and
# done-criteria (FR-22, FR-4). It renders NOTHING and writes NOTHING: it is a
# read-only gate.
#
# Mirror-and-adapt discipline (Epic 1 retro action item) — what differs from
# each mirror:
#   (a) vs 2.10 config_copies (fact-gathering assert + real-dir dest check):
#       2.10 COPIES and then verifies its own copies; verify re-checks the SAME
#       targets read-only. verify inherits the fact assert verbatim (the first
#       task) and the `follow: false` + isdir dest check verbatim (criterion 9).
#   (b) vs 2.7 default_palette (command -v + bin-dir PATH-prepend + check-gated
#       assert): verify reuses the pattern for BOTH system binaries (criterion
#       2) and CLI tools (criterion 3); unlike 2.7 it has no csg presence
#       REQUIREMENT per se — the whole point is asserting what provisioning
#       placed.
#   (c) vs 2.11 settings (hardened install_dir assert + spine-target contract):
#       verify consumes the SAME spine targets the settings role renders (the
#       six verify_settings_spine_targets) and inherits the hardened five-
#       condition install_dir assert; verify does NOT render anything.
#   (d) vs 2.5 filesystem (XDG derivations + spine dirs): verify mirrors
#       filesystem_spine_dirs and the three XDG home derivations EXACTLY — a
#       divergence would make verify check the wrong layout. The parity tests
#       lock them.
#   (e) vs 2.6 assets (asset kind → spine-segment mapping): verify re-checks
#       the deployed asset outcomes (default.png, icon-templates/, icon-mappings/,
#       csg-templates/, weg-effects.yaml) read-only, plus the pinned assets
#       checkout (`assets/pinned` + the five class dirs, spine AD-6/AD-7).
#   (f) vs 2.9 compositor_configs (skeleton/fragment target map): verify
#       re-checks the placed skeletons + fragments read-only; the AGS
#       fragment is colors.css (renamed from colors.gtk.css on copy).
#
# Trim lock: every install-spine path derives from {{ install_dir | trim }} and
# every config target derives from {{ verify_xdg_config_home }} — NO hardcoded
# absolute paths anywhere (the test scans vars with the _hardcoded_absolute_path
# regex helper).

# verify_xdg_config_home: the target config home the filesystem role (2.5)
#   created. IDENTICAL derivation to filesystem/compositor_configs/
#   config_copies/settings: honors $XDG_CONFIG_HOME with the spec default
#   {{ ansible_facts.env.HOME }}/.config. Uses ansible_facts.env.* (NOT the
#   deprecated top-level ansible_env fact — F4 lock, hard-breaks on
#   ansible-core >= 2.24).
verify_xdg_config_home: "{{ ansible_facts.env.XDG_CONFIG_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.config', true) }}"
verify_xdg_state_home: "{{ ansible_facts.env.XDG_STATE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/state', true) }}"

# verify_state_current_dir: the runtime-owned current dir (AD-5:
#   <state>/dotfiles/current/) — done-criterion 6 (Story 1.12) requires each
#   palette file HERE, current-only (Epic 4: the generated/palettes tree is
#   gone and the runtime seed is the single producer; a machine with only an
#   orphaned generated/ tree and no current/ palette fails the gate).
#   Derived from verify_xdg_state_home — NO second XDG resolution is
#   introduced. Trim lock (stray-whitespace XDG values bit Story 1.11).
verify_state_current_dir: "{{ verify_xdg_state_home | trim }}/dotfiles/current"

# verify_bin_scripts: every script or launcher a Hyprland keybind invokes. The
#   Fn-key/SUPER binds in keybindings.lua shell out to these by NAME, so a
#   missing or non-executable one is a key that silently does nothing (spine
#   AD-10 layer 3: "every script/launcher name a hypr keybind invokes exists and
#   is executable").
#
#   Scope boundary (AD-10): SIX of these are AGS launcher wrappers rendered by the
#   cli_tools role (rofi-ui, capture-ui, clipboard-ui, wallpaper-selector-ui,
#   icon-color-mapping-editor, btop-theme-studio) because they bake installed
#   binary paths; they stay in cli_tools and are asserted here. `toggle-touchpad`
#   is the ONE repo-authored static script: since S4 it is corpus data
#   (dotfiles-assets `desktop/scripts/`) that the compositor_configs role
#   installs 0755.
verify_bin_scripts:
  - "{{ verify_cli_bin_dir | trim }}/toggle-touchpad"
  # The shared AGS launch-lock wrapper (AD-28): every provisioned launcher and
  # the ags_apps_units start/rollback paths route cold `ags run` through it, so
  # a missing wrapper would break every launcher at once.
  - "{{ verify_cli_bin_dir | trim }}/ags-run-locked"
  # The capture UI launcher: `capture-ui` (SUPER+PRINT). Rendered by
  # ags_apps_units from the app list; without it the keybind is a silent no-op,
  # so its presence is asserted here too. The `capture-tool` CLI itself is the
  # app tag's binLink, asserted in the standalone section below.
  - "{{ verify_cli_bin_dir | trim }}/capture-ui"
  # rofi's toggle launcher: the SUPER+D bind calls `rofi-ui` (open+close), so a
  # missing launcher would leave the key dead.
  - "{{ verify_cli_bin_dir | trim }}/rofi-ui"
  # The remaining keybind launchers (keybindings.lua: clipboard history,
  # wallpaper picker, icon-mapping editor, btop studio). ags_apps_units renders
  # them from the app list's launcher field; a missing one is a dead key,
  # exactly like rofi-ui/capture-ui above.
  - "{{ verify_cli_bin_dir | trim }}/clipboard-ui"
  - "{{ verify_cli_bin_dir | trim }}/wallpaper-selector-ui"
  - "{{ verify_cli_bin_dir | trim }}/icon-color-mapping-editor"
  - "{{ verify_cli_bin_dir | trim }}/btop-theme-studio"

# verify_xdg_data_home: the per-user data home that hosts the deployed desktop
#   entries ($XDG_DATA_HOME/applications, spec default ~/.local/share). Same
#   derivation as compositor_configs_xdg_data_home (ansible_facts.env, F4 lock):
#   the deploy target and the layer-3 assertion must name the same directory.
verify_xdg_data_home: "{{ ansible_facts.env.XDG_DATA_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/share', true) }}"

# verify_desktop_entry_files: the deployed desktop entries (spine AD-10 layer 3:
#   "the deployed set is present"). The set mirrors compositor_configs'
#   compositor_configs_desktop_entries `file` list — a contract test locks the two
#   (TestVerifyVars.test_desktop_entry_files_mirror_the_deploy_set), so a new
#   corpus entry cannot be deployed without a verify assertion. The Exec binary of
#   each is resolved from the DEPLOYED file, not from a copy of the corpus.
verify_desktop_entry_files:
  - "{{ verify_xdg_data_home | trim }}/applications/tidal-hifi.desktop"
  - "{{ verify_xdg_data_home | trim }}/applications/antigravity-ide.desktop"
  - "{{ verify_xdg_data_home | trim }}/applications/code.desktop"
  - "{{ verify_xdg_data_home | trim }}/applications/devin-desktop.desktop"
  - "{{ verify_xdg_data_home | trim }}/applications/copilot.desktop"
  - "{{ verify_xdg_data_home | trim }}/applications/codex.desktop"
verify_xdg_cache_home: "{{ ansible_facts.env.XDG_CACHE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.cache', true) }}"

# verify_xdg_dirs: the three XDG base dirs criterion 8 asserts exist (mirror of
#   filesystem_xdg_{config,state,cache}_home derivations above).
verify_xdg_dirs:
  - "{{ verify_xdg_config_home }}"
  - "{{ verify_xdg_state_home }}"
  - "{{ verify_xdg_cache_home }}"

# verify_install_spine_dirs: the install-spine dirs under install_dir
#   (criterion 1). Parity-EXACT with filesystem_spine_dirs — if the spine
#   changes, verify must change (the test locks the exact set equality).
#   Epic 4 single-source: no generated/ tree (runtime owns all derived
#   artifacts under $XDG_STATE_HOME/dotfiles/).
#   config-in-spine (2026-08-16): the `config/` subtree hosts all managed
#   configs; csg-templates live at config/color-scheme-generator/templates.
verify_install_spine_dirs:
  - wallpapers
  - icon-templates
  - icon-mappings
  - config
  # Runtime-owned producer config (runtime REQ-004), parity with
  # filesystem_spine_dirs. runtime_daemon renders producer.json here.
  - config/dotfiles-runtime
  - config/color-scheme-generator
  - config/color-scheme-generator/templates
  - config/hypr
  - config/hyprpaper
  # Every config/ags* path is DELIBERATELY absent: ags_apps_units owns each
  # app's spine link (<install>/config/<spineLink> -> <install>/apps/...), and
  # listing one here would make the criterion-1 isdir assert false (stat.isdir
  # is false through a symlink). The standalone mirror asserts each link.
  - config/nvim
  - config/starship
  - config/wlogout
  - config/zsh
  - config/kitty
  - config/weg
  - config/itr
  - config/theme-producer
  - config/theme-producer/templates
  - config/gtk-3.0
  - config/gtk-4.0
  # btop is deliberately NOT listed here: this list is parity-EXACT with
  # filesystem_spine_dirs (the filesystem role owns the base layout; the
  # btop_config role, not filesystem, creates config/btop/ and its themes/
  # subdir). It is asserted by verify_btop_spine_dir / verify_btop_themes_dir
  # instead.

# verify_assets_dir / verify_assets_pinned_file / verify_assets_pinned_tag:
#   the PINNED assets checkout (spine AD-6/AD-7). The assets role fetches
#   repo@tag once into <install>/assets/<tag>/ and records the tag in
#   <install>/assets/pinned; verify re-checks the pin and the five class dirs
#   read-only. `verify_assets_pinned_tag` is the mirror of the manifest
#   `assets.tag` (locked by TestVerifyAssetsPinParity); since S5 verify also
#   asserts the pin FILE's content equals this tag and re-reads the deployed
#   class contracts against `verify_assets_schema_support`.
verify_assets_dir: "{{ install_dir | trim }}/assets"
verify_assets_pinned_file: "{{ verify_assets_dir }}/pinned"
verify_assets_pinned_tag: v0.6.2
verify_assets_tag_dir: "{{ verify_assets_dir }}/{{ verify_assets_pinned_tag }}"
verify_assets_class_dirs:
  - "{{ verify_assets_tag_dir }}/icons"
  - "{{ verify_assets_tag_dir }}/templates"
  - "{{ verify_assets_tag_dir }}/configs"
  - "{{ verify_assets_tag_dir }}/content"
  - "{{ verify_assets_tag_dir }}/desktop"

# verify_assets_schema_support: the AD-12 consumer support window, mirrored from
#   the assets role's `assets_schema_support` (deploy-coverage asserts the two
#   maps are equal, so a widened window cannot land on one side only). verify
#   re-reads the DEPLOYED contracts under <install>/assets/<tag>/ — the same
#   icons/schema.json, templates/**/*.vars.schema.json and desktop/desktop.yaml
#   the fetch asserted — and fails on any major outside this window. That makes
#   a hand-edited or half-fetched checkout loud even when `assets/pinned` is
#   right. configs/content ship no schema file, so they have no entry.
verify_assets_schema_support:
  icons: 1
  templates: 1
  desktop: 1

# verify_assets_configs_dirs: the configs SUBDIRECTORIES inside the pinned
#   checkout (S2). compositor_configs and config_copies copy FROM this tree, so
#   a class dir that exists but is empty (a wrong or partial tag) would deploy
#   nothing silently — the class-dir check above only proves `configs/` exists.
#   Locked offline to the config roles' registered sources by
#   TestVerifyVars.test_assets_configs_dirs_are_the_config_role_sources (the
#   catalog itself lives in the pinned repo, not in this checkout).
verify_assets_configs_dirs:
  - "{{ verify_assets_tag_dir }}/configs/hypr"
  - "{{ verify_assets_tag_dir }}/configs/hyprpaper"
  - "{{ verify_assets_tag_dir }}/configs/nvim"
  - "{{ verify_assets_tag_dir }}/configs/rofi"
  - "{{ verify_assets_tag_dir }}/configs/starship"
  - "{{ verify_assets_tag_dir }}/configs/wlogout"

# verify_assets_desktop_paths: the desktop class pieces the compositor_configs
#   role reads (S4). The class dir alone proves nothing (it exists in every tag
#   since v0.1.0, empty until v0.5.0): the two subdirs, the layer-2 contract and
#   the helper script must be there, or the role's stat+assert would be the only
#   thing standing between a partial checkout and a machine with no touchpad
#   toggle. The six entry FILES are not mirrored here — the contract is their
#   inventory, and the deployed-set assertion below proves what landed.
verify_assets_desktop_paths:
  - "{{ verify_assets_tag_dir }}/desktop/applications"
  - "{{ verify_assets_tag_dir }}/desktop/scripts"
  - "{{ verify_assets_tag_dir }}/desktop/scripts/toggle-touchpad"
  - "{{ verify_assets_tag_dir }}/desktop/desktop.yaml"

# verify_install_spine_files: the file node(s) that must exist IN the spine
#   (criterion 1 + 4). weg-effects.yaml is a FILE emitted by the assets role
#   (2.6) via `weg dump-effects` into the config-in-spine home
#   (mirror of filesystem_file_nodes).
#   S1: the six per-concern mapping duplicates were retired in assets v0.2.0
#   (icons.yaml is the single group map; defaults.yaml is the vocabulary), so
#   the required-member set names only the two files that actually ship.
verify_install_spine_files:
  - config/weg/effects.yaml
  - icon-mappings/icons.yaml
  - icon-mappings/defaults.yaml

# verify_derivation_template_dirs: derivation-input DIRECTORIES that must be
#   NON-EMPTY in the spine (R-3/AD-43: `verify` asserts input CONTENT, not just
#   container existence — an empty templates dir silently derives empty output).
verify_derivation_template_dirs:
  - icon-templates
  - config/color-scheme-generator/templates
  - config/theme-producer/templates

# verify_csg_template_files: the CSG color-format templates the runtime's
#   csg_adapter requests by name (adapters/csg_adapter.py `--format` args).
#   Non-empty is NOT enough (AD-43): csg silently OMITS a format whose
#   `colors.<fmt>.j2` template is missing, and the runtime then fails a
#   palette entry with "csg did not write expected artifact" (e.g. a missing
#   colors.kitty.j2 leaves current/colors.kitty dangling and kitty never
#   re-themes). Parity-locked to the adapter's requested format set.
verify_csg_template_files:
  - colors.yaml.j2
  - colors.conf.j2
  - colors.gtk.css.j2
  - colors.adw.css.j2
  - colors.sequences.j2
  - colors.rasi.j2
  - colors.kitty.j2

# verify_weg_effects_path: the spine effects catalog the WEG gate must read.
#   The assets role (2.6) emits it via `weg dump-effects --output` to
#   <install>/config/weg/effects.yaml, and the spec (chaining-spine.md) wires
#   the WEG chain to it via env WALLPAPER_EFFECTS_CONFIG_FILE_PATH — NOT the
#   XDG ~/.config/weg/effects.yaml fallback (which the installer never writes).
#   Trim lock, mirror of assets_weg_effects_target.
verify_weg_effects_path: "{{ install_dir | trim }}/config/weg/effects.yaml"

# verify_system_binaries: the compositor/OS binaries on PATH (criterion 2).
#   Fonts are deliberately NOT checked "on PATH" — fonts are fontconfig files,
#   not binaries (see Dev Notes "Fonts in done-criterion 2"); font presence is
#   the packages role's idempotent install concern.
verify_system_binaries:
  - hyprland
  - hyprpaper
  - ags
  - power-options-gtk
  # Audio stack (add-pipewire-audio-control): wpctl is the WirePlumber CLI
  #   (proves wireplumber is installed); pavucontrol is the Pulse-compat GUI
  #   mixer launched by right-clicking the output bar indicator. Both are
  #   packages role-installed, so they belong to the criterion-2 PATH gate.
  - wpctl
  - pavucontrol
  # MPRIS transport (ags-audio-mpris-transport): the AGS service shells out to
  #   playerctl for play/pause/next/prev/seek (actions only — never state reads,
  #   contract I2). A missing binary silently no-ops every transport control, so
  #   it belongs to the criterion-2 PATH gate. Packages-role installed.
  - playerctl
  # Screenshot + clipboard stack (capture-tool + runtime clipboard watcher):
  #   capture-tool shells grim/slurp/wl-copy and the watcher needs
  #   `wl-paste --watch` — absent binaries failed as [Errno 2] at runtime
  #   while the gate stayed green. Packages-role installed (capture key).
  - grim
  - slurp
  - wl-copy
  - wl-paste
  # Session infrastructure (autostart.lua + compositor session): hyprlock /
  #   hypridle (screen lock + idle) ship PATH binaries and belong to this
  #   gate. hyprpolkitagent ships NO PATH binary (it lives at
  #   /usr/lib/hyprpolkitagent/ and runs via its user unit), so it is gated
  #   separately below via `systemctl --user list-unit-files`.
  #   Packages-role installed (lock key + portals key).
  - hyprlock
  - hypridle
  # AI development tools (provision-ai-ides-and-clis): the three IDE binaries
  # and the two CLIs. Installed by the packages role via the AUR channel, so a
  # missing install fails the criterion-2 PATH gate instead of silently leaving
  # a rofi entry that launches nothing. power-options-gtk/pavucontrol are the
  # precedent for GUI app binaries in this list.
  - antigravity-ide
  - code
  - devin-desktop
  - copilot
  - codex

# verify_cli_tools: the uv-tool-installed CLIs on PATH (criterion 3). `itr` IS
#   the icon-renderer console script (no separate binary); `dotfiles-runtime`
#   is the host runtime. Mirror of cli_tools.cli_tools.
verify_cli_tools:
  - csg
  - weg
  - itr
  - tpr
  - dotfiles-runtime

# verify_cli_tools_checkout_root / verify_itr_*: the pinned external CLI
#   checkouts (spine AD-10/AD-11). `verify` carries INDEPENDENT literal pins
#   mirroring roles/cli_tools (a parity test locks role == verify == manifest),
#   so a wrong-tag install cannot hide behind a green `command -v`:
#   - the checkout lives under the install-cli-tools root, in an itr dir named
#     by the tag;
#   - <install-cli-tools>/itr/pinned records exactly that tag;
#   - `itr --version` reports `<package-version> contract <contract-version>`,
#     and the contract token must equal the `contracts` tag this repo pins
#     (AD-4: one contract tag, four consumers).
verify_cli_tools_checkout_root: "{{ install_dir | trim }}/cli-tools"
verify_itr_version: v0.2.0
verify_itr_checkout: "{{ verify_cli_tools_checkout_root }}/itr/{{ verify_itr_version }}"
verify_itr_pin_file: "{{ verify_cli_tools_checkout_root }}/itr/pinned"
verify_itr_contract_version: 0.2.0

# verify_runtime_*: the same three legs for the host runtime (REQ-002/REQ-006).
#   `dotfiles-runtime` has no `--version` flag and no contract token: the
#   `version` subcommand prints the package version, which equals the tag
#   without its leading `v`.
verify_runtime_version: v0.4.1
verify_runtime_tool_version: 0.4.1
verify_runtime_checkout: "{{ verify_cli_tools_checkout_root }}/dotfiles-runtime/{{ verify_runtime_version }}"
verify_runtime_pin_file: "{{ verify_cli_tools_checkout_root }}/dotfiles-runtime/pinned"

# verify_producer_*: the runtime-owned producer config (runtime REQ-004).
#   runtime_daemon renders exactly this file from the provisioning inputs
#   (`runtime_palette_producer` / `runtime_palette_tpr_engine`); verify reads
#   it back and asserts the selected values. It is the ONE authority every
#   runtime composition root (daemon, CLI, seed) resolves — no ambient env.
verify_producer_config_path: "{{ install_dir | trim }}/config/dotfiles-runtime/producer.json"
verify_producer_config_schema_version: 1
verify_expected_producer: "{{ runtime_palette_producer | default('csg', true) }}"
verify_expected_tpr_engine: "{{ runtime_palette_tpr_engine | default('native', true) }}"
verify_expected_tpr_runtime: container

# verify_weg_*: the same four legs for `weg` (S5), plus the container image.
#   weg is the first container-mode CLI consumed as a pinned repo, so verify
#   additionally asserts the IMAGE exists at the tag-qualified reference
#   (spine AD-7/AD-11). The reference is the CLI's own engine-qualified name —
#   `<image_name>-<engine>:<tag>` (oci_runtime.naming.engine_qualified_image;
#   the rendered settings carry image_name "weg"), with `container_runtime_engine`
#   the same DECLARED value the build used and `verify_weg_version` the pin.
#   A `latest`-only image, or one built at the previous pin, fails this gate.
verify_weg_version: v0.2.0
verify_weg_checkout: "{{ verify_cli_tools_checkout_root }}/weg/{{ verify_weg_version }}"
verify_weg_pin_file: "{{ verify_cli_tools_checkout_root }}/weg/pinned"
verify_weg_contract_version: 0.2.0
verify_weg_image_name: weg
verify_weg_image_reference: >-
  {{ verify_weg_image_name }}-{{ container_runtime_engine }}:{{ verify_weg_version }}

# verify_csg_*: the same four legs for `csg` (S6), plus FOUR images.
#   csg builds one base image plus one per backend (`csg install` with no
#   `--backend` builds all of `Backend`): `base`, `custom`, `pywal`, `wallust`,
#   each engine-qualified — `<prefix>-<suffix>-<engine>:<tag>` via
#   oci_runtime.naming.engine_qualified_image, with `image_prefix` "csg" from
#   the rendered settings and `container_runtime_engine` the same DECLARED
#   value the build used. `verify_csg_image_references` spells all four out so
#   a missing backend is a named failure, not a count. The pin is the manifest
#   `csg.tag` (AD-7/AD-11) — never `latest`; the cli_tools role builds them at
#   this tag by passing `COLORSCHEME__CONTAINER__IMAGE_TAG={{ pin }}`.
verify_csg_version: v0.2.2
verify_csg_checkout: "{{ verify_cli_tools_checkout_root }}/csg/{{ verify_csg_version }}"
verify_csg_pin_file: "{{ verify_cli_tools_checkout_root }}/csg/pinned"
verify_csg_contract_version: 0.2.0
verify_csg_image_prefix: csg
verify_csg_image_references:
  - "{{ verify_csg_image_prefix }}-base-{{ container_runtime_engine }}:{{ verify_csg_version }}"
  - "{{ verify_csg_image_prefix }}-custom-{{ container_runtime_engine }}:{{ verify_csg_version }}"
  - "{{ verify_csg_image_prefix }}-pywal-{{ container_runtime_engine }}:{{ verify_csg_version }}"
  - "{{ verify_csg_image_prefix }}-wallust-{{ container_runtime_engine }}:{{ verify_csg_version }}"

# verify_tpr_*: REQ-010, the opt-in palette producer. Same legs as csg —
#   checkout, pin record, console handshake and THREE images (base + one per
#   shipped engine: matugen, native), each engine-qualified at the pin via
#   oci_runtime.naming.engine_qualified_image:
#   `<prefix>-<suffix>-<engine>:<tag>`.
#   The build takes the tag from THEME__CONTAINER__IMAGE_TAG (tpr's verb has no
#   --image-tag), and the rendered settings carry image_prefix "tpr" + the same
#   pin, so a `latest`-only or previous-pin image fails here.
#
#   CONTRACT TOKEN: tpr v0.4.0's `--version` prints only the package version;
#   unlike csg/weg/itr it has no `contract <x>` token, so there is nothing
#   dynamic to grep. `verify_tpr_contract_version` records the invocation
#   contract generation this consumer expects (contracts v0.4.0) and is locked
#   by `TestVerifyTprPinAndImages`; the executable assertions below are the
#   version + images. The checkout dir is the cli_tools entry `name` (`tpr`),
#   i.e. <install>/cli-tools/tpr/<tag>; the `theme-producer` name is the
#   deployed config dir, not this source checkout.
verify_tpr_version: v0.4.0
verify_tpr_checkout: "{{ verify_cli_tools_checkout_root }}/tpr/{{ verify_tpr_version }}"
verify_tpr_pin_file: "{{ verify_cli_tools_checkout_root }}/tpr/pinned"
verify_tpr_contract_version: 0.4.0
verify_tpr_image_prefix: tpr
verify_tpr_image_references:
  - "{{ verify_tpr_image_prefix }}-base-{{ container_runtime_engine }}:{{ verify_tpr_version }}"
  - "{{ verify_tpr_image_prefix }}-matugen-{{ container_runtime_engine }}:{{ verify_tpr_version }}"
  - "{{ verify_tpr_image_prefix }}-native-{{ container_runtime_engine }}:{{ verify_tpr_version }}"

# verify_tpr_selected_image_reference / verify_tpr_smoke_artifacts: BUG-007.
#   When the selected producer is tpr, verify asserts the engine SELECTED by
#   producer.json exists as an image and runs a bounded REAL generate into a
#   temp dir (never live state). The eight artifact names are the runtime's
#   palette contract — the exact set tpr must produce for the selected
#   producer/engine.
verify_tpr_selected_image_reference: >-
  {{ verify_tpr_image_prefix }}-{{ verify_expected_tpr_engine }}-{{ container_runtime_engine }}:{{ verify_tpr_version }}
verify_tpr_smoke_artifacts:
  - colors.yaml
  - colors.conf
  - colors.gtk.css
  - colors.adw.css
  - colors.sequences
  - colors.rasi
  - colors.kitty
  - colors.btop.theme
verify_tpr_smoke_timeout_seconds: 180

# verify_notifd_binding_packages: the AUR packages backing the AstalNotifd
#   binding the notifications overlay imports (capture-notifications
#   implementation gate — the app is never scaffolded against a missing
#   binding). Checked via `pacman -Q` (importable == installed here: the
#   package ships the GIR + typelib the girepository loader resolves).
#   Mirror of the packages role's `aur_packages` entry.
verify_notifd_binding_packages:
  - libastal-notifd-git

# verify_astal_wp_binding_packages: the AUR package backing the AstalWp
#   binding the settings panel imports for audio routing (settings-panel-
#   provisioning gate — the panel is never scaffolded against a missing
#   binding). Checked via `pacman -Q` (importable == installed here: the
#   package ships the GIR + typelib the girepository loader resolves).
#   Mirror of the packages role's `aur_packages` entry. Bluetooth needs no
#   Astal binding — the panel talks BlueZ D-Bus directly.
verify_astal_wp_binding_packages:
  - libastal-wireplumber-git

# verify_bluetooth_service: the system unit the settings panel's own BlueZ
#   D-Bus service (bluetooth-service.ts) depends on. Installing bluez alone
#   leaves no daemon running, so the packages role enables + starts it; this
#   gate asserts BOTH enabled (survives the next boot) and active (usable now)
#   — a disabled unit would silently drop Bluetooth from the panel after a
#   reboot.
verify_bluetooth_service: bluetooth.service

# verify_bluetooth_rfkill_type: the rfkill type whose SOFT-block state the
#   packages role clears at provision time. A soft block (vendor WMI
#   killswitch / persisted systemd-rfkill state) makes BlueZ refuse to power
#   the controller, and the settings panel's `adapter.powered` setter then
#   fails silently — the toggle looks dead. Gate the unblocked state so a
#   regression is visible (a HARD block is physical and not asserted).
verify_bluetooth_rfkill_type: bluetooth

# verify_power_options_*: the power-options profiles that must not soft-block
#   Bluetooth (REQ-003). power-options-daemon is Arch-only; on another distro
#   the directory is absent and the check is skipped, like the package itself.
verify_power_options_profile_dir: /etc/power-options/profiles
verify_power_options_marker: /etc/power-options/.dotfiles-bt-ok
verify_power_options_bt_profiles:
  - "Powersave++.toml"
  - "Powersave.toml"
  - "Balanced.toml"

# verify_bluetooth_audio_packages: the PipeWire package shipping the bluez5 SPA
#   (libspa-bluez5.so). Without it WirePlumber creates NO Bluetooth audio sink,
#   so a connected headset is silently unroutable — installing bluez alone is
#   not enough. Checked via `pacman -Q` (Arch package name; mirror of the
#   AstalNotifd binding gate).
verify_bluetooth_audio_packages:
  - pipewire-audio

# verify_backlight_binary: the CLI the settings panel's Display slider drives
#   (`-m` read, `set <pct>%` write). The packages role installs it and its udev
#   rule grants the session user access; this gate runs the machine-readable
#   read as the user so a slider that would silently no-op fails provisioning.
verify_backlight_binary: brightnessctl

# ── Display manager: SDDM's Wayland greeter (BUG-004) ────────────────────────
# DisplayServer=wayland needs a Wayland compositor. With none installed, SDDM
# silently falls back to `DisplayServer=x11-user`, starts the login on a new VT
# and tears the session down after ~90 s (`Session started false`). These mirror
# the display_manager role's vars; the role's preflight is the install-time
# fail-closed half, these are the post-provision static assertions.
#
# Fixed system paths, not user/spine paths: SDDM owns /etc/sddm.conf.d and its
# theme tree under /usr/share/sddm (the trim lock lists these as fixed system
# paths, like /etc/power-options).
verify_sddm_conf: /etc/sddm.conf.d/10-dotfiles.conf
verify_sddm_display_server: wayland
verify_sddm_compositor_command: "weston --shell=kiosk"
verify_greeter_compositor_packages:
  - weston
verify_pixie_themedir: /usr/share/sddm/themes/pixie
verify_pixie_main_qml: "{{ verify_pixie_themedir }}/Main.qml"
# verify_pixie_repo_ref: the display_manager role's commit pin, mirrored. The
# theme is root-owned, so the `git rev-parse` probe runs with
# `-c safe.directory=*` (a bare git call fails "dubious ownership" as the
# verify user — observed live). Bump procedure lives on the role var.
verify_pixie_repo_ref: 1e1a863761f742e8d509d569382b17c112e29fdc

# verify_masked_user_units: systemd --user units that must be MASKED, not just
#   stopped, on a provisioned machine. The notifications overlay owns
#   org.freedesktop.Notifications for the session; dunst's enabled unit
#   respawns at login and steals the bus name, leaving the overlay unable to
#   serve ("cannot get proxy: dunst is already running" — verified live).
#   gui_tools stops and masks it, but both of those tasks are
#   `failed_when: false` so provisioning can never break on a machine without
#   systemd --user — which means a silent failure would ship. This gate makes
#   it loud. Mirror of the gui_tools mask task.
verify_masked_user_units:
  - dunst.service

# verify_ags_always_on_instances: DERIVED in tasks/main.yml from the one
#   composition app list (`launch: always` -> instance). There is no second
#   always-on list: the installer starts exactly this subset, and the verify
#   gate asserts exactly this subset is on the bus. Empty here so an
#   unprovisioned/legacy list fails the non-empty guard instead of silently
#   passing.
verify_ags_always_on_instances: []

# verify_audio_user_units: the systemd --user units that back the audio stack
#   (pipewire + wireplumber for the graph/session, pipewire-pulse for Pulse
#   clients like pavucontrol). The packages role enables them GLOBALLY
#   (`systemctl --global enable`), which writes the system-wide
#   /etc/systemd/user default-target wants — so this gate checks `--global
#   is-enabled` (survives reboot for every user) rather than session state.
#   Why it matters: the AGS settings panel and the new audio bar/popup read the
#   graph through AstalWp over WirePlumber; if the units are not enabled the
#   session comes up with no audio graph and every audio surface is inert. A
#   bare package install alone does NOT enable wireplumber.service (not
#   socket-activated), so a silent failure would ship without this gate. Same
#   "enable survives reboot" rationale as the bluetooth.service gate. The
#   wpctl/pavucontrol binaries are covered by verify_system_binaries above.
verify_audio_user_units:
  - pipewire.socket
  - pipewire-pulse.socket
  - wireplumber.service

# verify_directory_handler: the desktop default handler for directories, which
#   the capture tool's "Show in folder" action relies on (it xdg-opens the
#   recording's parent dir). Without an explicit default the mime database
#   resolved inode/directory to kitty-open.desktop, so the action opened a
#   terminal (reported live). gui_tools pins thunar (the provisioned file
#   manager); this gate catches a machine where that never took effect.
verify_directory_handler: thunar.desktop

# verify_cli_bin_dir: the uv bin dir to prepend to PATH — mirror of
#   cli_tools_bin_dir exactly. The CLIs land here via `uv tool install`
#   ($UV_TOOL_BIN_DIR -> $XDG_BIN_HOME -> $HOME/.local/bin); without the
#   prepend the bootstrap chain would FALSE-FAIL right after cli_tools
#   installed them (mirror of the default_palette/assets PATH-prepend pattern).
verify_cli_bin_dir: >-
  {{ ansible_facts.env.UV_TOOL_BIN_DIR
     | default(ansible_facts.env.XDG_BIN_HOME | default(ansible_facts.env.HOME + '/.local/bin', true), true) }}

# verify_expected_engine_tag: R-17 — the composition's installer.pin, passed
#   by bootstrap as the `expected_engine_tag` extra-var. Empty is the
#   hand-run/default case: no engine assertion, so a developer running verify
#   against a checkout is not forced to name a tag. When set, verify reads
#   `dotfiles-provision --output-format plain version` from verify_cli_bin_dir
#   and compares it to the pin after stripping the pin's leading `v` (the
#   package metadata reports `0.1.1`, the composition pins `v0.1.1`). The
#   engine tag is machine state: a fresh machine provisioned by engine A must
#   not pass verify while claiming composition pin B.
verify_expected_engine_tag: "{{ expected_engine_tag | default('', true) }}"

# verify_settings_files: the rendered settings DEST paths (criterion 5
#   part 1). config-in-spine (2026-08-16): the files are rendered into the
#   spine at <install>/config/<tool>/settings.toml; verify checks the SPINE
#   paths (authoritative), and the parse gates (below) read them THROUGH the
#   ~/.config/<tool> symlink — exercising the link too. Parity-EXACT with
#   settings_files dests (the test locks it).
verify_settings_files:
  - { name: csg, dest: "{{ install_dir | trim }}/config/color-scheme-generator/settings.toml" }
  - { name: weg, dest: "{{ install_dir | trim }}/config/weg/settings.toml" }
  - { name: itr, dest: "{{ install_dir | trim }}/config/itr/settings.toml" }
  - { name: tpr, dest: "{{ install_dir | trim }}/config/theme-producer/settings.toml" }

# verify_settings_spine_keys: the TOML keys inside each rendered settings file
#   whose values ARE the spine paths the tool writes through (criterion 5 part
#   2 — the parse ≠ works hardening). The extraction task reads each rendered
#   settings.toml, pulls the value of every listed key, and stats THOSE paths
#   — so a settings file mis-rendered to point at a WRONG-but-existing (or
#   MISSING) path FAILS verify even if the file itself parses. Parity with the
#   settings templates is locked by test (each dotted key must exist as a
#   path-bearing assignment in the matching settings/templates/*.j2).
verify_settings_spine_keys:
  csg:
    - output.directory
  weg:
    - output.directory
    - processing.temp_dir
  itr:
    - output.output_dir
    - templates.dir
    - color_scheme.path
  tpr:
    - output.directory

# verify_asset_dirs / verify_asset_files: the five deployed asset outcomes
#   (criterion 4), split by inode type so the assert can check isdir/isreg
#   (review finding 2026-08-13: an exists-only check let a regular FILE satisfy
#   a required DIRECTORY). config-in-spine (2026-08-16): csg-templates live at
#   config/color-scheme-generator/templates; weg-effects.yaml at
#   config/weg/effects.yaml (also in verify_install_spine_files).
verify_asset_dirs:
  - icon-templates
  # The capture tool's icon group: templates for the mode/target/output/audio
  # glyphs (ITR renders them into current/icons/, the AGS registry resolves
  # them). Asserted by group so a missing template tree fails provisioning
  # instead of the UI silently falling back to text labels.
  - icon-templates/capture-tool
  # The audio panel's own transport group (finish-audio-panel-redesign): the
  # round play/pause glyph pair. Asserted by group for the same reason -- the
  # assets role syncs icon-templates/ as a whole, so a group that never lands
  # would otherwise ship a panel whose main transport button renders nothing.
  - icon-templates/media-transport-panel
  - icon-mappings
  - config/color-scheme-generator/templates
  - config/theme-producer/templates
verify_asset_files:
  - wallpapers/default.png
  - config/weg/effects.yaml

# verify_palette_files: the runtime palette files that must be present under
#   {{ verify_state_current_dir }}/ (criterion 6, Epic 4 current-only).
#   Mirror of the cache palette artifact names — conf/yaml/gtk.css/adw.css/
#   sequences (gt-2-1 grew the set; merge feat/gtk-theming-consumer).
verify_palette_files:
  - colors.conf
  - colors.yaml
  - colors.gtk.css
  - colors.adw.css
  - colors.sequences
  - colors.kitty

# verify_icons_dir / verify_icons_samples: the runtime icons output
#   (criterion — runtime icons, Epic 4 current-only). The dir is the
#   runtime's current/icons symlink; the samples are known variants from
#   icons.yaml so verify proves a REAL render happened, not just an empty dir.
#   battery-0 predates the settings panel; settings-panel-wifi.svg and
#   volume-low.svg prove the new groups (add-ags-settings-panel) actually
#   rendered. Trim lock (derived from verify_state_current_dir — no second
#   XDG resolution).
verify_icons_dir: "{{ verify_state_current_dir }}/icons"
verify_icons_samples:
  - "{{ verify_state_current_dir }}/icons/battery-0.svg"
  - "{{ verify_state_current_dir }}/icons/settings-panel-wifi.svg"
  - "{{ verify_state_current_dir }}/icons/volume-low.svg"
  - "{{ verify_state_current_dir }}/icons/volume-system-low.svg"
  - "{{ verify_state_current_dir }}/icons/microphone-system-mic-on.svg"
  - "{{ verify_state_current_dir }}/icons/system-battery-100.svg"
  - "{{ verify_state_current_dir }}/icons/settings-panel-signal-good.svg"
  # Bluetooth bar indicator + circle-badge row glyphs (add-bluetooth-bar-popup):
  # prove the new `bluetooth` group actually rendered, and that the bar glyph
  # resolved through bar_mappings rather than being missing from the output.
  - "{{ verify_state_current_dir }}/icons/bluetooth-on.svg"
  - "{{ verify_state_current_dir }}/icons/bluetooth-off.svg"
  - "{{ verify_state_current_dir }}/icons/settings-panel-bluetooth-signal-full.svg"
  # The panel's own transport group (finish-audio-panel-redesign): prove the
  # `media-transport-panel` group actually rendered, so a fresh install cannot
  # ship the round play/pause button with no art.
  - "{{ verify_state_current_dir }}/icons/media-transport-panel-play.svg"
  - "{{ verify_state_current_dir }}/icons/media-transport-panel-pause.svg"

# verify_compositor_config_dirs: the compositor config dirs under the XDG
#   config home (criterion 7). config-in-spine (2026-08-16): these are now
#   SYMLINKS into the spine (~/.config/hypr -> <install>/config/hypr etc.,
#   created by the config-links role) — the 5-layer symlink check applies
#   (criterion 9 machinery). Mirror of compositor_configs_config_dirs.
verify_compositor_config_dirs:
  - "{{ verify_xdg_config_home }}/hypr"
  - "{{ verify_xdg_config_home }}/hyprpaper"

# verify_compositor_skeleton_files: the skeleton files that must be present
#   THROUGH the compositor config symlinks (criterion 7), mirror of
#   compositor_configs_skeleton_files dests (which now target the spine).
verify_compositor_skeleton_files:
  - "{{ install_dir | trim }}/config/hypr/hyprland.lua"
  - "{{ install_dir | trim }}/config/hypr/keybindings.lua"
  - "{{ install_dir | trim }}/config/hypr/monitors.lua"
  - "{{ install_dir | trim }}/config/hypr/general.lua"
  - "{{ install_dir | trim }}/config/hypr/autostart.lua"
  - "{{ install_dir | trim }}/config/hypr/window-rules.lua"
  - "{{ install_dir | trim }}/config/hypr/animations.lua"
  - "{{ install_dir | trim }}/config/hypr/input.lua"
  - "{{ install_dir | trim }}/config/hypr/decoration.lua"
  - "{{ install_dir | trim }}/config/hypr/cursor.lua"
  - "{{ install_dir | trim }}/config/hypr/env-variables.lua"
  - "{{ install_dir | trim }}/config/hyprpaper/hyprpaper.conf"
# NOTE: AGS app sources/icons are NOT mirrored per file here. Every app is an
# immutable standalone tag installed and linked by `ags_apps_units`; verify
# asserts the unit and its surfaces in _verify_standalone.yml.

# verify_ags_platform_version / _unit_dir / _pin_file / _shortcut: the AGS
#   platform, installed as ONE versioned unit (spine AD-17/AD-23). Mirror of the
#   ags_platform role vars. The unit lives at <install>/ags-platform/<version>/;
#   the SHARED-ANCESTOR shortcut <install>/config/node_modules/ags-platform is a
#   shared app-install shortcut (<install>/apps/node_modules/ags-platform) is
#   created by ags_apps_units. A rollback repoints that shortcut to a sibling
#   version dir. The pin file records the installed version on the host.
verify_ags_platform_version: v0.3.0
verify_ags_platform_unit_dir: "{{ install_dir | trim }}/ags-platform/{{ verify_ags_platform_version }}"
verify_ags_platform_pin_file: "{{ install_dir | trim }}/ags-platform/pinned"

# verify_ags_platform_unit_files: representative files that MUST be present in
#   the installed unit. NOT the whole unit (that is the clone's job) — one file
#   per concern the bar's bare-specifier imports reach: the package identity
#   (package.json, whose `exports` map is what makes `ags-platform/ports/*` and
#   `ags-platform/adapters/*` resolve), the entry point, the build-time icon
#   manifest, one pure port and one host-bound adapter. A missing unit file is a
#   bar that cannot bundle.
verify_ags_platform_unit_files:
  - "{{ verify_ags_platform_unit_dir }}/package.json"
  - "{{ verify_ags_platform_unit_dir }}/index.ts"
  - "{{ verify_ags_platform_unit_dir }}/icons.json"
  - "{{ verify_ags_platform_unit_dir }}/ports/event-client.ts"
  - "{{ verify_ags_platform_unit_dir }}/ports/icon-source.ts"
  - "{{ verify_ags_platform_unit_dir }}/ports/reactive.ts"
  - "{{ verify_ags_platform_unit_dir }}/adapters/event-bus.ts"
  - "{{ verify_ags_platform_unit_dir }}/adapters/icon-registry.ts"
  - "{{ verify_ags_platform_unit_dir }}/adapters/astal.ts"

# verify_gui_tools_app_files: per-file GUI app sources placed by gui_tools.
#   EMPTY: gui_tools no longer places AGS app sources (the only AGS installer,
#   ags_apps_units, links immutable app tags). The criterion task passes on an
#   empty list; a future per-file app appends here and to gui_tools_config_dirs.

verify_gui_tools_app_files: []

# verify_consumer_symlinks: the R2 consumer-path symlinks the runtime
#   seeder owns (criterion 7, Epic 4 current-only). The AGS fragment is
#   colors.css → current/colors.gtk.css. The bar TAG carries colors.css as a
#   symlink to the runtime-owned pointer (AD-37); verify reads it THROUGH the
#   <install>/config/ags link. Checked WITHOUT following (islnk + raw target
#   contains /current/) so a stale provisioning COPY fails the gate. <install>/config/hypr/colors.conf
#   is deliberately absent (nothing sources it — verified: no reference
#   under the assets configs/hypr/*.lua).
verify_consumer_symlinks:
  - "{{ install_dir | trim }}/config/ags/colors.css"

# verify_config_copies_targets: mirror of the config-copies.yaml entries EXACTLY
#   (criterion 9). config-in-spine (2026-08-16): each is now a SYMLINK at
#   {{ verify_xdg_config_home }}/<target> pointing at <install>/config/<target>
#   (created by the config-links role) — the 5-layer symlink check applies:
#   islnk AND exact-target AND resolves AND content-through-link. The test locks
#   parity with dotfiles/provisioning/config-copies.yaml.
#   S2: `zsh` left the copy set (its only file was a Jinja template the copy
#   deposited where nothing read it — zsh_config renders .zshrc from the
#   template source). The zsh spine dir + symlink stay managed and are asserted
#   by verify_install_spine_dirs / verify_managed_link_dirs; its CONTENT is
#   still asserted below through the same ~/.config/zsh link.
verify_config_copies_targets:
  - nvim
  - starship
  - wlogout

# verify_config_copy_content: a representative CONTENT FILE inside each config
#   copy (criterion 9, layer 4 — content-through-link). Verified through the
#   ~/.config/<name> symlink so a link to an empty/wrong spine dir fails even
#   though the link itself is valid.
#   NOTE: zsh's managed content is the RENDERED .zshrc (the zsh_config role
#   renders .zshrc.j2 → .zshrc; the .j2 is the source template, not runtime
#   config). It stays asserted here even though zsh is no longer a config_copies
#   entry (S2): the file must exist through the symlink whichever role wrote it.
#   wlogout's managed content is `layout` (copied, configs class) and the
#   RENDERED style.css (wlogout_config renders style.css.tpl → style.css).
verify_config_copy_content:
  - "{{ verify_xdg_config_home }}/nvim/init.lua"
  - "{{ verify_xdg_config_home }}/starship/starship.toml"
  - "{{ verify_xdg_config_home }}/wlogout/layout"
  - "{{ verify_xdg_config_home }}/wlogout/style.css"
  - "{{ verify_xdg_config_home }}/zsh/.zshrc"
  - "{{ verify_xdg_config_home }}/kitty/kitty.conf"

# verify_wlogout_legacy_template_path: the PRE-S3 residue, asserted ABSENT (S3).
#   Before the template moved to the pinned corpus, config_copies copied the whole
#   wlogout dir into the spine, leaving <spine>/config/wlogout/style.css.tpl beside
#   the rendered style.css. The wlogout_config role prunes it idempotently; verify
#   re-asserts the absence so a hand-restored copy (or a role that lost the prune)
#   fails the gate instead of quietly keeping a template in the directory wlogout
#   loads. Trim lock: one install_dir seam read, no derived second seam.
verify_wlogout_legacy_template_path: "{{ install_dir | trim }}/config/wlogout/style.css.tpl"

# verify_zsh_legacy_template_path: the PRE-S3 zsh residue, asserted ABSENT (S3).
#   Before the template moved to the pinned corpus, config_copies copied the whole
#   zsh dir into the spine, leaving <spine>/config/zsh/.zshrc.j2 beside the
#   rendered .zshrc. zsh reads .zshrc via ZDOTDIR and never the template, so a
#   stale .j2 in the live config dir is residue. The zsh_config role prunes it
#   idempotently; verify re-asserts the absence so a hand-restored copy (or a
#   role that lost the prune) fails the gate. Trim lock: one install_dir seam
#   read, no derived second seam.
verify_zsh_legacy_template_path: "{{ install_dir | trim }}/config/zsh/.zshrc.j2"

# verify_managed_link_dirs: the FULL set of managed config dirs symlinked by the
#   config-links role (criterion 9 — the 5-layer symlink check). Union of
#   config-copies, compositor, per-tool config dirs, and the GTK consumer dirs
#   (gt-3-1). Parity with config_links_managed_dirs is locked by test.
verify_managed_link_dirs:
  - hypr
  - hyprpaper
  - nvim
  - starship
  - wlogout
  - zsh
  - kitty
  - color-scheme-generator
  - weg
  - itr
  - theme-producer
  - gtk-3.0
  - gtk-4.0
  - rofi
  - btop

# verify_btop_spine_dir: the config-in-spine btop home (provision-btop-config).
#   Derived from the SAME {{ install_dir | trim }}/config root every other spine
#   var uses (trim lock — no second seam read, no hardcoded absolute path).
verify_btop_spine_dir: "{{ install_dir | trim }}/config/btop"

# verify_btop_config_path: the RENDERED btop.conf. Read (not just stat'd) so
#   verify can pin the two settings that matter: color_theme =
#   "colors.btop.theme" and save_config_on_exit = false.
verify_btop_config_path: "{{ verify_btop_spine_dir }}/btop.conf"

# verify_btop_themes_dir: the themes subdirectory btop scans at startup. It is
#   PROVISIONING's to create (the btop_config role `state: directory`s it) —
#   the runtime's repoint_consumer_symlinks skips a pointer whose parent is
#   missing and never mkdirs into the spine. Gating it here is what makes a
#   missing dir fail loudly instead of silently dropping the pointer on
#   the first swap.
verify_btop_themes_dir: "{{ verify_btop_spine_dir }}/themes"

# verify_btop_theme_files: the generated btop theme, by NAME under
#   verify_btop_themes_dir (a Runtime consumer pointer at current/, placed by
#   the seeder). There is ONE theme: an earlier three-variant "difficulty dial"
#   was measured to be non-distinguishable (balanced and full rendered
#   byte-identical frames) and was collapsed.
verify_btop_theme_files:
  - colors.btop.theme

# verify_btop_theme_paths: verify_btop_theme_files resolved under
#   verify_btop_themes_dir (trim lock — the names stay bare so the theme set
#   has one home; the paths are derived, never restated).
verify_btop_theme_paths: >-
  {{ verify_btop_theme_files | map('regex_replace', '^',
     verify_btop_themes_dir ~ '/') | list }}

# verify_btop_default_theme: the theme btop.conf is expected to select when the
#   host-owned active-theme setting is absent/empty — the generated theme. The
#   active theme is host state in the install spine (btop-theme-deployment), so verify does
#   NOT pin one filename: it resolves the name from btop.conf and asserts the
#   matching .theme exists in the spine themes dir.
verify_btop_default_theme: colors.btop.theme

# verify_btop_save_config_on_exit: the value verify greps out of the rendered
#   btop.conf. Pinned as a var (not inlined in the task) so the expected value
#   has exactly one home and a test can compare it against the role's template.
verify_btop_save_config_on_exit: "false"

# verify_gtk_skeleton_files: the palette-import skeleton files that must be
#   present THROUGH the ~/.config/gtk-{3,4}.0 symlinks (criterion 9, layer 4
#   for the gtk dirs — gt-3-1). settings.ini is deliberately NOT gated
#   (user-machine state — a fresh machine has none until nwg-look or GTK
#   writes it). The runtime colors.css pointers inside the spine dirs are
#   deliberately NOT gated either (runtime-owned, gt-2-2; provisioning never
#   creates them — their health is the gt-2-2 `inspect status` projection).
verify_gtk_skeleton_files:
  - "{{ verify_xdg_config_home }}/gtk-3.0/gtk.css"
  - "{{ verify_xdg_config_home }}/gtk-4.0/gtk.css"

# verify_managed_link_spine_prefix: the regex prefix each managed symlink target
#   must match (criterion 9, layer 2 — exact-target). Derived from the same
#   {{ install_dir | trim }}/config root the config-links role uses, so a link
#   to the repo, a moved location, or a wrong spine path fails. Trim lock.
verify_managed_link_spine_prefix: "{{ install_dir | trim }}/config"

# verify_itr_list_target: the pinned ITR list gate arg (SPEC.md#51, done-
#   criterion 5) — NOT defaults.yaml (which lacks a `variants` field and is not
#   listable); the deployed icon-mappings/ dir contains icons.yaml (verified).
#   Trim lock.
verify_itr_list_target: "{{ install_dir | trim }}/icon-mappings/icons.yaml"

# ── Standalone per-app AGS topology (REQ-008 / AD-31/32/37) ──────────────────
# verify mirrors the ONLY AGS installer: read the ONE composition app list and
# program tuple, then assert every app's declared ownership surfaces. The
# legacy monorepo mirror is retired with the `ags_apps` role.
verify_ags_apps_units_apps_file: "{{ manifests_dir | trim }}/apps.yaml"
verify_ags_apps_units_tuple_file: "{{ manifests_dir | trim }}/program-tuple.yaml"
verify_ags_apps_units_install_root: "{{ install_dir | trim }}/apps"
verify_ags_apps_units_platform_shortcut: "{{ verify_ags_apps_units_install_root }}/node_modules/ags-platform"
verify_ags_apps_units_spine_config_dir: "{{ install_dir | trim }}/config"
verify_ags_apps_units_run_locked: "{{ verify_cli_bin_dir | trim }}/ags-run-locked"
verify_ags_apps_units_autostart_file: "{{ install_dir | trim }}/config/hypr/autostart.lua"
verify_ags_apps_units_state_root: >-
  {{ ansible_facts.env.XDG_STATE_HOME
     | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/state', true) }}
verify_ags_apps_units_colors_pointer: "{{ verify_ags_apps_units_state_root }}/dotfiles/current/colors.gtk.css"
