# Verify role tasks (Story 2.12) — asserts the fourteen done-criteria (plan §8,
# SPEC.md CAP-3) against PROVISIONED locations only (the user config home via
# verify_xdg_config_home and the install spine via {{ install_dir | trim }}).
# It is a read-only gate: it renders nothing, copies nothing, and needs NO
# become/become_user — everything it checks lives under the user's config home
# and install_dir (user-scoped privilege context, mirror of 2.5-2.11).
#
# The fourteen done-criteria map to the tasks below:
#   1. install dir established      → install-dir subtree stat+assert (twenty
#      spine dirs + weg-effects.yaml)
#   2. system binaries on PATH      → command -v hyprland/hyprpaper/ags
#   3. CLI tools on PATH            → command -v csg/weg/itr (with
#      verify_cli_bin_dir on PATH)
#   4. assets deployed              → default.png + icon-templates/ +
#      icon-mappings/ + csg-templates/ + weg-effects.yaml
#   4b. desktop entries deployed     → the six entries at
#      $XDG_DATA_HOME/applications, every deployed Exec binary resolves on
#      PATH, and every keybind-invoked script/launcher is executable (spine
#      AD-10 layer 3; layer 1 is the corpus's validate-desktop, layer 2 is
#      compositor_configs' requires/optional resolution)
#   5. settings render and parse    → settings files exist AND spine targets
#      resolve AND csg/weg/itr gates exit 0
#   5b. btop config rendered+wired  → btop.conf selects
#      colors.btop.theme, save_config_on_exit = false (the one non-cosmetic
#      setting in the whole btop integration — see btop_config/vars), the
#      spine btop/themes/ dir exists, and the generated theme is present in it.
#   6. default palette generated    → the runtime-consumed palette at
#      <state>/dotfiles/current/{colors.conf, colors.yaml, colors.gtk.css}
#      (current-only, Epic 4 — the default_palette role is deleted; the
#      runtime seed is the single producer. A dangling runtime symlink
#      still fails — the filesystem is authority.)
#   7. compositor configs placed    → skeletons (the palette fragments
#      colors.conf/colors.css are runtime R2 symlinks, Epic 4 — no copies)
#      + standalone GUI tool apps (gui_tools role: <install>/config/<app>/)
#   8. filesystem structure exists  → XDG config/state/cache dirs
#   9. config copies present        → every managed ~/.config/<name> is a
#      symlink into the spine (5-layer check: islnk, exact target, resolves,
#      content-through-link, functional parse)
#   10. icons rendered              → current/icons/ populated (battery-0.svg
#      through the runtime cache entry — Epic 4 current-only; the icons
#      provisioning role is deleted)
#   11. shell tools cloned          → ~/.oh-my-zsh, ~/.pyenv, ~/.nvm exist
#       (zsh_tools role)
#   12. zsh config rendered+wired   → .zshrc wires starship + a cat of the
#       state-root current/colors.sequences (gt-3-2: the runtime's current
#       pointer, NOT the orphaned generated/palettes tree) + ~/.zshenv sets
#       ZDOTDIR at the managed zsh dir (shell-entry seam) + .zshrc sources the
#       .zshrc.local overlay (zsh_config role) AND the pre-S3
#       <spine>/config/zsh/.zshrc.j2 residue is ABSENT (S3: the template source
#       lives only in the corpus)
#   13. wlogout config rendered+wired → style.css imports the palette
#       (wlogout_config role) AND the pre-S3 <spine>/config/wlogout/style.css.tpl
#       residue is ABSENT (S3: the template source lives only in the corpus)
#   14. §12 preconditions           → criteria 2/3 + 4 + 8 + 5 — the whole role;
#       exposed by VerifyCapabilityUseCase (use_cases.py) running verify.yaml
#       with a REAL check, never --check.
#
# Machine, not repo (the core invariant): NOTHING here references the repo
# checkout (no playbook_dir / repo-root var). The gate must never go green
# because the repo still exists while the machine is unprovisioned.
#
# Check-mode gating rationale: `dotfiles-provision verify` runs verify.yaml
# with check=False — that is the authoritative gate. But verify is ALSO the
# last import of bootstrap.yaml, and bootstrap.yaml --check must "complete
# cleanly without mutation" (AC 5). Under --check: stat tasks run and report
# honestly (no mutation — fine ungated); command/shell tasks are SKIPPED by
# ansible-core 2.20.3; so every existence/isdir/rc ASSERT is gated
# `when: not ansible_check_mode` to keep the dry run clean on a
# partially-provisioned host. The authoritative gate is the real
# `dotfiles-provision verify`. Do NOT remove the gates "to make verify
# stricter" — that breaks bootstrap.yaml --check.
#
# The csg-info vacuity note (deferred-work 2026-08-12, Story 2.11 review):
# csg's `info` swallows ConfigResolutionError and exits 0 even on a
# parse-broken file (info_cmd.py:43-44), so the csg parse-gate task is a
# DOCUMENTED WEAK gate. The authoritative CSG parse proof is the dynamic
# spine-target extraction below (reads the RENDERED settings.toml and asserts
# every spine path it references resolves) + Story 3.3's settings-parity. The
# WEG half can actually fail and stays a real gate; the ITR list gate pins
# icons.yaml (SPEC.md#51).
#
# Config-copies symlink check (criterion 9, config-in-spine 2026-08-16): each
# managed ~/.config/<name> must be a symlink into the spine. The 5-layer check
# (islnk → exact spine target → resolves-to-dir → content-through-link →
# functional parse) runs below via layered stat + asserts; a real dir / foreign
# symlink / broken link fails loudly (runtime independence — mirror of
# config_links dest-check).
#
# No hardcoded absolute paths: every install-spine value is
# {{ install_dir | trim }} (trim lock) and every config target derives from
# {{ verify_xdg_config_home }}.

- name: Assert fact-gathering provided HOME
  ansible.builtin.assert:
    that: ansible_facts.env.HOME is defined and ansible_facts.env.HOME | trim | length > 0
    fail_msg: >-
      ansible_facts.env.HOME is undefined — the verify role derives its targets
      from gathered facts; the playbook must run with gather_facts: true
      (vars/main.yml reads ansible_facts.env.XDG_CONFIG_HOME and HOME)

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that:
      - install_dir is defined
      - install_dir is not none
      - install_dir is string
      - install_dir | trim | length > 0
      - install_dir | trim | regex_search('^/') is not none
      - install_dir | trim | regex_search('/$') is none
    fail_msg: >-
      install_dir is undefined, null, relative, empty, or ends in a trailing
      slash — the verify role gates rendered files and requires the install_dir
      seam extra-var as an absolute, non-empty path without a trailing slash
      (the orchestrator resolves $XDG_DATA_HOME/dotfiles/; direct runs pass
      -e install_dir=...; the trailing-slash rejection keeps the
      {{ install_dir | trim }}/<child> derivations single-slash)

- name: Assert composition manifests seam is provided
  ansible.builtin.assert:
    that:
      - manifests_dir is defined
      - manifests_dir is string
      - manifests_dir | trim | length > 0
    fail_msg: >-
      manifests_dir is undefined or empty — verify consumes the composition's
      apps.yaml + program-tuple.yaml to check exactly one owner for every AGS
      app. The engine CLI resolves it from --manifests-dir; direct runs pass
      -e manifests_dir=...

- name: Read the composition app list and program tuple for the AGS owner audit
  ansible.builtin.set_fact:
    verify_ags_apps_document: "{{ lookup('file', verify_ags_apps_units_apps_file) | from_yaml }}"
    verify_ags_tuple: "{{ lookup('file', verify_ags_apps_units_tuple_file) | from_yaml }}"

- name: Partition the app list (final all-standalone topology)
  ansible.builtin.set_fact:
    verify_ags_standalone_apps: "{{ verify_ags_apps_document.apps | selectattr('owner', 'equalto', 'standalone') | list }}"
    verify_ags_standalone_names: "{{ verify_ags_apps_document.apps | selectattr('owner', 'equalto', 'standalone') | map(attribute='app') | list }}"
    verify_ags_always_on_instances: >-
      {{ verify_ags_apps_document.apps
         | selectattr('owner', 'equalto', 'standalone')
         | selectattr('launch', 'equalto', 'always')
         | map(attribute='instance') | list }}

- name: Assert every AGS app is standalone and the surfaces are unique
  ansible.builtin.assert:
    that:
      - verify_ags_standalone_apps | length == verify_ags_apps_document.apps | length
      - verify_ags_apps_document.apps | map(attribute='owner') | unique | list == ['standalone']
      - >-
        verify_ags_apps_document.apps | map(attribute='app') | unique | list | length
        == verify_ags_apps_document.apps | length
      - >-
        verify_ags_apps_document.apps | map(attribute='instance') | unique | list | length
        == verify_ags_apps_document.apps | length
      - >-
        verify_ags_apps_document.apps | map(attribute='configDir') | unique | list | length
        == verify_ags_apps_document.apps | length
      - >-
        verify_ags_apps_document.apps | map(attribute='configLink') | unique | list | length
        == verify_ags_apps_document.apps | length
      - >-
        verify_ags_apps_document.apps | map(attribute='spineLink') | unique | list | length
        == verify_ags_apps_document.apps | length
      - >-
        verify_ags_apps_document.apps | map(attribute='xdgLink') | unique | list | length
        == verify_ags_apps_document.apps | length
      - >-
        verify_ags_apps_document.apps | map(attribute='installDir') | unique | list | length
        == verify_ags_apps_document.apps | length
    fail_msg: >-
      the composition app list must be the final all-standalone topology:
      every AGS app is owner=standalone and its identity/link/install surfaces
      are unique (AD-31/AD-32). A legacy entry has no installer — the old
      `ags_apps` role is retired.

- name: Assert the program tuple names exactly the three program tags
  ansible.builtin.assert:
    that:
      - verify_ags_tuple.keys() | sort == ['ags-platform', 'contracts', 'dotfiles-assets', 'schemaVersion']
      - verify_ags_tuple.schemaVersion == 1
      - verify_ags_tuple['ags-platform'] is match('^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$')
      - verify_ags_tuple.contracts is match('^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$')
      - verify_ags_tuple['dotfiles-assets'] is match('^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$')
    fail_msg: >-
      the composition program-tuple.yaml is not the schemaVersion 1 tuple of
      ags-platform/contracts/dotfiles-assets semver tags (AD-34).

# R-17: the engine tag is machine state. `installer.pin` in the composition is
# the one source, bootstrap passes it as `expected_engine_tag`, and verify
# asserts the installed console reports that version. Without this, "which
# engine provisioned this host?" is answered only by the bootstrap log.
- name: Read the installed engine version
  ansible.builtin.command:
    argv:
      - "{{ verify_cli_bin_dir | trim }}/dotfiles-provision"
      - --output-format
      - plain
      - version
  register: verify_engine_version_check
  changed_when: false
  failed_when: false
  tags: [engine]
  when:
    - not ansible_check_mode
    - verify_expected_engine_tag | trim | length > 0

- name: Assert the installed engine version matches the expected pin
  ansible.builtin.assert:
    that:
      - verify_engine_version_check.rc == 0
      - (verify_engine_version_check.stdout | trim) == (verify_expected_engine_tag | trim | regex_replace('^v', ''))
    fail_msg: >-
      the engine that provisioned this host is not the composition's
      installer.pin (R-17). Expected `dotfiles-provision version` to report
      {{ verify_expected_engine_tag | trim | regex_replace('^v', '') }} (pin
      {{ verify_expected_engine_tag }}), observed
      rc={{ verify_engine_version_check.rc | default('n/a', true) }},
      stdout={{ verify_engine_version_check.stdout | default('', true) | trim }}
      from {{ verify_cli_bin_dir | trim }}/dotfiles-provision. A stale or
      different engine tool install means bootstrap installed an engine other
      than the pinned tag; re-install the engine at the pin, then re-run verify
  tags: [engine]
  when:
    - not ansible_check_mode
    - verify_expected_engine_tag | trim | length > 0

- name: Assert verify list vars are not empty
  ansible.builtin.assert:
    that:
      - verify_system_binaries | length > 0
      - verify_cli_tools | length > 0
      - verify_notifd_binding_packages | length > 0
      - verify_astal_wp_binding_packages | length > 0
      - verify_install_spine_dirs | length > 0
      - verify_install_spine_files | length > 0
      - verify_palette_files | length > 0
      - verify_settings_files | length > 0
      - verify_compositor_config_dirs | length > 0
      - verify_compositor_skeleton_files | length > 0
      - verify_ags_platform_unit_files | length > 0
      - verify_consumer_symlinks | length > 0
      - verify_xdg_dirs | length > 0
      - verify_config_copies_targets | length > 0
      - verify_gtk_skeleton_files | length > 0
      - verify_btop_theme_files | length > 0
      - verify_icons_samples | length > 0
      - verify_derivation_template_dirs | length > 0
      - verify_greeter_compositor_packages | length > 0
    fail_msg: >-
      a verify list var is empty — a runtime override or a manifest desync
      silently disabled a criterion: every count assert is
      `selectattr(...) | length == <list> | length`, so an emptied list passes
      0 == 0 and the gate goes green on an unprovisioned machine (mirror of the
      config_copies empty-list guard)
  run_once: true

- name: Assert binary and tool names are safe identifiers
  ansible.builtin.assert:
    that:
      - verify_system_binaries | map('regex_search', '^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$') | reject('none') | list | length == verify_system_binaries | length
      - verify_cli_tools | map('regex_search', '^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$') | reject('none') | list | length == verify_cli_tools | length
    fail_msg: >-
      a system-binary or CLI-tool name contains shell metacharacters — the
      `command -v <name>` check interpolates each name into a shell string;
      names must match ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ (defense against a
      metacharacter-bearing override executing in the shell)

# Check-gate discipline (the role's ungated-shell sweep; see the AstalNotifd
# block below for the full rationale, and
# openspec/changes/harden-verify-probes-and-manifest/ for the mechanism
# evidence). `shell` is documented check_mode: support: PARTIAL just like
# `command`, so the gate is DECLARED here rather than inherited from
# ansible-core's short-circuit. The short-circuit fabricates `rc: 0` — a probe
# that never ran reports success — and it is what kept this task ungated in the
# first place. The assert below is already gated
# `when: not ansible_check_mode`, which is what makes this safe: a
# conditionally-skipped register carries NO `results` key, so the assert must
# never dereference it under --check. It does not, so no consumer change is
# needed here (contrast the Hyprland probe at `verify_hyprland_check`, whose
# debug consumer did need `not ansible_check_mode and <reg>.rc != 0`).
- name: Check system binaries on PATH
  ansible.builtin.shell: "command -v {{ item }}"
  loop: "{{ verify_system_binaries }}"
  register: verify_system_binary_checks
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert system binaries are on PATH
  ansible.builtin.assert:
    that:
      - verify_system_binary_checks.results | selectattr('rc', 'equalto', 0) | list | length == verify_system_binaries | length
      - verify_system_binary_checks.results | map(attribute='stdout') | reject('equalto', '') | list | length == verify_system_binaries | length
    fail_msg: >-
      not every system binary is on PATH (expected hyprland, hyprpaper, ags
      — done-criterion 2). The packages role (Story 2.3) installs them via the
      group_vars package list; run the packages playbook first (direct-run
      prerequisite). Fonts are NOT checked here — fonts are fontconfig files,
      not PATH binaries
  when: not ansible_check_mode

# NetworkManager is the DBus backend astal-network (the AGS bar) reads. A bare
# package install leaves no daemon running, which makes the bar report
# "no network" and the network-click TUI exit instantly. Gate on the service
# being active so a provisioned machine cannot silently lack it.
- name: Check NetworkManager service is active
  ansible.builtin.shell: systemctl is-active NetworkManager
  register: verify_nm_service
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert NetworkManager is running
  ansible.builtin.assert:
    that:
      - verify_nm_service.rc == 0
      - verify_nm_service.stdout | trim == "active"
    fail_msg: >-
      NetworkManager is not running — the AGS bar's network widget (astal-network,
      libnm) needs it to report wifi/wired and the network-click TUI (wifitui)
      needs it to connect. The packages role enables+starts it; re-run the
      packages playbook or start it with `systemctl start NetworkManager`
  when: not ansible_check_mode

# BlueZ is the D-Bus backend the settings panel's own bluetooth-service.ts
# reads directly. A bare bluez install leaves bluetooth.service disabled and
# inactive (verified live 2026-09-18), which makes the panel report no adapter
# and every BT control a no-op. Gate on BOTH enabled (survives reboot) and
# active (usable now) — mirror of the NetworkManager gate shape.
- name: Check bluetooth service is enabled
  ansible.builtin.command:
    cmd: "systemctl is-enabled {{ verify_bluetooth_service }}"
  register: verify_bluetooth_enabled
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Check bluetooth service is active
  ansible.builtin.command:
    cmd: "systemctl is-active {{ verify_bluetooth_service }}"
  register: verify_bluetooth_active
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert bluetooth service is enabled and running
  ansible.builtin.assert:
    that:
      - verify_bluetooth_enabled.stdout | trim == "enabled"
      - verify_bluetooth_active.stdout | trim == "active"
    fail_msg: >-
      {{ verify_bluetooth_service }} is not enabled and running (enabled={{
      verify_bluetooth_enabled.stdout | trim }}, active={{
      verify_bluetooth_active.stdout | trim }}) — the settings panel's
      Bluetooth service (bluetooth-service.ts) needs the BlueZ daemon. The
      packages role enables+starts it; re-run the packages playbook or run
      `systemctl enable --now {{ verify_bluetooth_service }}`
  when: not ansible_check_mode

# REQ-003: the power-options profiles must not re-block Bluetooth when the
# user switches to Powersave/Balanced. The role rewrites `block_bt` to false;
# this gate reads the deployed files so a package update that restores `true`
# fails provisioning instead of silently disabling the radio later.
- name: Check the power-options Bluetooth policy marker
  ansible.builtin.stat:
    path: "{{ verify_power_options_marker }}"
  register: verify_power_options_marker_stat
  when: not ansible_check_mode

- name: Read the power-options Bluetooth profiles
  ansible.builtin.slurp:
    src: "{{ verify_power_options_profile_dir }}/{{ item }}"
  loop: "{{ verify_power_options_bt_profiles }}"
  register: verify_power_options_contents
  failed_when: false
  when:
    - not ansible_check_mode
    - verify_power_options_marker_stat.stat.exists | default(false)

- name: Assert the power-options profiles do not soft-block Bluetooth
  ansible.builtin.assert:
    that:
      - item.content is defined
      - item.content | b64decode is search('(?m)^block_bt = false$')
    fail_msg: >-
      power-options profile {{ item.item }} still soft-blocks Bluetooth
      ({{ item.msg | default('missing file or block_bt = true', true) }}) —
      switching to Powersave/Balanced would disable the radio. The power_options
      role rewrites this flag; re-run the power-options playbook or the
      bootstrap aggregate.
  loop: "{{ verify_power_options_contents.results }}"
  when:
    - not ansible_check_mode
    - verify_power_options_marker_stat.stat.exists | default(false)

# hyprpolkitagent ships no PATH binary (it runs from /usr/lib via its user
# unit), so `command -v` cannot gate it. Gate on unit presence instead:
# autostart.lua starts it at login, and a missing install fails that start
# silently (broken polkit dialogs). Presence — not active — is asserted: at
# provision time there may be no graphical session running it yet.
- name: Check polkit agent user unit is installed
  ansible.builtin.command:
    argv: ["systemctl", "--user", "list-unit-files", "hyprpolkitagent.service"]
  register: verify_polkit_unit
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert polkit agent user unit is installed
  ansible.builtin.assert:
    that:
      - verify_polkit_unit.stdout is search('hyprpolkitagent.service')
    fail_msg: >-
      the hyprpolkitagent user unit is not installed — autostart.lua starts
      it at login and polkit authentication has no agent without it. The
      packages role installs it (portals key); run the packages playbook
      first (direct-run prerequisite)
  when: not ansible_check_mode

# The daemon can be up while the RADIO is rfkill SOFT-blocked (vendor WMI
# killswitch state, or a block systemd-rfkill persisted from a previous
# session) — BlueZ refuses to power a blocked controller and the panel's
# `adapter.powered` setter fails silently. The packages role clears a soft
# block at provision time; gate it here so the silent no-op cannot regress.
- name: Check the Bluetooth radio is not rfkill soft-blocked
  ansible.builtin.command:
    argv: ["rfkill", "-o", "TYPE,SOFT", "list"]
  register: verify_bluetooth_rfkill
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert the Bluetooth radio is not soft-blocked
  ansible.builtin.assert:
    that:
      - verify_bluetooth_rfkill.rc == 0
      - verify_bluetooth_rfkill.stdout is search('(?m)^' ~ verify_bluetooth_rfkill_type ~ '\s+unblocked')
    fail_msg: >-
      the Bluetooth radio is rfkill soft-blocked (rfkill output: {{
      verify_bluetooth_rfkill.stdout | trim }}) — BlueZ cannot power a blocked
      controller and the settings panel's toggle would be a silent no-op. The
      packages role runs `rfkill unblock bluetooth`; re-run the packages
      playbook or run `sudo rfkill unblock bluetooth`. A HARD block needs the
      physical switch.
  when: not ansible_check_mode

# A connected headset is silently unroutable without the bluez5 SPA: WirePlumber
# then creates NO Bluetooth audio sink (installing bluez alone is not enough).
# The packages role installs the PipeWire package that ships it; gate it here.
- name: Check the PipeWire bluez5 SPA package is installed
  ansible.builtin.command:
    cmd: "pacman -Q {{ item }}"
  loop: "{{ verify_bluetooth_audio_packages }}"
  register: verify_bluetooth_audio_checks
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert the Bluetooth audio (bluez5 SPA) package is installed
  ansible.builtin.assert:
    that:
      - verify_bluetooth_audio_checks.results | selectattr('rc', 'equalto', 0) | list | length == verify_bluetooth_audio_packages | length
    fail_msg: >-
      the PipeWire Bluetooth audio package is missing (expected {{
      verify_bluetooth_audio_packages | join(', ') }}) — without the bluez5 SPA
      WirePlumber creates no Bluetooth audio sink, so a connected headset has no
      audio to route to. The packages role installs it; re-run the packages
      playbook.
  when: not ansible_check_mode

# Audio stack (add-pipewire-audio-control): pipewire + wireplumber are the graph
# and session layer AstalWp reads for the AGS audio bar/popup; pipewire-pulse is
# the PulseAudio-compatibility server pavucontrol talks to. The packages role
# enables the USER units globally (`systemctl --global enable`), which writes
# the system-wide /etc/systemd/user default-target wants. A bare package install
# does not enable wireplumber.service (it is not socket-activated), so a machine
# with the packages but no enabled units comes up with no audio graph and every
# audio surface is inert. Gate `--global is-enabled` (survives reboot for every
# user), mirror of the bluetooth.service enabled gate shape.
- name: Check audio user units are enabled globally
  ansible.builtin.command:
    cmd: "systemctl --global is-enabled {{ item }}"
  loop: "{{ verify_audio_user_units }}"
  register: verify_audio_unit_checks
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert audio user units are enabled globally
  ansible.builtin.assert:
    that:
      - >-
        (verify_audio_unit_checks.results | selectattr('stdout', 'equalto', 'enabled') | list | length)
        == verify_audio_user_units | length
    fail_msg: >-
      not globally enabled: {{ verify_audio_user_units | join(', ') }} (states:
      {{ verify_audio_unit_checks.results | map(attribute='stdout') | map('trim') | join(', ') }})
      — the AGS audio surfaces (AstalWp over WirePlumber) need the PipeWire
      user units enabled so the graph exists in every session. The packages
      role runs `systemctl --global enable`; re-run the packages playbook or run
      `sudo systemctl --global enable {{ verify_audio_user_units | join(' ') }}`.
  when: not ansible_check_mode

# The settings panel's Display slider drives `brightnessctl set <pct>%` as the
# session user (and reads with `-m`). The packages role installs brightnessctl
# and its udev rule grants the session write access; a machine where even the
# read fails would ship a slider that is a silent no-op, so gate it here.
- name: Check backlight is readable as the user
  ansible.builtin.command:
    argv:
      - "{{ verify_backlight_binary }}"
      - -m
  register: verify_backlight_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert brightnessctl can read the backlight
  ansible.builtin.assert:
    that:
      - verify_backlight_check.rc == 0
      - verify_backlight_check.stdout | trim | length > 0
    fail_msg: >-
      `{{ verify_backlight_binary }} -m` failed — the settings panel's Display
      slider would be a silent no-op. The packages role installs brightnessctl
      and its udev rule grants the session user access; run the packages
      playbook or check `{{ verify_backlight_binary }} -m` as the user
  when: not ansible_check_mode

# ── Display manager: the SDDM Wayland greeter must be able to start ──────────
# BUG-004: the machine booted into SDDM with DisplayServer=wayland but no
# Wayland compositor. SDDM fell back to x11-user on every login; the session
# got a new VT and was torn down after ~90 s (journal: `falling back to
# DisplayServer=x11-user`, `Session started false`). The install-time preflight
# in the display_manager role fails closed; these post-provision probes prove
# the deployed state still holds. STATIC ONLY: never restart SDDM here (it
# would kill the live session); the behavioral check is after the next reboot.
- name: Check the greeter compositor is on PATH
  ansible.builtin.shell: "command -v {{ item }}"
  loop: "{{ verify_greeter_compositor_packages }}"
  register: verify_greeter_compositor_checks
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert the greeter compositor is on PATH
  ansible.builtin.assert:
    that:
      - verify_greeter_compositor_checks.results | selectattr('rc', 'equalto', 0) | list | length == verify_greeter_compositor_packages | length
      - verify_greeter_compositor_checks.results | map(attribute='stdout') | reject('equalto', '') | list | length == verify_greeter_compositor_packages | length
    fail_msg: >-
      the SDDM Wayland greeter has no compositor (expected {{
      verify_greeter_compositor_packages | join(', ') }} on PATH). SDDM falls
      back to DisplayServer=x11-user and the session is torn down after ~90 s
      (BUG-004). The display_manager role installs the compositor and asserts
      it; re-run the display-manager playbook.
  when: not ansible_check_mode

- name: Read the rendered SDDM config
  ansible.builtin.slurp:
    src: "{{ verify_sddm_conf }}"
  register: verify_sddm_conf_raw
  when: not ansible_check_mode

- name: Assert the SDDM config keeps the Wayland greeter and names its compositor
  ansible.builtin.assert:
    that:
      - ('DisplayServer=' ~ verify_sddm_display_server) in (verify_sddm_conf_raw.content | b64decode).splitlines()
      - "'[Wayland]' in (verify_sddm_conf_raw.content | b64decode).splitlines()"
      - ('CompositorCommand=' ~ verify_sddm_compositor_command) in (verify_sddm_conf_raw.content | b64decode).splitlines()
    fail_msg: >-
      {{ verify_sddm_conf }} does not configure the Wayland greeter compositor
      (expected an exact `DisplayServer={{ verify_sddm_display_server }}` line,
      a `[Wayland]` section and
      `CompositorCommand={{ verify_sddm_compositor_command }}`). Without the
      compositor SDDM falls back to x11-user and the session bounces after
      ~90 s (BUG-004). Re-run the display-manager playbook; do NOT switch the
      display server to x11 (that reintroduces the GPU hard-freeze).
  when: not ansible_check_mode

- name: Read the installed Pixie theme HEAD
  ansible.builtin.command:
    argv:
      - git
      # The theme checkout is root-owned; a bare `git -C` fails with
      # "detected dubious ownership" as the (non-root) verify user.
      - -c
      - safe.directory=*
      - -C
      - "{{ verify_pixie_themedir }}"
      - rev-parse
      - HEAD
  register: verify_pixie_head
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert the installed Pixie theme is the pinned commit
  ansible.builtin.assert:
    that:
      - verify_pixie_head.rc == 0
      - verify_pixie_head.stdout | trim == verify_pixie_repo_ref
    fail_msg: >-
      the Pixie theme at {{ verify_pixie_themedir }} is not the pinned commit
      (expected {{ verify_pixie_repo_ref }}, got
      '{{ verify_pixie_head.stdout | trim }}'). The display_manager role pins a
      commit — not the moving `main` branch — because the login-timeout patch
      edits Main.qml. Re-run the display-manager playbook.
  when: not ansible_check_mode

- name: Read the installed Pixie theme login timeout
  ansible.builtin.slurp:
    src: "{{ verify_pixie_main_qml }}"
  register: verify_pixie_main_qml_raw
  when: not ansible_check_mode

- name: Assert the Pixie login-timeout patch is applied exactly once
  ansible.builtin.assert:
    that:
      - >-
        (verify_pixie_main_qml_raw.content | b64decode
         | regex_findall('(?m)^\\s*interval: 0\\s*$')) | length == 1
      - >-
        (verify_pixie_main_qml_raw.content | b64decode
         | regex_findall('(?m)^\\s*interval: 5000\\s*$')) | length == 0
    fail_msg: >-
      {{ verify_pixie_main_qml }} does not carry the applied login-timeout
      patch (expected exactly one `interval: 0` line and no `interval: 5000`).
      The display_manager role fails closed when the source pattern is absent
      or duplicated; re-run the display-manager playbook (BUG-004).
  when: not ansible_check_mode

# Sibling of the system-binary probe above: same declared gate, same already-
# gated consumer (the assert below), so the register's missing `results` key
# under --check is never dereferenced.
- name: Check CLI tools on PATH
  ansible.builtin.shell: "command -v {{ item }}"
  loop: "{{ verify_cli_tools }}"
  register: verify_cli_tool_checks
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ verify_cli_bin_dir }}:{{ ansible_facts.env.PATH }}"
  when: not ansible_check_mode

- name: Assert CLI tools are on PATH
  ansible.builtin.assert:
    that:
      - verify_cli_tool_checks.results | selectattr('rc', 'equalto', 0) | list | length == verify_cli_tools | length
      - verify_cli_tool_checks.results | map(attribute='stdout') | reject('equalto', '') | list | length == verify_cli_tools | length
    fail_msg: >-
      not every CLI tool is on PATH (expected csg, weg, itr, dotfiles-runtime —
      done-criterion 3). The cli_tools role (Story 2.4) installs them via uv tool install
      into {{ verify_cli_bin_dir }}; the check prepends that dir to PATH. Run
      the cli-tools playbook first (direct-run prerequisite)
  when: not ansible_check_mode

# AD-11: the CLI PATH gate above is necessary but not sufficient — `command -v
# itr` is green for ANY installed version, including a stale local-path install.
# itr is the first CLI consumed as a pinned repo, so verify asserts the pin by
# EXECUTION, mirroring the ags_apps precedent (`lnk_target is search(<tag>)`):
#   (a) the tag-qualified checkout exists at <install>/cli-tools/itr/<tag>/;
#   (b) the pin record next to it contains exactly the tag;
#   (c) `itr --version` reports the contract token the `contracts` pin names.
# Layer (a) names the tag in the path, so a checkout materialized under a
# different tag can never satisfy it; (b) catches a repointed/stale pin record;
# (c) catches a tool env installed from a path that was later re-pinned.
- name: Check the pinned itr checkout and its pin record
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ verify_itr_checkout }}"
    - "{{ verify_itr_pin_file }}"
  register: verify_itr_checkout_checks

- name: Read the itr pin record
  ansible.builtin.slurp:
    src: "{{ verify_itr_pin_file }}"
  register: verify_itr_pin
  when: not ansible_check_mode

- name: Read the installed itr version handshake
  ansible.builtin.command:
    argv:
      - "{{ verify_cli_bin_dir | trim }}/itr"
      - --version
  register: verify_itr_version_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert the itr checkout is the pinned tag and reports the pinned contract
  ansible.builtin.assert:
    that:
      - verify_itr_checkout_checks.results[0].stat.isdir
      - verify_itr_checkout_checks.results[1].stat.isreg
      - verify_itr_checkout is search(verify_itr_version)
      - verify_itr_pin.content | b64decode | trim == verify_itr_version
      - verify_itr_version_check.rc == 0
      - "'contract ' ~ verify_itr_contract_version in verify_itr_version_check.stdout"
    fail_msg: >-
      the pinned itr install is not the tag `verify` mirrors (spine
      AD-10/AD-11). Expected the checkout at {{ verify_itr_checkout }}/ (path
      naming {{ verify_itr_version }}), the pin record
      {{ verify_itr_pin_file }} containing exactly {{ verify_itr_version }},
      and `itr --version` reporting `contract {{ verify_itr_contract_version }}`
      (the `contracts` tag this repo pins, AD-4). Observed:
      rc={{ verify_itr_version_check.rc | default('n/a', true) }},
      stdout={{ verify_itr_version_check.stdout | default('', true) | trim }},
      pin={{ verify_itr_pin.content | default('', true) | b64decode | trim }}.
      A stale local-path install or a pin-file/checkout mismatch means
      provisioning never re-pinned itr; re-run the cli-tools playbook
  when: not ansible_check_mode

# REQ-002: the runtime follows the same three legs (CHECKOUT / PIN / VERSION).
# It has no `--version` flag and no contract token: `dotfiles-runtime version`
# prints the package version, which must equal the tag without its leading `v`.
- name: Check the pinned dotfiles-runtime checkout and its pin record
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ verify_runtime_checkout }}"
    - "{{ verify_runtime_pin_file }}"
  register: verify_runtime_checkout_checks

- name: Read the dotfiles-runtime pin record
  ansible.builtin.slurp:
    src: "{{ verify_runtime_pin_file }}"
  register: verify_runtime_pin
  when: not ansible_check_mode

- name: Read the installed dotfiles-runtime version
  ansible.builtin.command:
    argv:
      - "{{ verify_cli_bin_dir | trim }}/dotfiles-runtime"
      - version
  register: verify_runtime_version_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert the dotfiles-runtime checkout is the pinned tag and reports the pinned version
  ansible.builtin.assert:
    that:
      - verify_runtime_checkout_checks.results[0].stat.isdir
      - verify_runtime_checkout_checks.results[1].stat.isreg
      - verify_runtime_checkout is search(verify_runtime_version)
      - verify_runtime_pin.content | b64decode | trim == verify_runtime_version
      - verify_runtime_version_check.rc == 0
      - verify_runtime_version_check.stdout | trim == verify_runtime_tool_version
    fail_msg: >-
      the pinned dotfiles-runtime install is not the tag `verify` mirrors
      (spine AD-10/AD-11). Expected the checkout at {{ verify_runtime_checkout }}/,
      the pin record {{ verify_runtime_pin_file }} containing exactly
      {{ verify_runtime_version }}, and `dotfiles-runtime version` printing
      {{ verify_runtime_tool_version }}. Observed:
      rc={{ verify_runtime_version_check.rc | default('n/a', true) }},
      stdout={{ verify_runtime_version_check.stdout | default('', true) | trim }},
      pin={{ verify_runtime_pin.content | default('', true) | b64decode | trim }}.
      A stale source-path install or a pin-file/checkout mismatch means
      provisioning never re-pinned dotfiles-runtime; re-run the cli-tools playbook
  when: not ansible_check_mode

# runtime REQ-004 / BUG-008: the producer is a runtime-owned config file, not
# ambient env. runtime_daemon renders it BEFORE the daemon starts and before
# runtime-seed runs, from the SAME provisioning inputs verify compares against
# here. A missing/malformed file or a producer/engine mismatch fails loud.
- name: Read the runtime producer config
  ansible.builtin.slurp:
    src: "{{ verify_producer_config_path }}"
  register: verify_producer_config_raw
  when: not ansible_check_mode

- name: Assert the runtime producer config matches the selected values
  ansible.builtin.assert:
    that:
      - (verify_producer_config_raw.content | b64decode | from_json).schema_version == verify_producer_config_schema_version
      - (verify_producer_config_raw.content | b64decode | from_json).producer == verify_expected_producer
      - (verify_producer_config_raw.content | b64decode | from_json).tpr_engine == verify_expected_tpr_engine
      - (verify_producer_config_raw.content | b64decode | from_json).tpr_runtime == verify_expected_tpr_runtime
    fail_msg: >-
      {{ verify_producer_config_path }} does not match the provisioning inputs
      (runtime REQ-004). Expected schema_version={{ verify_producer_config_schema_version }},
      producer={{ verify_expected_producer }}, tpr_engine={{ verify_expected_tpr_engine }},
      tpr_runtime={{ verify_expected_tpr_runtime }}; got
      {{ verify_producer_config_raw.content | default('', true) | b64decode | trim }}.
      runtime_daemon renders this file before the daemon and runtime-seed;
      re-run the runtime-daemon playbook (or bootstrap in order).
  when: not ansible_check_mode

# S5: `weg` follows the same four legs (CHECKOUT / PIN / CONTRACT / IMAGE).
# `weg` is the FIRST container-mode CLI consumed as a pinned repo, so the pin
# assertion must also cover the image the role built: AD-7 says the image tag
# IS the pin (never `latest`), and AD-11 says verify asserts the expected image
# exists AT that tag. `engine image inspect <ref>` (podman and docker share the
# subcommand) exits nonzero for a missing tag, so a `latest`-only image or one
# left at the previous pin fails here instead of surfacing as a runtime pull
# error. The reference mirrors the CLI's own naming
# (`<image_name>-<engine>:<tag>`), the same derivation the rendered settings
# use; `verify_weg_image_name` is the `[container] image_name` the settings
# template pins.
- name: Check the pinned weg checkout and its pin record
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ verify_weg_checkout }}"
    - "{{ verify_weg_pin_file }}"
  register: verify_weg_checkout_checks

- name: Read the weg pin record
  ansible.builtin.slurp:
    src: "{{ verify_weg_pin_file }}"
  register: verify_weg_pin
  when: not ansible_check_mode

- name: Read the installed weg version handshake
  ansible.builtin.command:
    argv:
      - "{{ verify_cli_bin_dir | trim }}/weg"
      - --version
  register: verify_weg_version_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Check the pinned weg image exists at the tag-qualified reference
  ansible.builtin.command:
    argv:
      - "{{ container_runtime_engine }}"
      - image
      - inspect
      - "{{ verify_weg_image_reference }}"
  register: verify_weg_image_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert the weg checkout, pin, contract and image are the pinned tag
  ansible.builtin.assert:
    that:
      - verify_weg_checkout_checks.results[0].stat.isdir
      - verify_weg_checkout_checks.results[1].stat.isreg
      - verify_weg_checkout is search(verify_weg_version)
      - verify_weg_pin.content | b64decode | trim == verify_weg_version
      - verify_weg_version_check.rc == 0
      - "'contract ' ~ verify_weg_contract_version in verify_weg_version_check.stdout"
      - verify_weg_image_check.rc == 0
    fail_msg: >-
      the pinned weg install is not the tag `verify` mirrors (spine
      AD-10/AD-11). Expected the checkout at {{ verify_weg_checkout }}/ (path
      naming {{ verify_weg_version }}), the pin record
      {{ verify_weg_pin_file }} containing exactly {{ verify_weg_version }},
      `weg --version` reporting `contract {{ verify_weg_contract_version }}`
      (the `contracts` tag this repo pins, AD-4), and the image
      {{ verify_weg_image_reference }} present (AD-7: the image tag IS the
      pin, never `latest`). Observed:
      rc={{ verify_weg_version_check.rc | default('n/a', true) }},
      stdout={{ verify_weg_version_check.stdout | default('', true) | trim }},
      pin={{ verify_weg_pin.content | default('', true) | b64decode | trim }},
      image_rc={{ verify_weg_image_check.rc | default('n/a', true) }}.
      A stale local-path install, a pin-file/checkout mismatch, or an image
      left at another tag means provisioning never re-pinned weg; re-run the
      cli-tools playbook
  when: not ansible_check_mode

# S6: `csg` closes the pinned-CLI set. Same four legs as itr/weg, with FOUR
# images instead of one: csg's `install` builds `base` + one per backend
# (`custom`, `pywal`, `wallust`), each engine-qualified at the pin. The build
# took the tag from `COLORSCHEME__CONTAINER__IMAGE_TAG` (its verb has no
# `--image-tag`), so the images that exist at `<prefix>-<suffix>-<engine>:<pin>`
# are exactly what the rendered settings resolve. A `latest`-only image (the
# pre-S6 shape) or one left at the previous pin fails here.
- name: Check the pinned csg checkout and its pin record
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ verify_csg_checkout }}"
    - "{{ verify_csg_pin_file }}"
  register: verify_csg_checkout_checks

- name: Read the csg pin record
  ansible.builtin.slurp:
    src: "{{ verify_csg_pin_file }}"
  register: verify_csg_pin
  when: not ansible_check_mode

- name: Read the installed csg version handshake
  ansible.builtin.command:
    argv:
      - "{{ verify_cli_bin_dir | trim }}/csg"
      - --version
  register: verify_csg_version_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Check every pinned csg image exists at its tag-qualified reference
  ansible.builtin.command:
    argv:
      - "{{ container_runtime_engine }}"
      - image
      - inspect
      - "{{ item }}"
  loop: "{{ verify_csg_image_references }}"
  register: verify_csg_image_checks
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert the csg checkout, pin, contract and all four images are the pinned tag
  ansible.builtin.assert:
    that:
      - verify_csg_checkout_checks.results[0].stat.isdir
      - verify_csg_checkout_checks.results[1].stat.isreg
      - verify_csg_checkout is search(verify_csg_version)
      - verify_csg_pin.content | b64decode | trim == verify_csg_version
      - verify_csg_version_check.rc == 0
      - "'contract ' ~ verify_csg_contract_version in verify_csg_version_check.stdout"
      - verify_csg_image_checks.results | selectattr('rc', 'equalto', 0) | list | length == verify_csg_image_references | length
    fail_msg: >-
      the pinned csg install is not the tag `verify` mirrors (spine
      AD-10/AD-11). Expected the checkout at {{ verify_csg_checkout }}/ (path
      naming {{ verify_csg_version }}), the pin record
      {{ verify_csg_pin_file }} containing exactly {{ verify_csg_version }},
      `csg --version` reporting `contract {{ verify_csg_contract_version }}`
      (the `contracts` tag this repo pins, AD-4), and ALL FOUR images
      ({{ verify_csg_image_references | join(', ') }}) present — base plus the
      custom/pywal/wallust backends at the pin (AD-7: the image tag IS the pin,
      never `latest`). Observed:
      rc={{ verify_csg_version_check.rc | default('n/a', true) }},
      stdout={{ verify_csg_version_check.stdout | default('', true) | trim }},
      pin={{ verify_csg_pin.content | default('', true) | b64decode | trim }},
      missing_images={{ verify_csg_image_checks.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}.
      A stale local-path install, a pin-file/checkout mismatch, or an image
      left at another tag means provisioning never re-pinned csg; re-run the
      cli-tools playbook
  when: not ansible_check_mode

# REQ-010: `tpr` follows the same execution-asserted pin as csg, with THREE
# images (base + the matugen/native engines). tpr v0.4.0 has no `contract <x>`
# token in `--version`, so the assertion is the exact package version (the tag
# without its leading `v`) plus the tag-qualified image set. The rendered
# settings carry `image_prefix = "tpr"` and the same pin, so a missing image or
# one left at `latest`/the previous pin fails here.
- name: Check the pinned tpr checkout and its pin record
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ verify_tpr_checkout }}"
    - "{{ verify_tpr_pin_file }}"
  register: verify_tpr_checkout_checks

- name: Read the tpr pin record
  ansible.builtin.slurp:
    src: "{{ verify_tpr_pin_file }}"
  register: verify_tpr_pin
  when: not ansible_check_mode

- name: Read the installed tpr version
  ansible.builtin.command:
    argv:
      - "{{ verify_cli_bin_dir | trim }}/tpr"
      - --version
  register: verify_tpr_version_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Check every pinned tpr image exists at its tag-qualified reference
  ansible.builtin.command:
    argv:
      - "{{ container_runtime_engine }}"
      - image
      - inspect
      - "{{ item }}"
  loop: "{{ verify_tpr_image_references }}"
  register: verify_tpr_image_checks
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert the tpr checkout, pin, version and all three images are the pinned tag
  ansible.builtin.assert:
    that:
      - verify_tpr_checkout_checks.results[0].stat.isdir
      - verify_tpr_checkout_checks.results[1].stat.isreg
      - verify_tpr_checkout is search(verify_tpr_version)
      - verify_tpr_pin.content | b64decode | trim == verify_tpr_version
      - verify_tpr_version_check.rc == 0
      - verify_tpr_version_check.stdout | trim == (verify_tpr_version | regex_replace('^v', ''))
      - verify_tpr_image_checks.results | selectattr('rc', 'equalto', 0) | list | length == verify_tpr_image_references | length
    fail_msg: >-
      the pinned tpr install is not the tag `verify` mirrors (spine
      AD-10/AD-11). Expected the checkout at {{ verify_tpr_checkout }}/ (path
      naming {{ verify_tpr_version }}), the pin record
      {{ verify_tpr_pin_file }} containing exactly {{ verify_tpr_version }},
      `tpr --version` reporting {{ verify_tpr_version | regex_replace('^v', '') }},
      and ALL THREE images ({{ verify_tpr_image_references | join(', ') }})
      present — base plus matugen/native at the pin (AD-7: the image tag IS the
      pin, never `latest`). The invocation-contract generation this consumer
      expects is {{ verify_tpr_contract_version }} (tpr v0.4.0 prints no
      contract token). Observed:
      rc={{ verify_tpr_version_check.rc | default('n/a', true) }},
      stdout={{ verify_tpr_version_check.stdout | default('', true) | trim }},
      pin={{ verify_tpr_pin.content | default('', true) | b64decode | trim }},
      missing_images={{ verify_tpr_image_checks.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}.
      A stale local-path install, a pin-file/checkout mismatch, or an image
      left at another tag means provisioning never re-pinned tpr; re-run the
      cli-tools playbook
  when: not ansible_check_mode

# BUG-007: image presence is not proof that the SELECTED producer can
# generate. When producer.json selects tpr, assert the selected engine image
# exists and run a REAL bounded tpr generate into a temp dir — never live
# state. Container mode ships tpr + tpr-native inside the image, so no host
# tpr-native helper is required. A csg selection skips the tpr smoke (its own
# parse/image gates above still run).
- name: Check the selected tpr engine image exists at the pinned reference
  ansible.builtin.command:
    argv:
      - "{{ container_runtime_engine }}"
      - image
      - inspect
      - "{{ verify_tpr_selected_image_reference }}"
  register: verify_tpr_selected_image_check
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - verify_expected_producer == "tpr"

- name: Create a temporary output directory for the tpr generate smoke
  ansible.builtin.tempfile:
    state: directory
    prefix: dotfiles-tpr-smoke-
  register: verify_tpr_smoke_dir
  when:
    - not ansible_check_mode
    - verify_expected_producer == "tpr"

- name: Generate a palette with the selected tpr producer (bounded, temp output)
  ansible.builtin.command:
    argv:
      - "timeout"
      - "{{ verify_tpr_smoke_timeout_seconds }}"
      - "{{ verify_cli_bin_dir | trim }}/tpr"
      - generate
      - "{{ install_dir | trim }}/wallpapers/default.png"
      - --config
      - "{{ install_dir | trim }}/config/theme-producer/settings.toml"
      - --engine
      - "{{ verify_expected_tpr_engine }}"
      - --runtime
      - container
      - --container-engine
      - "{{ container_runtime_engine }}"
      - --templates-dir
      - "{{ install_dir | trim }}/config/theme-producer/templates"
      - --output-dir
      - "{{ verify_tpr_smoke_dir.path }}"
      - --format
      - yaml
      - --format
      - conf
      - --format
      - gtk.css
      - --format
      - adw.css
      - --format
      - sequences
      - --format
      - rasi
      - --format
      - kitty
      - --format
      - btop.theme
  register: verify_tpr_smoke
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ verify_cli_bin_dir }}:{{ ansible_facts.env.PATH }}"
  when:
    - not ansible_check_mode
    - verify_expected_producer == "tpr"

- name: Check the tpr smoke produced the palette artifacts
  ansible.builtin.stat:
    path: "{{ verify_tpr_smoke_dir.path }}/{{ item }}"
  loop: "{{ verify_tpr_smoke_artifacts }}"
  register: verify_tpr_smoke_artifact_checks
  when:
    - not ansible_check_mode
    - verify_expected_producer == "tpr"

- name: Assert the selected tpr producer can generate a palette
  ansible.builtin.assert:
    that:
      - verify_tpr_selected_image_check.rc | default(1) == 0
      - verify_tpr_smoke.rc | default(1) == 0
      - verify_tpr_smoke_artifact_checks.results | selectattr('stat.isreg') | list | length == verify_tpr_smoke_artifacts | length
    fail_msg: >-
      the selected producer is tpr/{{ verify_expected_tpr_engine }} but it
      cannot generate (BUG-007). Expected the engine image
      {{ verify_tpr_selected_image_reference }} present and a bounded `tpr
      generate` (container runtime, temp output) to write all
      {{ verify_tpr_smoke_artifacts | join(', ') }}. Observed:
      image_rc={{ verify_tpr_selected_image_check.rc | default('n/a', true) }},
      generate_rc={{ verify_tpr_smoke.rc | default('n/a', true) }},
      stderr={{ verify_tpr_smoke.stderr | default('', true) | trim }},
      missing_artifacts={{ verify_tpr_smoke_artifact_checks.results
        | rejectattr('stat.isreg') | map(attribute='item') | list }}.
      Container mode requires no host tpr-native helper; rebuild the tpr
      images with the cli-tools playbook and check the container engine.
  when:
    - not ansible_check_mode
    - verify_expected_producer == "tpr"

- name: Remove the temporary tpr generate smoke output
  ansible.builtin.file:
    path: "{{ verify_tpr_smoke_dir.path }}"
    state: absent
  when:
    - not ansible_check_mode
    - verify_expected_producer == "tpr"

# The notifications overlay imports AstalNotifd at startup — a provisioned
# machine with the app dir deployed but the binding missing would ship a
# daemon that crashes on launch. Gate on the AUR package the packages role
# installs (capture-notifications implementation gate, spec scenario
# "Binding present after provision").
#
# Check-gate discipline (this task and the AstalWp probe below were the two
# `shell` probes the command-only invariant could not see — see
# openspec/changes/harden-verify-probes-and-manifest/). `when: not
# ansible_check_mode` mirrors every sibling probe, so the gate is declared
# rather than inherited from the library: ansible-core already short-circuits
# `shell` under --check ("Command would have run if not in check mode",
# skipped=True, rc=0 — see the file header), and `shell` is documented
# check_mode: support: PARTIAL, so relying on that short-circuit is not a
# declared invariant. The short-circuit FABRICATES rc: 0 — a probe that never
# ran reports success — which is harmless only because the consuming assert is
# already gated `when: not ansible_check_mode`: a conditionally-skipped
# register carries NO `results` key, so an ungated consumer would hard-fail
# with "object of type 'dict' has no attribute 'results'" and abort
# bootstrap.yaml --check. Reproduced both directions with a probe playbook.
- name: Check AstalNotifd binding package is installed
  ansible.builtin.shell: "pacman -Q {{ item }}"
  loop: "{{ verify_notifd_binding_packages }}"
  register: verify_notifd_binding_checks
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert AstalNotifd binding is installed
  ansible.builtin.assert:
    that:
      - verify_notifd_binding_checks.results | selectattr('rc', 'equalto', 0) | list | length == verify_notifd_binding_packages | length
    fail_msg: >-
      the AstalNotifd binding is not installed (expected
      {{ verify_notifd_binding_packages | join(', ') }} — the notification
      overlay's import). The packages role installs it via aur_packages;
      run the packages playbook first (direct-run prerequisite)
  when: not ansible_check_mode

# The settings panel imports AstalWp at startup for audio routing — a
# provisioned machine with the panel sources deployed but the binding missing
# would ship a window that crashes on open (settings-panel-provisioning gate,
# spec scenario "Namespaces importable"). Gate on the AUR package the packages
# role installs (mirror of the AstalNotifd check above). Bluetooth needs no
# Astal binding — the panel talks BlueZ D-Bus directly.
- name: Check AstalWp binding package is installed
  ansible.builtin.shell: "pacman -Q {{ item }}"
  loop: "{{ verify_astal_wp_binding_packages }}"
  register: verify_astal_wp_binding_checks
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert AstalWp binding is installed
  ansible.builtin.assert:
    that:
      - verify_astal_wp_binding_checks.results | selectattr('rc', 'equalto', 0) | list | length == verify_astal_wp_binding_packages | length
    fail_msg: >-
      the AstalWp binding is not installed (expected
      {{ verify_astal_wp_binding_packages | join(', ') }} — the settings panel's
      AstalWp import). The packages role installs it via aur_packages; run the
      packages playbook first (direct-run prerequisite)
  when: not ansible_check_mode

# dunst must be MASKED, not merely stopped: a stopped-but-enabled unit comes
# back at the next login and steals org.freedesktop.Notifications from the
# notifications overlay. gui_tools does the masking with `failed_when: false`
# (provisioning must not break on a machine without systemd --user), so this
# is the only place a regression becomes visible. Spec scenario: "dunst cannot
# steal the bus".
- name: Check masked systemd user units
  ansible.builtin.command:
    cmd: "systemctl --user is-enabled {{ item }}"
  loop: "{{ verify_masked_user_units }}"
  register: verify_masked_unit_checks
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert systemd user units are masked
  ansible.builtin.assert:
    that:
      - >-
        (verify_masked_unit_checks.results | selectattr('stdout', 'equalto', 'masked') | list | length)
        == verify_masked_user_units | length
    fail_msg: >-
      not masked: {{ verify_masked_user_units | join(', ') }} — a merely
      stopped dunst respawns at login and takes org.freedesktop.Notifications
      from the notifications overlay. The gui_tools role masks it
      (systemctl --user mask dunst.service); run the gui-tools playbook first
      (direct-run prerequisite)
  when: not ansible_check_mode

- name: Check running state of masked systemd user units
  ansible.builtin.command:
    cmd: "systemctl --user is-active {{ item }}"
  loop: "{{ verify_masked_user_units }}"
  register: verify_masked_unit_active
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert masked systemd user units are not running
  ansible.builtin.assert:
    that:
      - >-
        (verify_masked_unit_active.results | selectattr('stdout', 'equalto', 'active') | list | length)
        == 0
    fail_msg: >-
      still active: {{ verify_masked_user_units | join(', ') }} — it holds
      org.freedesktop.Notifications, so the notifications overlay cannot
      serve. Run the gui-tools playbook (or `systemctl --user disable --now
      dunst.service` followed by `systemctl --user mask dunst.service`)
  when: not ansible_check_mode

# The always-on AGS instances (the bar and the notification overlay) must be on
# the user's AGS bus after provisioning. gui_tools quits EVERY managed instance
# to force AGS to re-bundle the freshly placed sources, then restarts the
# always-on subset (start-if-down, detached); both halves are
# `failed_when: false` (provisioning must not break on a machine without a live
# AGS session), so this gate is the only place a regression becomes visible. A
# missing bar is a hidden status bar; a missing overlay means nothing owns
# org.freedesktop.Notifications (dunst is masked) and every notification is
# silently dropped. `ags list` prints one live instance name per line. Mirror
# of the dunst-mask gate shape (command registers rc, assert decides, both
# check-gated).
#
# Session-aware (like the gloview live-load assert): the bar and the overlay
# are Hyprland-session apps launched at login by autostart.lua. A machine
# provisioned from another session (or a TTY) has no Hyprland IPC yet, so
# absence there is EXPECTED, not a regression — the assert passes vacuously
# and a warning names the reason instead of failing the whole provision.
#
# Check-gate discipline (this task was the role's only ungated command task):
# `when: not ansible_check_mode` mirrors every sibling probe, so the gate is
# declared rather than inherited from the library. ansible-core already
# short-circuits command under --check ("Command would have run if not in
# check mode", skipped=True, rc=0 — see the file header), so before this gate
# the probe reported rc=0 — "Hyprland IPC is reachable" — for a command that
# never ran. That fabricated rc=0 is exactly why the warn half below must be
# gated too: a conditionally-skipped register carries no `rc` key at all, so
# `verify_hyprland_check.rc` would hard-fail the `when` with
# "object of type 'dict' has no attribute 'rc'" and abort bootstrap.yaml
# --check. `not ansible_check_mode and ...` short-circuits first, keeping the
# dereference reachable only where the probe actually ran.
- name: Check whether Hyprland IPC is reachable
  ansible.builtin.command:
    argv:
      - hyprctl
      - version
  register: verify_hyprland_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Warn when the AGS gate is skipped without Hyprland
  ansible.builtin.debug:
    msg: >-
      no Hyprland IPC in this session — the bar and notifications overlay
      start at first Hyprland login via autostart.lua; the always-on AGS gate
      below is skipped meanwhile.
  when: not ansible_check_mode and verify_hyprland_check.rc != 0

- name: List running AGS instances
  ansible.builtin.command:
    cmd: ags list
  register: verify_ags_list
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert always-on AGS instances are running
  ansible.builtin.assert:
    that:
      - >-
        verify_hyprland_check.rc != 0 or
        ((verify_ags_always_on_instances
         | difference(verify_ags_list.stdout_lines | default([]) | map('trim') | list)
         | length) == 0)
    fail_msg: >-
      not running: {{ verify_ags_always_on_instances | join(', ') }} — a
      provision run must leave the session's always-on AGS instances up. The
      gui_tools role quits every instance to re-bundle its sources, then
      restarts this subset (start-if-down, detached); run the gui-tools
      playbook. Without the notifications overlay nothing owns
      org.freedesktop.Notifications (dunst is masked on purpose) and every
      notification is dropped silently
  when: not ansible_check_mode

# "Show in folder" opens a DIRECTORY through xdg-open, so the desktop default
# for inode/directory decides what appears. gui_tools pins thunar; without a
# gate a regression would only show up as the wrong app opening at click time.
- name: Check the directory handler default
  ansible.builtin.command:
    cmd: "xdg-mime query default inode/directory"
  register: verify_directory_handler_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert the directory handler default
  ansible.builtin.assert:
    that:
      - verify_directory_handler_check.stdout | trim == verify_directory_handler
    fail_msg: >-
      the inode/directory handler is
      '{{ verify_directory_handler_check.stdout | trim }}', expected
      '{{ verify_directory_handler }}' — the capture tool's "Show in folder"
      would open the wrong application. The gui_tools role sets it via
      `xdg-mime default`; run the gui-tools playbook first (direct-run
      prerequisite)
  when: not ansible_check_mode

- name: Check desktop helper scripts exist (Fn-key binds)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ verify_bin_scripts }}"
  register: verify_bin_script_checks

- name: Assert desktop helper scripts exist and are executable
  ansible.builtin.assert:
    that:
      - verify_bin_script_checks.results | selectattr('stat.exists') | list | length == verify_bin_scripts | length
      - verify_bin_script_checks.results | selectattr('stat.executable') | list | length == verify_bin_scripts | length
    fail_msg: >-
      keybind script/launcher(s) missing or not executable (expected
      {{ verify_bin_scripts | join(', ') }}).
      {{ (verify_bin_script_checks.results | rejectattr('stat.exists') | map(attribute='item') | list)
         + (verify_bin_script_checks.results | selectattr('stat.exists') | rejectattr('stat.executable') | map(attribute='item') | list) }}
      — six of these are rendered by the cli_tools role and `toggle-touchpad` is
      installed 0755 by compositor_configs from the pinned desktop corpus (spine
      AD-10 layer 3). Run the cli-tools and compositor-configs playbooks first.
      Without them the corresponding Hyprland keybind silently does nothing.
  when: not ansible_check_mode

# Desktop entries (spine AD-10 layer 3). The compositor_configs role deploys them
# from the pinned `desktop/` corpus; verify re-asserts the DEPLOYED set, then
# reads each deployed file's own `Exec` line and resolves its argv[0] against
# PATH. Reading the deployed artifact — not a copy of the corpus — is the point:
# a stale or hand-edited entry on the host must fail HERE, and a corpus-only
# assertion would stay green while the menu entry is dead.
- name: Check deployed desktop entries exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ verify_desktop_entry_files }}"
  register: verify_desktop_entry_checks

- name: Assert the deployed desktop entries are present
  ansible.builtin.assert:
    that: verify_desktop_entry_checks.results | selectattr('stat.isreg') | list | length == verify_desktop_entry_files | length
    fail_msg: >-
      deployed desktop entry file(s) missing under
      {{ verify_xdg_data_home | trim }}/applications (expected
      {{ verify_desktop_entry_files | map('basename') | list }}). compositor_configs
      deploys them from the pinned desktop corpus; a missing entry means the
      playbook did not run — or layer 2 SKIPPED the entry because an optional
      binary is absent (the provision log names it).
  when: not ansible_check_mode

- name: Resolve every deployed desktop entry's Exec binary (layer 3)
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
        # argv[0] of the deployed Exec line. Layer 1 tokenizes the corpus copy
        # properly; the deployed file is byte-identical, and the corpus gate
        # refuses a quoted/odd argv[0] shape, so a plain first-token split is the
        # right check here — and an unparsable line fails LOUDLY below.
        exec_line=$(grep -m1 '^Exec=' "$1") || { echo "no Exec line"; exit 1; }
        bin=${exec_line#Exec=}
        bin=${bin%% *}
        if [ -z "$bin" ]; then echo "empty Exec"; exit 1; fi
        if [ "${bin#/}" != "$bin" ]; then
          test -x "$bin" || { echo "missing $bin"; exit 1; }
          echo "$bin"
        else
          command -v "$bin" || { echo "missing $bin"; exit 1; }
        fi
      - sh
      - "{{ item }}"
  loop: "{{ verify_desktop_entry_files }}"
  register: verify_desktop_exec_checks
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert every deployed desktop entry's Exec binary resolves
  ansible.builtin.assert:
    that: verify_desktop_exec_checks.results | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      a deployed desktop entry launches a binary that does not resolve:
      {{ verify_desktop_exec_checks.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='item') | list }}
      — the probe reported
      {{ verify_desktop_exec_checks.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='stdout') | list }} (spine AD-10 layer 3). rofi's drun
      mode would list the entry and the click would do nothing. Install the
      package (packages role) or reprovision the desktop corpus.
  when: not ansible_check_mode

- name: Check install-dir subtree exists
  ansible.builtin.stat:
    path: "{{ install_dir | trim }}/{{ item }}"
  loop: "{{ verify_install_spine_dirs + verify_install_spine_files }}"
  register: verify_spine_checks

- name: Assert install-dir subtree exists with correct types
  ansible.builtin.assert:
    that:
      - verify_spine_checks.results | selectattr('stat.isdir') | list | length == verify_install_spine_dirs | length
      - verify_spine_checks.results | selectattr('stat.isreg') | list | length == verify_install_spine_files | length
    fail_msg: >-
      not every install-spine path exists with the right inode type under
      {{ install_dir | trim }} (expected the spine DIRS + weg-effects.yaml
      as a regular FILE — done-criterion 1). The filesystem role (2.5) creates
      the dirs and the assets role (2.6) emits weg-effects.yaml; run the
      filesystem and assets playbooks first
  when: not ansible_check_mode

- name: Find files in each derivation-input template dir
  ansible.builtin.find:
    paths: "{{ install_dir | trim }}/{{ item }}"
    file_type: file
    recurse: true
  loop: "{{ verify_derivation_template_dirs }}"
  register: verify_derivation_template_files

- name: Assert derivation-input template dirs are non-empty (R-3 / AD-43)
  ansible.builtin.assert:
    that:
      - (verify_derivation_template_files.results | map(attribute='files') | map('length') | min) > 0
    fail_msg: >-
      a derivation-input template dir in the spine is empty under
      {{ install_dir | trim }} (expected {{ verify_derivation_template_dirs | join(', ') }}).
      An empty templates dir silently derives empty output — the assets role (2.6)
      deploys their content; re-run the assets playbook.
  when: not ansible_check_mode

- name: Check required CSG color-format templates exist in the spine
  ansible.builtin.stat:
    path: "{{ install_dir | trim }}/config/color-scheme-generator/templates/{{ item }}"
  loop: "{{ verify_csg_template_files }}"
  register: verify_csg_template_checks

- name: Assert every CSG color-format template is deployed
  ansible.builtin.assert:
    that:
      - verify_csg_template_checks.results | selectattr('stat.isreg') | list | length == verify_csg_template_files | length
    fail_msg: >-
      a CSG color-format template is missing under
      {{ install_dir | trim }}/config/color-scheme-generator/templates/
      (expected {{ verify_csg_template_files | join(', ') }}). The assets role
      (2.6) mirrors the CSG defaults; csg silently OMITS a format whose
      template is missing, so the runtime fails a palette entry with "csg did
      not write expected artifact" (a missing colors.kitty.j2 leaves
      current/colors.kitty dangling and kitty never re-themes). Re-run the
      assets playbook.
  when: not ansible_check_mode

- name: Check assets deployed
  ansible.builtin.stat:
    path: "{{ install_dir | trim }}/{{ item }}"
  loop: "{{ verify_asset_dirs + verify_asset_files }}"
  register: verify_asset_checks

- name: Assert assets deployed with correct types
  ansible.builtin.assert:
    that:
      - verify_asset_checks.results | selectattr('stat.isdir') | list | length == verify_asset_dirs | length
      - verify_asset_checks.results | selectattr('stat.isreg') | list | length == verify_asset_files | length
    fail_msg: >-
      not every asset outcome is present with the right inode type under
      {{ install_dir | trim }} (expected icon-templates/, icon-mappings/,
      csg-templates/ as DIRS and wallpapers/default.png + weg-effects.yaml as
      regular FILES — done-criterion 4). The assets role (Story 2.6) deploys
      them; run the assets playbook first
  when: not ansible_check_mode

# S1 (spine AD-6/AD-7): the corpus is a pinned checkout, so verify asserts the
# pin FILE and the five class dirs the assets role materialized. S5 strengthens
# it: the pin file's CONTENT must equal the manifest tag (a half bump can leave
# a stale `pinned` beside a new <tag>/ dir), and every DEPLOYED class contract's
# `schema_major` must be inside the same support window the fetch enforced.
- name: Check the pinned assets checkout is present
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ [verify_assets_pinned_file, verify_assets_tag_dir] + verify_assets_class_dirs }}"
  register: verify_assets_checks

- name: Assert the pinned assets pin and class dirs are present
  ansible.builtin.assert:
    that:
      - verify_assets_checks.results | selectattr('stat.isreg') | list | length == 1
      - verify_assets_checks.results | selectattr('stat.isdir') | list | length == (verify_assets_class_dirs | length) + 1
    fail_msg: >-
      the pinned assets checkout is incomplete under {{ verify_assets_dir }}
      (expected the `pinned` file and the five class dirs under
      {{ verify_assets_tag_dir }}). The assets role fetches repo@tag before
      copying; re-run the assets playbook and check the pin.
  when: not ansible_check_mode

# S5 (AD-12): presence of `assets/pinned` proves a file exists, not which tag it
# records. A pre-bump tag left beside the new <tag>/ dir is exactly the half
# state a manual pin bump produces, and every downstream reader would believe
# the wrong corpus is live.
- name: Read the deployed assets pin file
  ansible.builtin.slurp:
    src: "{{ verify_assets_pinned_file }}"
  register: verify_assets_pin_raw
  when: not ansible_check_mode

- name: Assert the deployed assets pin equals the manifest tag
  ansible.builtin.assert:
    that: >-
      verify_assets_pin_raw.content | b64decode | trim
      == verify_assets_pinned_tag
    fail_msg: >-
      {{ verify_assets_pinned_file }} records
      '{{ verify_assets_pin_raw.content | b64decode | trim }}', but this
      consumer's pin is {{ verify_assets_pinned_tag }} (the manifest
      `assets.tag`, mirrored by the assets role). A stale pin file means the
      deployed corpus is not the pinned one; re-run the assets playbook so it
      records the tag beside the checkout.
  when: not ansible_check_mode

# S5 (AD-12): re-read the DEPLOYED contracts and assert the fetch-time window
# still holds. The fetch check proves the clone was consumable; this one proves
# what is on the host now is (a hand-edited checkout, a half-fetched tag, or a
# pin bump that added a newer-schema tree beside an old `pinned` file is caught
# here). Read-only + gated like every other verify probe, so --check stays dry.
- name: Find the deployed template schema contracts
  ansible.builtin.find:
    paths: "{{ verify_assets_tag_dir }}/templates"
    patterns: "*.vars.schema.json"
    recurse: true
    # HIDDEN is true on purpose: the zsh contract is `.zshrc.vars.schema.json`
    # (hidden), so the default `hidden: false` would skip one schema silently.
    hidden: true
    file_type: file
  register: verify_assets_template_schema_files
  when: not ansible_check_mode

- name: Read the deployed icons schema contract
  ansible.builtin.slurp:
    src: "{{ verify_assets_tag_dir }}/icons/schema.json"
  register: verify_assets_icons_schema
  when: not ansible_check_mode

- name: Read the deployed desktop schema contract
  ansible.builtin.slurp:
    src: "{{ verify_assets_tag_dir }}/desktop/desktop.yaml"
  register: verify_assets_desktop_schema
  when: not ansible_check_mode

- name: Read every deployed template schema contract
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ verify_assets_template_schema_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: verify_assets_template_schemas
  when: not ansible_check_mode

- name: Assert the deployed icons schema_major is in the consumer support window
  ansible.builtin.assert:
    that: >-
      (verify_assets_icons_schema.content | b64decode | from_json).schema_major
      == verify_assets_schema_support.icons
    fail_msg: >-
      {{ verify_assets_icons_schema.source }} declares schema_major
      {{ (verify_assets_icons_schema.content | b64decode | from_json).schema_major }},
      but this consumer supports icons schema_major
      {{ verify_assets_schema_support.icons }} (assets {{ verify_assets_pinned_tag }}).
      The deployed corpus is not the one the fetch accepted — re-run the assets
      playbook so the pinned checkout is re-fetched, and check for a hand-edited
      or partial tree under {{ verify_assets_tag_dir }}
  when: not ansible_check_mode

- name: Assert the deployed desktop schema_major is in the consumer support window
  ansible.builtin.assert:
    that: >-
      (verify_assets_desktop_schema.content | b64decode | from_yaml).schema_major
      == verify_assets_schema_support.desktop
    fail_msg: >-
      {{ verify_assets_desktop_schema.source }} declares schema_major
      {{ (verify_assets_desktop_schema.content | b64decode | from_yaml).schema_major }},
      but this consumer supports desktop schema_major
      {{ verify_assets_schema_support.desktop }} (assets {{ verify_assets_pinned_tag }}).
      The deployed corpus is not the one the fetch accepted — re-run the assets
      playbook so the pinned checkout is re-fetched, and check for a hand-edited
      or partial tree under {{ verify_assets_tag_dir }}
  when: not ansible_check_mode

- name: Assert the deployed templates ship at least one schema contract
  ansible.builtin.assert:
    that: verify_assets_template_schema_files.matched | int > 0
    fail_msg: >-
      no contract was found under {{ verify_assets_tag_dir }}/templates
      (`<tag>/templates/**/*.vars.schema.json`) — every template has shipped a
      sibling vars schema since v0.1.0, so an empty result means the deployed
      checkout is partial or was pruned after the fetch. This consumer supports
      templates schema_major {{ verify_assets_schema_support.templates }}
  when: not ansible_check_mode

- name: Assert every deployed template schema_major is in the consumer support window
  ansible.builtin.assert:
    that: >-
      (item.content | b64decode | from_json).schema_major
      == verify_assets_schema_support.templates
    fail_msg: >-
      {{ item.source }} declares schema_major
      {{ (item.content | b64decode | from_json).schema_major }}, but this
      consumer supports templates schema_major
      {{ verify_assets_schema_support.templates }} (assets {{ verify_assets_pinned_tag }}).
      The deployed corpus is not the one the fetch accepted — re-run the assets
      playbook so the pinned checkout is re-fetched, and check for a hand-edited
      or partial tree under {{ verify_assets_tag_dir }}
  loop: "{{ verify_assets_template_schemas.results | default([]) }}"
  loop_control:
    label: "{{ item.source }}"
  when: not ansible_check_mode

# S2: the two config roles copy FROM the pinned `configs/` class, so the class
# dir alone is not enough — its six tool subdirectories must exist, or a wrong
# tag would silently deploy nothing (the class dir exists in every tag since
# v0.1.0). Same stat+assert shape as the class-dir pair above.
- name: Check the pinned configs corpus subdirectories are present
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ verify_assets_configs_dirs }}"
  register: verify_assets_configs_checks
  when: not ansible_check_mode

- name: Assert the pinned configs corpus subdirectories are directories
  ansible.builtin.assert:
    that: >-
      verify_assets_configs_checks.results | selectattr('stat.isdir') | list | length
      == verify_assets_configs_dirs | length
    fail_msg: >-
      the pinned assets configs corpus is incomplete under
      {{ verify_assets_tag_dir }}/configs (expected hypr, hyprpaper, nvim, rofi,
      starship and wlogout). compositor_configs and config_copies read this tree,
      so a missing subdir means the config roles deployed nothing; re-run the
      assets playbook and check the pin.
  when: not ansible_check_mode

# S4: the desktop class is corpus data too. The class dir exists in every tag
# since v0.1.0 (empty until v0.5.0), so its presence proves nothing; the two
# subdirs, the layer-2 contract and the helper script are what the role reads.
- name: Check the pinned desktop corpus pieces are present
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ verify_assets_desktop_paths }}"
  register: verify_assets_desktop_checks
  when: not ansible_check_mode

- name: Assert the pinned desktop corpus pieces are present
  ansible.builtin.assert:
    that: >-
      verify_assets_desktop_checks.results | selectattr('stat.exists') | list | length
      == verify_assets_desktop_paths | length
    fail_msg: >-
      the pinned assets desktop corpus is incomplete under
      {{ verify_assets_tag_dir }}/desktop (expected applications/, scripts/,
      scripts/toggle-touchpad and desktop.yaml). compositor_configs deploys the
      entries and the helper from this tree and resolves desktop.yaml before the
      copy, so a missing piece means the pin is wrong or the checkout is partial;
      re-run the assets playbook and check the pin.
  when: not ansible_check_mode

- name: Check runtime palette files exist under the runtime current dir
  ansible.builtin.stat:
    path: "{{ verify_state_current_dir }}/{{ item }}"
    follow: true
  loop: "{{ verify_palette_files }}"
  register: verify_palette_current_checks

- name: Assert runtime palette files are present (current-only)
  ansible.builtin.assert:
    that:
      - verify_palette_current_checks.results | length == verify_palette_files | length
      - verify_palette_current_checks.results | map(attribute='stat.isreg', default=false) | list | select | list | length == verify_palette_files | length
    fail_msg: >-
      not every runtime palette file is present as a regular file under
      {{ verify_state_current_dir }}/ (expected colors.conf, colors.yaml,
      colors.gtk.css, colors.adw.css, colors.sequences — Epic 4 current-only
      + gt-2-1 artifact growth; the default_palette role is
      deleted). A dangling runtime symlink (broken cache entry) also fails —
      the filesystem is authority. Run `dotfiles-runtime wallpaper set
      <install>/wallpapers/default.png` (or investigate the broken runtime
      cache entry). Orphaned <install>/generated/ trees from earlier
      provisions are ignored by every gate.
  when: not ansible_check_mode

- name: Check rendered icons exist under the runtime current dir
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ [verify_icons_dir] + verify_icons_samples }}"
  register: verify_icons_checks

- name: Assert rendered icons exist
  ansible.builtin.assert:
    that: >-
      verify_icons_checks.results | selectattr('stat.exists') | list | length
      == (verify_icons_samples | length) + 1
    fail_msg: >-
      the runtime icons output is missing: expected {{ verify_state_current_dir }}/icons/
      as a directory with each of {{ verify_icons_samples | join(', ') }} present
      (done-criterion — runtime icons, Epic 4 current-only, incl. the settings
      panel's new settings-panel-wifi.svg/volume-low.svg groups). Run
      `dotfiles-runtime wallpaper set` (needs assets + settings first; the
      icons provisioning role is deleted)
  when: not ansible_check_mode

- name: Check settings files exist
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  loop: "{{ verify_settings_files }}"
  register: verify_settings_file_checks

- name: Assert settings files exist
  ansible.builtin.assert:
    that: verify_settings_file_checks.results | selectattr('stat.isreg') | list | length == verify_settings_files | length
    fail_msg: >-
      not every rendered settings file exists under {{ verify_xdg_config_home }}
      (expected color-scheme-generator/weg/itr settings.toml — done-criterion 5
      part 1). The settings role (Story 2.11) renders them; run the settings
      playbook first
  when: not ansible_check_mode

# Criterion 5 part 2 — the parse ≠ works gate (review finding 2026-08-13):
# verify READS each rendered settings.toml and asserts every spine path it
# REFERENCES resolves. A static list of expected targets would go green when a
# settings file is mis-rendered to point at a wrong-but-existing (or wrong-and-
# missing) directory; the extraction below pulls the ACTUAL paths from the
# rendered files. tomllib is stdlib (python >= 3.12, the project floor).
# All three extraction commands must succeed (rc == 0): a missing/unparseable
# file or a renamed spine key fails loudly instead of silently dropping paths.

- name: Extract spine paths referenced by rendered settings
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('python3') }}"
      - -c
      - |
        import sys, tomllib

        def dig(node, dotted):
            for part in dotted.split("."):
                node = node[part]
            return node

        with open(sys.argv[1], "rb") as fh:
            data = tomllib.load(fh)
        for dotted in sys.argv[2].split(","):
            value = dig(data, dotted.strip())
            if isinstance(value, str):
                print(value)
      - "{{ item.dest }}"
      - "{{ verify_settings_spine_keys[item.name] | join(',') }}"
  loop: "{{ verify_settings_files }}"
  register: verify_settings_extracted
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Collect spine paths referenced by rendered settings
  ansible.builtin.set_fact:
    verify_settings_referenced_targets: >-
      {{ verify_settings_extracted.results
         | map(attribute='stdout_lines') | flatten | unique }}
  when: not ansible_check_mode

- name: Check settings-referenced spine paths resolve
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ verify_settings_referenced_targets }}"
  register: verify_settings_target_checks
  when: not ansible_check_mode

- name: Assert settings-referenced spine paths resolve
  ansible.builtin.assert:
    that:
      - verify_settings_extracted.results | selectattr('rc', 'equalto', 0) | list | length == verify_settings_files | length
      - verify_settings_referenced_targets | length > 0
      - verify_settings_target_checks.results | selectattr('stat.exists') | list | length == verify_settings_referenced_targets | length
    fail_msg: >-
      a rendered settings file is missing/unparseable, or references a spine
      path that does NOT resolve (done-criterion 5 part 2 — parse ≠ works:
      verify reads each rendered settings.toml and asserts every spine path it
      references exists). Expected the spine/state targets the settings
      templates render (icon-templates, icon-mappings, current/colors.yaml,
      XDG cache temp dir) — created by the filesystem (2.5) and assets (2.6)
      roles and the runtime seed (Epic 4)
  when: not ansible_check_mode

# Settings parse gate (AC 3, done-criterion 5): the three CLI gates over the
# rendered settings files. NOTE the deferred-work finding (Story 2.11 review):
# csg's `info` swallows ConfigResolutionError and exits 0 even on a
# parse-broken file (info_cmd.py:43-44) — the csg gate below is therefore a
# DOCUMENTED WEAK gate; the authoritative CSG parse proof is the spine-target
# resolution assert above + Story 3.3's settings-parity. The WEG half can
# actually fail and stays a real gate. The ITR list gate pins icons.yaml
# (SPEC.md#51 — NOT defaults.yaml). All three command tasks AND their assert
# are gated `when: not ansible_check_mode` (command tasks are skipped under
# --check in ansible-core 2.20.3; the assert would otherwise fail a
# bootstrap.yaml --check on a partially-provisioned host).

- name: Gate csg settings parse
  ansible.builtin.command:
    argv:
      - csg
      - info
      - --config
      - "{{ verify_xdg_config_home }}/color-scheme-generator/settings.toml"
  environment:
    PATH: "{{ verify_cli_bin_dir }}:{{ ansible_facts.env.PATH }}"
  register: verify_csg_gate
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Gate weg settings parse
  ansible.builtin.command:
    argv:
      - weg
      - info
      - --config
      - "{{ verify_xdg_config_home }}/weg/settings.toml"
  environment:
    WALLPAPER_EFFECTS_CONFIG_FILE_PATH: "{{ verify_weg_effects_path }}"
    PATH: "{{ verify_cli_bin_dir }}:{{ ansible_facts.env.PATH }}"
  register: verify_weg_gate
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Gate itr list against icons.yaml
  ansible.builtin.command:
    argv:
      - itr
      - list
      - "{{ verify_itr_list_target }}"
      - --config
      - "{{ verify_xdg_config_home }}/itr/settings.toml"
  environment:
    PATH: "{{ verify_cli_bin_dir }}:{{ ansible_facts.env.PATH }}"
  register: verify_itr_gate
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert settings parse gates exited cleanly
  ansible.builtin.assert:
    that:
      - verify_csg_gate.rc == 0
      - verify_weg_gate.rc == 0
      - verify_itr_gate.rc == 0
    fail_msg: >-
      one of the rendered settings parse gates failed (csg info / weg info /
      itr list icons.yaml) — done-criterion 5. Inspect the registered
      verify_csg_gate/verify_weg_gate/verify_itr_gate results; note the csg
      half is a documented weak gate (see the comment block above)
  when: not ansible_check_mode

- name: Check compositor configs and skeletons
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop: >-
    {{ verify_compositor_config_dirs
       + (verify_compositor_skeleton_files) }}
  register: verify_compositor_checks

- name: Assert compositor configs and skeletons are present with correct types
  ansible.builtin.assert:
    that:
      - verify_compositor_checks.results[:verify_compositor_config_dirs | length] | selectattr('stat.isdir') | list | length == verify_compositor_config_dirs | length
      - >-
        verify_compositor_checks.results[verify_compositor_config_dirs | length:]
        | map(attribute='stat') | selectattr('isreg') | list | length
        == (verify_compositor_skeleton_files) | length
    fail_msg: >-
      not every compositor config dir or skeleton is present with the
      right inode type under {{ verify_xdg_config_home }} (done-criterion 7).
      The filesystem (2.5) and compositor_configs (2.9) roles place them;
      run those playbooks first
  when: not ansible_check_mode

# The AGS platform is ONE versioned unit (spine AD-17/AD-23), installed by the
# ags_platform role. Every app imports the bare specifier `ags-platform`; if the
# unit is missing, `ags bundle` cannot resolve it and no app starts. The shared
# <install>/apps/node_modules/ags-platform shortcut is created and asserted by
# the standalone mirror (ags_apps_units). This is the honest coverage the
# deploy-coverage gate's manifest assertion cannot provide (it reads the repo,
# not the host).
- name: Check the ags-platform unit files and pin
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ [verify_ags_platform_unit_dir, verify_ags_platform_pin_file] + verify_ags_platform_unit_files }}"
  register: verify_ags_platform_unit_checks


- name: Assert the ags-platform unit is installed
  ansible.builtin.assert:
    that:
      - verify_ags_platform_unit_checks.results[0].stat.isdir
      - verify_ags_platform_unit_checks.results[1].stat.isreg
      - >-
        verify_ags_platform_unit_checks.results[2:]
        | map(attribute='stat') | selectattr('isreg') | list | length
        == verify_ags_platform_unit_files | length
    fail_msg: >-
      the ags-platform unit is missing under {{ install_dir | trim }} (spine
      AD-17/AD-23). Expected the pinned unit at
      {{ verify_ags_platform_unit_dir }}/ (package.json / index.ts / ports/ /
      adapters/) and the pin file at {{ verify_ags_platform_pin_file }}. Without
      it the app tags' bare-specifier `ags-platform` import cannot resolve and
      no AGS app starts. The ags_platform role installs it; run the ags-platform
      playbook first
  when: not ansible_check_mode

# ── Standalone ownership mirror (the final topology) ─────────────────────────
# The installer and verifier read the SAME single app list. For every app,
# verify the immutable unit, shared platform shortcut, spine/XDG/bin/launcher
# surfaces, bar palette pointer, single-produced icons.json, assets-owned
# autostart identity and the shared launch lock. No task writes anything.
- name: Verify each standalone app's ownership surfaces
  ansible.builtin.include_tasks: _verify_standalone.yml
  loop: "{{ verify_ags_standalone_apps | default([]) }}"
  loop_control:
    loop_var: app
    label: "{{ app.app }}"
  when:
    - not ansible_check_mode
    - verify_ags_standalone_apps | default([]) | length > 0

# verify_gui_tools_app_files is EMPTY since slice 8 (the last per-file app moved
# into the ags-apps unit), so this pair is a no-op on a stock install. It stays
# so a future per-file app is gated the moment it is appended to the list.
- name: Check GUI tool app files
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop: "{{ verify_gui_tools_app_files }}"
  register: verify_gui_tools_checks

- name: Assert GUI tool app files are present as regular files
  ansible.builtin.assert:
    that:
      - verify_gui_tools_checks.results | map(attribute='stat') | selectattr('isreg') | list | length == verify_gui_tools_app_files | length
    fail_msg: >-
      not every standalone GUI tool app file is present under
      {{ install_dir | trim }}/config/ (done-criterion 7, gui_tools role).
      The gui_tools role places them; run that playbook first
  when: not ansible_check_mode

- name: Check R2 consumer symlinks resolve to current/
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ verify_consumer_symlinks }}"
  register: verify_consumer_symlink_checks

- name: Assert R2 consumer symlinks point at current/
  ansible.builtin.assert:
    that:
      - verify_consumer_symlink_checks.results | selectattr('stat.islnk') | list | length == verify_consumer_symlinks | length
      - verify_consumer_symlink_checks.results | map(attribute='stat.lnk_target', default='') | select('search', 'dotfiles/current') | list | length == verify_consumer_symlinks | length
    fail_msg: >-
      not every R2 consumer path is a symlink into the runtime current dir
      (done-criterion 7, Epic 4 — the AGS colors.css must resolve to
      {{ verify_state_current_dir }}/colors.gtk.css). A stale provisioning
      COPY fails this gate by design. Run the runtime seed (the runtime
      seeder owns these links, rt-4-2)
  when: not ansible_check_mode

- name: Check XDG base dirs exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ verify_xdg_dirs }}"
  register: verify_xdg_dir_checks

- name: Assert XDG base dirs exist
  ansible.builtin.assert:
    that: verify_xdg_dir_checks.results | selectattr('stat.isdir') | list | length == verify_xdg_dirs | length
    fail_msg: >-
      not every XDG base dir exists as a directory (expected the config/state/
      cache homes — done-criterion 8). The filesystem role (Story 2.5) creates
      them; run the filesystem playbook first
  when: not ansible_check_mode

- name: Check managed config dirs are symlinks into the spine
  ansible.builtin.stat:
    path: "{{ verify_xdg_config_home }}/{{ item }}"
    follow: false
  loop: "{{ verify_managed_link_dirs }}"
  register: verify_managed_link_checks
  when: not ansible_check_mode

- name: Assert managed config dirs are symlinks with the exact spine target
  ansible.builtin.assert:
    that: >-
      verify_managed_link_checks.results
      | selectattr('stat.islnk') | list | length == verify_managed_link_dirs | length
    fail_msg: >-
      not every managed config dir under {{ verify_xdg_config_home }} is a
      symlink (expected {{ verify_managed_link_dirs | join(', ') }} —
      done-criterion 9, config-in-spine pattern). Each must point at
      <install>/config/<name>; the config-links role creates them. Run the
      config-links playbook first
  when: not ansible_check_mode

- name: Assert managed config symlinks point at the exact spine target
  ansible.builtin.assert:
    that: >-
      verify_managed_link_checks.results
      | rejectattr('stat.lnk_target', 'search', '^' + verify_managed_link_spine_prefix)
      | list | length == 0
    fail_msg: >-
      a managed config symlink under {{ verify_xdg_config_home }} points at a
      target OUTSIDE the spine — done-criterion 9, config-in-spine. Every link
      must target <install>/config/<name> ({{ verify_managed_link_spine_prefix }}/);
      a link to the repo, a moved location, or a wrong spine path fails. Re-run
      the config-links playbook
  when: not ansible_check_mode

- name: Check managed config symlinks resolve through the spine
  ansible.builtin.stat:
    path: "{{ verify_xdg_config_home }}/{{ item }}"
    follow: true
  loop: "{{ verify_managed_link_dirs }}"
  register: verify_managed_link_resolve_checks
  when: not ansible_check_mode

- name: Assert managed config symlinks resolve into the spine
  ansible.builtin.assert:
    that: >-
      verify_managed_link_resolve_checks.results
      | selectattr('stat.isdir') | list | length == verify_managed_link_dirs | length
    fail_msg: >-
      a managed config symlink under {{ verify_xdg_config_home }} is BROKEN or
      its spine target is not a directory — done-criterion 9 (config-in-spine).
      A broken link means the spine was wiped (unprovisioned). Re-run apply
  when: not ansible_check_mode

- name: Check config copies resolve through their symlinks
  ansible.builtin.stat:
    path: "{{ verify_xdg_config_home }}/{{ item }}"
    follow: true
  loop: "{{ verify_config_copies_targets }}"
  register: verify_config_copy_checks
  when: not ansible_check_mode

- name: Assert config copies resolve as directories through the symlinks
  ansible.builtin.assert:
    that: verify_config_copy_checks.results | selectattr('stat.isdir') | list | length == verify_config_copies_targets | length
    fail_msg: >-
      not every config-copy target under {{ verify_xdg_config_home }} resolves
      to a real directory (expected one per dotfiles/provisioning/config-copies.yaml:
      nvim, starship, wlogout — done-criterion 9). A symlink whose spine
      target is missing/wrong breaks runtime independence. The config_copies
      (Story 2.10) + config_links roles place them; run those playbooks first
  when: not ansible_check_mode

- name: Check config copy content is reachable through the symlinks
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop: "{{ verify_config_copy_content }}"
  register: verify_config_copy_content_checks
  when: not ansible_check_mode

- name: Assert config copy content files are present through the symlinks
  ansible.builtin.assert:
    that: verify_config_copy_content_checks.results | selectattr('stat.isreg') | list | length == verify_config_copy_content | length
    fail_msg: >-
      not every config-copy content file resolves through its
      {{ verify_xdg_config_home }} symlink into the spine (done-criterion 9,
      layer 4 — content-through-link). The spine copy is missing or the link
      points at an empty/wrong dir. Re-run the config_copies + config_links
      playbooks
  when: not ansible_check_mode

# GTK skeleton files (gt-3-1, criterion 9 layer 4 for the gtk dirs): the
# palette-import skeleton gtk.css must be present THROUGH the
# ~/.config/gtk-{3,4}.0 symlinks. Mirror of the verify_config_copy_content
# stat+assert pair (follow: true — resolve through the link to isreg).
# settings.ini is deliberately NOT gated (user-machine state); the runtime
# colors.css pointers are deliberately NOT gated (runtime-owned, gt-2-2).
- name: Check gtk skeleton files are reachable through the symlinks
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop: "{{ verify_gtk_skeleton_files }}"
  register: verify_gtk_skeleton_checks
  when: not ansible_check_mode

- name: Assert gtk skeleton files are present through the symlinks
  ansible.builtin.assert:
    that: verify_gtk_skeleton_checks.results | selectattr('stat.isreg') | list | length == verify_gtk_skeleton_files | length
    fail_msg: >-
      not every gtk skeleton file resolves through its
      {{ verify_xdg_config_home }} symlink into the spine (done-criterion 9,
      layer 4, gt-3-1). Expected {{ verify_gtk_skeleton_files | join(', ') }};
      the spine gtk.css is missing or the link points at an empty/wrong dir.
      Re-run the config-links playbook
  when: not ansible_check_mode

# GTK palette wiring (gt-3-1): the grep gate over both skeleton files THROUGH
# the ~/.config/gtk-{3,4}.0 links (exercising the link, mirroring how the
# wlogout style.css gate reads through its link) asserts the exact
# `@import "colors.css";` line — a drifted import path fails. command tasks
# register rc (failed_when: false, changed_when: false) and are check-gated;
# the assert decides. Mirror of the wlogout gate shape.
- name: Gate gtk skeleton palette import wiring
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - '@import "colors\.css";'
      - "{{ item }}"
  loop: "{{ verify_gtk_skeleton_files }}"
  register: verify_gtk_import_checks
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert gtk skeleton files import the palette
  ansible.builtin.assert:
    that: verify_gtk_import_checks.results | selectattr('rc', 'equalto', 0) | list | length == verify_gtk_skeleton_files | length
    fail_msg: >-
      the gtk skeleton gtk.css does not import the palette colors (expected
      the exact line `@import "colors.css";` in the skeleton files
      {{ verify_gtk_skeleton_files | join(' and ') }} — gt-3-1, read through
      the spine symlinks). The config-links role ensures the import;
      re-run the config-links playbook
  when: not ansible_check_mode

- name: Check rendered zshrc wires starship and the color scheme
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - 'starship init|current/colors\.sequences'
      - "{{ verify_xdg_config_home }}/zsh/.zshrc"
  register: verify_zshrc_wiring
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert rendered zshrc wires starship and the color scheme
  ansible.builtin.assert:
    that: verify_zshrc_wiring.rc == 0
    fail_msg: >-
      the rendered .zshrc does not wire starship and the color scheme
      (expected both `starship init` and a cat of the state-root
      `current/colors.sequences` — done-criterion 12, shell wiring; gt-3-2
      tightened the grep to the runtime current pointer so a regression to
      the orphaned provisioning-era tree fails loud). The zsh_config role
      renders .zshrc.j2 → .zshrc; run the zsh-config playbook (needs
      packages + zsh_tools first)
  when: not ansible_check_mode

- name: Check zshenv shell-entry pointer sets ZDOTDIR
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - '^export ZDOTDIR='
      - "{{ ansible_facts.env.HOME }}/.zshenv"
  register: verify_zshenv_wiring
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert zshenv shell-entry pointer targets the managed zsh dir
  ansible.builtin.assert:
    that:
      - verify_zshenv_wiring.rc == 0
      - verify_zshenv_wiring.stdout is search(verify_xdg_config_home | trim ~ '/zsh')
    fail_msg: >-
      the shell-entry pointer does not set ZDOTDIR at the managed zsh dir
      (expected an `export ZDOTDIR=` line resolving under
      {{ verify_xdg_config_home }}/zsh — done-criterion 12, shell-entry seam;
      without it zsh reads the home dir, finds no zshrc, and shows the
      new-user prompt). The zsh_config role owns the pointer; run the
      zsh-config playbook
  when: not ansible_check_mode

- name: Check rendered zshrc sources the local overlay
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - '\.zshrc\.local'
      - "{{ verify_xdg_config_home }}/zsh/.zshrc"
  register: verify_zshrc_overlay
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert rendered zshrc sources the local overlay
  ansible.builtin.assert:
    that: verify_zshrc_overlay.rc == 0
    fail_msg: >-
      the rendered .zshrc does not source the local overlay (expected a
      `.zshrc.local` source line under {{ verify_xdg_config_home }}/zsh —
      done-criterion 12; external installers append there so re-provisioning
      never clobbers them). The zsh_config role renders the zshrc template;
      run the zsh-config playbook
  when: not ansible_check_mode

# S3: the template SOURCE moved to the pinned corpus, so the pre-S3 copy in the
# spine must be GONE. A stat + assert pair rather than a bare assert: the stat
# reports the residue's existence, and the message names the file and the prune
# task that owns its removal.
- name: Check the pre-S3 zsh template is absent from the spine
  ansible.builtin.stat:
    path: "{{ verify_zsh_legacy_template_path }}"
    follow: false
  register: verify_zsh_legacy_template_check
  when: not ansible_check_mode

- name: Assert the pre-S3 zsh template is absent from the spine
  ansible.builtin.assert:
    that: not verify_zsh_legacy_template_check.stat.exists
    fail_msg: >-
      {{ verify_zsh_legacy_template_path }} still exists — the .zshrc SOURCE
      moved to the pinned dotfiles-assets corpus (templates class, S3) and zsh
      reads the RENDERED .zshrc via ZDOTDIR, never a `.j2` in the spine. The
      zsh_config role prunes it; re-run the zsh-config playbook, or delete the
      file if a hand copy restored it.
  when: not ansible_check_mode

- name: Check rendered wlogout style.css imports the palette colors
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - "@import url|@color_1[0-5]"
      - "{{ verify_xdg_config_home }}/wlogout/style.css"
  register: verify_wlogout_wiring
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert rendered wlogout style.css imports the palette colors
  ansible.builtin.assert:
    that: verify_wlogout_wiring.rc == 0
    fail_msg: >-
      the rendered wlogout style.css does not import the palette colors
      (expected `@import url(...)` and an @color_1x usage — done-criterion 13,
      shell wiring). The wlogout_config role renders style.css.tpl → style.css;
      run the wlogout-config playbook (needs assets + default_palette first)
  when: not ansible_check_mode

# S3: the template SOURCE moved to the pinned corpus, so the pre-S3 copy in the
# spine must be GONE. A stat + assert pair rather than a bare assert: the stat
# reports the residue's existence, and the message names the file and the prune
# task that owns its removal.
- name: Check the pre-S3 wlogout template is absent from the spine
  ansible.builtin.stat:
    path: "{{ verify_wlogout_legacy_template_path }}"
    follow: false
  register: verify_wlogout_legacy_template_check
  when: not ansible_check_mode

- name: Assert the pre-S3 wlogout template is absent from the spine
  ansible.builtin.assert:
    that: not verify_wlogout_legacy_template_check.stat.exists
    fail_msg: >-
      {{ verify_wlogout_legacy_template_path }} still exists — the wlogout
      stylesheet SOURCE moved to the pinned dotfiles-assets corpus (templates/
      class, S3) and nothing renders a `.tpl` in the spine any more. The
      wlogout_config role prunes it; re-run the wlogout-config playbook, or delete
      the file if a hand copy restored it.
  when: not ansible_check_mode

- name: Check rendered kitty.conf includes the runtime palette
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - 'current/colors\.kitty'
      - "{{ verify_xdg_config_home }}/kitty/kitty.conf"
  register: verify_kitty_wiring
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert rendered kitty.conf includes the runtime palette
  ansible.builtin.assert:
    that: verify_kitty_wiring.rc == 0
    fail_msg: >-
      the rendered kitty.conf does not include the runtime palette (expected the
      colors.kitty artifact to be included from the runtime state current dir —
      kitty terminal config). The kitty_config role renders kitty.conf.j2 →
      kitty.conf; run the kitty-config playbook first
  when: not ansible_check_mode

# ── btop integration (provision-btop-config) ────────────────────────────────
# Three layers, in dependency order:
#   1. the rendered btop.conf exists AND pins color_theme/save_config_on_exit
#   2. the spine btop/themes/ dir exists (provisioning's, not the runtime's)
#   3. the generated theme is present and RESOLVES through the pointer
#      chain into a palette cache entry (follow: true — a dangling pointer is
#      exactly the failure btop would silently degrade to Default_theme on)
- name: Check rendered btop.conf exists
  ansible.builtin.stat:
    path: "{{ verify_btop_config_path }}"
    follow: true
  register: verify_btop_conf_stat

- name: Assert rendered btop.conf exists
  ansible.builtin.assert:
    that: verify_btop_conf_stat.stat.exists and verify_btop_conf_stat.stat.isreg
    fail_msg: >-
      the rendered btop.conf is missing or not a regular file at
      {{ verify_btop_config_path }}. The btop_config role renders
      templates/btop.conf.j2 → btop.conf; run the btop-config playbook first
  when: not ansible_check_mode

- name: Check btop.conf pins color_theme and save_config_on_exit
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - ^(color_theme|save_config_on_exit)\s*=
      - "{{ verify_btop_config_path }}"
  register: verify_btop_conf_grep
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

# btop-theme-deployment: the active theme is chosen from the host-owned
# spine setting, so verify must NOT pin one filename. It resolves the name btop.conf
# actually selected and asserts a matching .theme exists in the spine themes
# dir — which is exactly what btop requires (a wrong/absent name makes btop
# fall back to Default_theme SILENTLY, no error).
- name: Resolve the theme selected by btop.conf
  ansible.builtin.set_fact:
    verify_btop_selected_theme: >-
      {{ (verify_btop_conf_grep.stdout
          | regex_findall('color_theme\s*=\s*"([^"]+)"')
          | first)
         | default(verify_btop_default_theme, true) }}
  when: not ansible_check_mode

- name: Stat the theme selected by btop.conf in the spine themes dir
  ansible.builtin.stat:
    path: "{{ verify_btop_themes_dir }}/{{ verify_btop_selected_theme }}"
    follow: true
  register: verify_btop_selected_stat
  when: not ansible_check_mode

- name: Assert btop.conf selects a theme that exists in the spine
  ansible.builtin.assert:
    that:
      - verify_btop_selected_theme | length > 0
      - verify_btop_selected_stat.stat.exists | default(false)
      - verify_btop_selected_stat.stat.isreg | default(false)
    fail_msg: >-
      btop.conf selects "{{ verify_btop_selected_theme }}" but no such .theme
      file exists under {{ verify_btop_themes_dir }}. btop resolves
      `color_theme` ONLY against themes it discovered while scanning its theme
      dirs at startup (btop_theme.cpp:451-471) — a wrong or absent name falls
      back to the built-in Default_theme SILENTLY, with no error. Re-run the
      btop-config playbook (and check the spine active-theme setting).
  when: not ansible_check_mode

- name: Assert btop.conf disables save_config_on_exit
  ansible.builtin.assert:
    that: >-
      verify_btop_conf_grep.stdout is search(
        'save_config_on_exit\s*=\s*' ~ verify_btop_save_config_on_exit)
    fail_msg: >-
      the rendered btop.conf does not set
      save_config_on_exit = {{ verify_btop_save_config_on_exit }}. This setting
      is MANDATORY, not cosmetic: btop defaults it to TRUE
      (btop_config.cpp:379) and Config::write() truncates and rewrites the
      whole config on exit (:836-845). btop's own config home is a symlink
      into the git-tracked spine (config_links), so with the default every
      btop quit would overwrite the provisioning-owned btop.conf through that
      symlink and land the user's UI changes in version control. Re-run the
      btop-config playbook.
  when: not ansible_check_mode

- name: Check btop themes dir and the three generated themes
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop: "{{ [verify_btop_themes_dir] + verify_btop_theme_paths }}"
  register: verify_btop_theme_checks

- name: Assert btop themes dir exists and the generated theme is present
  ansible.builtin.assert:
    that:
      - verify_btop_theme_checks.results[0].stat.isdir | default(false)
      - verify_btop_theme_checks.results | length == (verify_btop_theme_files | length) + 1
      - >-
        verify_btop_theme_checks.results[1:] | map(attribute='stat')
        | selectattr('isreg') | list
        | length == verify_btop_theme_files | length
    fail_msg: >-
      the btop themes integration is incomplete under {{ verify_btop_spine_dir }}
      (expected the themes/ DIRECTORY plus
      {{ verify_btop_theme_files | join(', ') }} as regular files). Two
      independent causes: (a) the btop_config role did not create
      {{ verify_btop_themes_dir }} — the runtime's
      repoint_consumer_symlinks skips a pointer whose parent is missing and
      NEVER mkdirs into the spine, so the first swap would silently drop all
      the pointer; run the btop-config playbook. (b) the pointer exists but
      DANGLE (no palette cache entry behind them) — run
      `dotfiles-runtime wallpaper set <install>/wallpapers/default.png`. A
      dangling theme makes btop fall back to Default_theme with no error.
  when: not ansible_check_mode

- name: Stat shell-tools clone dirs (zsh_tools)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ shell.oh_my_zsh_dir }}"
    - "{{ shell.pyenv_dir }}"
    - "{{ shell.nvm_dir }}"
  register: verify_shell_tool_dirs
  when: not ansible_check_mode

- name: Assert shell-tools clones exist (zsh_tools)
  ansible.builtin.assert:
    that:
      - verify_shell_tool_dirs.results | length == 3
      - verify_shell_tool_dirs.results[0].stat.exists
      - verify_shell_tool_dirs.results[1].stat.exists
      - verify_shell_tool_dirs.results[2].stat.exists
      - verify_shell_tool_dirs.results[0].stat.isdir
      - verify_shell_tool_dirs.results[1].stat.isdir
      - verify_shell_tool_dirs.results[2].stat.isdir
    fail_msg: >-
      at least one shell-tool clone is missing (expected
      {{ shell.oh_my_zsh_dir }}, {{ shell.pyenv_dir }},
      {{ shell.nvm_dir }} — done-criterion 11). The zsh_tools role git-clones
      them presence-guarded; run the zsh-tools playbook (needs packages first)
  when: not ansible_check_mode
