# ags-platform role vars — install the AGS platform as ONE versioned unit.
#
# Spine AD-17 (distribution: one unit) and AD-23 (fresh host: provisioning
# installs the pinned framework unit). AD-20 sequenced the migration: the
# platform was extracted IN-PLACE in dotfiles-v3 first, then published; THIS
# role is the consumption step that replaces per-file enumeration with a single
# versioned install.
#
# WHY ONE UNIT + ONE APP-INSTALL ANCESTOR. AGS (v3.1.0) embeds esbuild, which
# resolves a bare specifier (`import { x } from "ags-platform"`) from
# `node_modules/`; `ags`/`gnim` are built-in aliases, a third-party package is
# not. This role installs the unit once; `ags_apps_units` creates the ONE
# shared `<install>/apps/node_modules/ags-platform` shortcut that every
# immutable app tag resolves through (AD-31/AD-37). esbuild realpaths the app
# link, so the shortcut resolves from the real app tree.
#
# The version is a DIRECTORY (`<install>/ags-platform/<version>/`) so a rollback
# points the shared shortcut at a sibling version dir (AD-23).

# ags_platform_repo_url: the PUBLIC published repo. Cloned over anonymous HTTPS
#   (no credentials) — unlike the private repos AD-23 fetches with `gh`.
ags_platform_repo_url: https://github.com/RandomGenericUsername/ags-platform.git

# ags_platform_version: THE PIN. The git tag to install, and the name of the
#   version directory under the install root. Bump this to move forward; point
#   the shortcut at an older sibling dir to roll back. Recorded on the host at
#   ags_platform_pin_file so the installed version is observable without
#   reading this file.
ags_platform_version: v0.3.0

# ags_platform_install_root: the shared ancestor the units live under
#   (<install>/ags-platform/). Trim lock: consumes the same validated
#   {{ install_dir | trim }} value the sibling roles use.
ags_platform_install_root: "{{ install_dir | trim }}/ags-platform"

# ags_platform_unit_dir: the installed unit for the pinned version. The repo
#   ROOT is the package (index.ts + package.json + ports/ + adapters/ +
#   icons.json), so the clone lands here directly.
ags_platform_unit_dir: "{{ ags_platform_install_root }}/{{ ags_platform_version }}"

# ags_platform_unit_marker: the file whose presence means "the unit is
#   installed". Used as the idempotency guard for the clone (the git module has
#   no `creates:`), mirroring the zsh_tools role's stat guard.
ags_platform_unit_marker: "{{ ags_platform_unit_dir }}/index.ts"

# ags_platform_pin_file: the recorded pin (<install>/ags-platform/pinned). A
#   one-line file naming the installed version; `verify` asserts it, and a human
#   reads it to know what is deployed.
ags_platform_pin_file: "{{ ags_platform_install_root }}/pinned"

# The shared `node_modules/ags-platform` resolver is NOT owned here. Apps are
# installed at <install>/apps/<installDir>/<tag>/, so the only correct ancestor
# is <install>/apps/node_modules — created by ags_apps_units (AD-31/AD-37).
