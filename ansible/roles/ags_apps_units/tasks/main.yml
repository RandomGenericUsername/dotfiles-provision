# ags_apps_units role tasks — the ONLY AGS app installer (AD-31/32/37).
#
# The final topology is all-standalone: every AGS app is its own immutable tag
# under <install>/apps/<installDir>/<tag>, resolving the ONE shared
# <install>/apps/node_modules/ags-platform shortcut. The retired `ags_apps`
# monorepo role/pin no longer exists and no other role creates an AGS app
# install, config, spine, XDG, bin, launcher or autostart surface. A composition
# entry that still says `owner: legacy` fails loud here instead of silently
# shipping an app with no owner.
#
# Order is the AD-32 epoch for each app:
#   quiesce (confirmed quit, no bus name) -> install immutable tag ->
#   repoint links -> start through the shared launch lock -> verify identity,
#   handler and every ownership surface. A failure runs the rollback block:
#   quiesce the new instance, restore the previous links and restart the old
#   instance when it was running.
#
# No task writes inside <install>/apps/<installDir>/<tag>/ after the clone:
# only the presence-guarded git clone and the one-time .git removal touch it.
# colors.css and icons.json are verified, never authored here.

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that:
      - install_dir is defined
      - install_dir is string
      - install_dir | trim | length > 0
    fail_msg: >-
      install_dir is undefined or empty — the ags_apps_units role requires the
      install_dir seam extra-var (the orchestrator resolves
      $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)

- name: Assert composition manifests seam is provided
  ansible.builtin.assert:
    that:
      - manifests_dir is defined
      - manifests_dir is string
      - manifests_dir | trim | length > 0
    fail_msg: >-
      manifests_dir is undefined or empty — the ags_apps_units role reads the
      composition's apps.yaml + program-tuple.yaml. The engine CLI resolves it
      from --manifests-dir; direct runs pass -e manifests_dir=...

- name: Read the composition app list and program tuple
  ansible.builtin.set_fact:
    ags_apps_units_apps_document: "{{ lookup('file', ags_apps_units_apps_file) | from_yaml }}"
    ags_apps_units_tuple: "{{ lookup('file', ags_apps_units_tuple_file) | from_yaml }}"

- name: Assert the app list has the contract shape
  ansible.builtin.assert:
    that:
      - ags_apps_units_apps_document is mapping
      - ags_apps_units_apps_document.keys() | list == ['apps']
      - ags_apps_units_apps_document.apps is sequence
      - ags_apps_units_apps_document.apps | length > 0
      - ags_apps_units_apps_document.apps | rejectattr('app', 'defined') | list | length == 0
      - ags_apps_units_apps_document.apps | rejectattr('installDir', 'defined') | list | length == 0
      - ags_apps_units_apps_document.apps | rejectattr('owner', 'defined') | list | length == 0
      - ags_apps_units_apps_document.apps | rejectattr('instance', 'defined') | list | length == 0
      - ags_apps_units_apps_document.apps | rejectattr('configDir', 'defined') | list | length == 0
      - ags_apps_units_apps_document.apps | rejectattr('configLink', 'defined') | list | length == 0
      - ags_apps_units_apps_document.apps | rejectattr('spineLink', 'defined') | list | length == 0
      - ags_apps_units_apps_document.apps | rejectattr('xdgLink', 'defined') | list | length == 0
      - ags_apps_units_apps_document.apps | rejectattr('launch', 'defined') | list | length == 0
      - ags_apps_units_apps_document.apps | rejectattr('cutoverId', 'defined') | list | length == 0
      - ags_apps_units_apps_document.apps | map(attribute='owner') | unique | list | difference(['standalone']) | length == 0
      - ags_apps_units_apps_document.apps | map(attribute='launch') | unique | list | difference(['always', 'on-demand']) | length == 0
      - ags_apps_units_apps_document.apps | rejectattr('repo', 'defined') | list | length == 0
      - ags_apps_units_apps_document.apps | rejectattr('tag', 'defined') | list | length == 0
      - >-
        ags_apps_units_apps_document.apps | map(attribute='app') | unique | list | length
        == ags_apps_units_apps_document.apps | length
      - >-
        ags_apps_units_apps_document.apps | map(attribute='installDir') | unique | list | length
        == ags_apps_units_apps_document.apps | length
      - >-
        ags_apps_units_apps_document.apps | map(attribute='instance') | unique | list | length
        == ags_apps_units_apps_document.apps | length
      - >-
        ags_apps_units_apps_document.apps | map(attribute='configDir') | unique | list | length
        == ags_apps_units_apps_document.apps | length
      - >-
        ags_apps_units_apps_document.apps | map(attribute='configLink') | unique | list | length
        == ags_apps_units_apps_document.apps | length
      - >-
        ags_apps_units_apps_document.apps | map(attribute='spineLink') | unique | list | length
        == ags_apps_units_apps_document.apps | length
      - >-
        ags_apps_units_apps_document.apps | map(attribute='xdgLink') | unique | list | length
        == ags_apps_units_apps_document.apps | length
      - >-
        ags_apps_units_apps_document.apps | selectattr('launcher', 'defined') | map(attribute='launcher') | unique | list | length
        == ags_apps_units_apps_document.apps | selectattr('launcher', 'defined') | list | length
      - >-
        ags_apps_units_apps_document.apps | selectattr('binLink', 'defined') | map(attribute='binLink') | unique | list | length
        == ags_apps_units_apps_document.apps | selectattr('binLink', 'defined') | list | length
      - >-
        ags_apps_units_apps_document.apps | selectattr('barPalettePointer', 'defined') | list | length == 1
      - >-
        ags_apps_units_apps_document.apps | selectattr('barPalettePointer', 'defined') | map(attribute='app') | list
        == ['bar']
    fail_msg: >-
      the composition app list at {{ ags_apps_units_apps_file }} violates the
      all-standalone install-list contract: every entry must be
      owner=standalone with repo/tag, the identity surfaces must be unique,
      launchers/bin links must not collide, and exactly the bar owns the
      palette pointer. `owner: legacy` is retired — the old `ags_apps` role no
      longer exists, so a legacy entry would have no installer (AD-32).

- name: Assert every app-list scalar is one lowercase path segment or a tag
  ansible.builtin.assert:
    that:
      - >-
        ags_apps_units_apps_document.apps | map(attribute='app')
        | select('match', '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$') | list | length
        == ags_apps_units_apps_document.apps | length
      - >-
        ags_apps_units_apps_document.apps | map(attribute='installDir')
        | select('match', '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$') | list | length
        == ags_apps_units_apps_document.apps | length
      - >-
        ags_apps_units_apps_document.apps | map(attribute='instance')
        | select('match', '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$') | list | length
        == ags_apps_units_apps_document.apps | length
      - >-
        ags_apps_units_apps_document.apps | map(attribute='configDir')
        | select('match', '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$') | list | length
        == ags_apps_units_apps_document.apps | length
      - >-
        ags_apps_units_apps_document.apps | map(attribute='configLink')
        | select('match', '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$') | list | length
        == ags_apps_units_apps_document.apps | length
      - >-
        ags_apps_units_apps_document.apps | map(attribute='spineLink')
        | select('match', '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$') | list | length
        == ags_apps_units_apps_document.apps | length
      - >-
        ags_apps_units_apps_document.apps | map(attribute='xdgLink')
        | select('match', '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$') | list | length
        == ags_apps_units_apps_document.apps | length
      - >-
        ags_apps_units_apps_document.apps | map(attribute='configLink') | list
        == ags_apps_units_apps_document.apps | map(attribute='configDir') | list
      - >-
        ags_apps_units_apps_document.apps | map(attribute='tag')
        | select('match', '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') | list | length
        == ags_apps_units_apps_document.apps | length
    fail_msg: >-
      every app-list identity field must be exactly one lowercase path
      segment, configLink must equal configDir, and every tag must be an
      immutable vX.Y.Z annotated tag.

- name: Assert the program tuple names exactly the three program tags
  ansible.builtin.assert:
    that:
      - ags_apps_units_tuple is mapping
      - ags_apps_units_tuple.keys() | sort == ['ags-platform', 'contracts', 'dotfiles-assets', 'schemaVersion']
      - ags_apps_units_tuple.schemaVersion == 1
      - ags_apps_units_tuple['ags-platform'] is match('^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$')
      - ags_apps_units_tuple.contracts is match('^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$')
      - ags_apps_units_tuple['dotfiles-assets'] is match('^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$')
    fail_msg: >-
      the program tuple at {{ ags_apps_units_tuple_file }} must be schemaVersion
      1 and exactly the ags-platform/contracts/dotfiles-assets semver tags.

- name: Partition the app list (every entry is standalone)
  ansible.builtin.set_fact:
    ags_apps_units_apps: "{{ ags_apps_units_apps_document.apps }}"
    ags_apps_units_always_on_names: >-
      {{ ags_apps_units_apps_document.apps
         | selectattr('launch', 'equalto', 'always')
         | map(attribute='app') | list }}
    ags_apps_units_on_demand_names: >-
      {{ ags_apps_units_apps_document.apps
         | selectattr('launch', 'equalto', 'on-demand')
         | map(attribute='app') | list }}

- name: Ensure the per-app install root exists
  ansible.builtin.file:
    path: "{{ ags_apps_units_install_root }}"
    state: directory
    mode: "0755"

- name: Ensure the shared platform shortcut dir exists
  ansible.builtin.file:
    path: "{{ ags_apps_units_platform_shortcut_dir }}"
    state: directory
    mode: "0755"

- name: Check the tuple's ags-platform unit is installed
  ansible.builtin.stat:
    path: "{{ ags_apps_units_platform_unit_dir }}/index.ts"
  register: ags_apps_units_platform_unit_check

- name: Assert the tuple's ags-platform unit is installed before linking it
  ansible.builtin.assert:
    that:
      - ags_apps_units_platform_unit_check.stat.exists | default(false)
    fail_msg: >-
      the program tuple names ags-platform {{ ags_apps_units_tuple['ags-platform'] }},
      but {{ ags_apps_units_platform_unit_dir }}/index.ts is missing. The
      ags_platform role must install the SAME tuple tag before a standalone app
      can resolve `ags-platform` (AD-31/AD-34). Re-pin the platform role's
      ags_platform_version to the tuple tag as part of the adoption release —
      never silently point the shared shortcut at a missing unit.

- name: Point the one shared apps/node_modules shortcut at the tuple platform unit
  ansible.builtin.file:
    src: "{{ ags_apps_units_platform_unit_dir }}"
    dest: "{{ ags_apps_units_platform_shortcut }}"
    state: link
    force: true

- name: Install, repoint, start and verify each standalone app
  ansible.builtin.include_tasks: _one.yml
  loop: "{{ ags_apps_units_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.app }}"
