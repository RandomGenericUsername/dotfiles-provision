# One standalone app: the AD-32 cutover epoch with rollback.
#
# The caller sets `app` (one `owner: standalone` entry from apps.yaml).
# Everything this file writes is OUTSIDE the immutable tag:
#   <install>/apps/<installDir>/pinned
#   <install>/config/<spineLink>
#   <XDG_CONFIG_HOME>/<xdgLink>
#   <bin>/<binLink>
#   <bin>/<launcher>
# The tag directory itself is only cloned (presence-guarded), has its .git
# removed once, and is swept of pre-v3 runtime artifacts (appearance.css /
# skin.css / skin.json / colors*). It is never templated or copied into.

- name: "{{ app.app }} : materialize the owner paths"
  ansible.builtin.set_fact:
    ags_apps_units_unit_dir: "{{ ags_apps_units_install_root }}/{{ app.installDir }}/{{ app.tag }}"
    ags_apps_units_pin_file: "{{ ags_apps_units_install_root }}/{{ app.installDir }}/pinned"
    ags_apps_units_spine_link: "{{ ags_apps_units_spine_config_dir }}/{{ app.spineLink }}"
    ags_apps_units_xdg_link: "{{ ags_apps_units_xdg_config_home }}/{{ app.xdgLink }}"
    ags_apps_units_bin_link: >-
      {{ (ags_apps_units_bin_dir | trim) ~ '/' ~ app.binLink
         if app.binLink is defined else '' }}
    ags_apps_units_launcher_path: >-
      {{ (ags_apps_units_bin_dir | trim) ~ '/' ~ app.launcher
         if app.launcher is defined else '' }}
    ags_apps_units_launcher_backup: >-
      {{ ags_apps_units_install_root ~ '/' ~ app.installDir ~ '/.rollback/' ~ app.launcher
         if app.launcher is defined else '' }}
    ags_apps_units_log_file: "{{ ags_apps_units_state_root }}/ags/{{ app.instance }}.log"
    ags_apps_units_unit_file: "{{ ags_apps_units_systemd_user_dir }}/{{ ags_apps_units_unit_name }}"
    ags_apps_units_unit_wants_link: "{{ ags_apps_units_unit_wants_dir }}/{{ ags_apps_units_unit_name }}"
    ags_apps_units_started_this_run: false

- name: "{{ app.app }} : capture the pre-cutover running state"
  ansible.builtin.command:
    cmd: ags list
  register: ags_apps_units_before_list
  changed_when: false
  failed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: "{{ app.app }} : record whether the old instance was running"
  ansible.builtin.set_fact:
    ags_apps_units_was_running: >-
      {{ app.instance in (ags_apps_units_before_list.stdout_lines | default([])
                          | map('trim') | list) }}
  when: not ansible_check_mode

- name: "{{ app.app }} : capture previous spine/XDG/bin link targets"
  ansible.builtin.command:
    cmd: "readlink {{ item }}"
  loop:
    - "{{ ags_apps_units_spine_link }}"
    - "{{ ags_apps_units_xdg_link }}"
    - "{{ ags_apps_units_bin_link }}"
  register: ags_apps_units_previous_links
  changed_when: false
  failed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: "{{ app.app }} : record the previous link targets for rollback"
  ansible.builtin.set_fact:
    ags_apps_units_previous_spine_target: "{{ ags_apps_units_previous_links.results[0].stdout | default('') | trim }}"
    ags_apps_units_previous_xdg_target: "{{ ags_apps_units_previous_links.results[1].stdout | default('') | trim }}"
    ags_apps_units_previous_bin_target: "{{ ags_apps_units_previous_links.results[2].stdout | default('') | trim }}"
  when: not ansible_check_mode

- name: "{{ app.app }} : check for an existing launcher to preserve for rollback"
  ansible.builtin.stat:
    path: "{{ ags_apps_units_launcher_path }}"
  register: ags_apps_units_previous_launcher
  when: app.launcher is defined

- name: "{{ app.app }} : ensure the rollback backup dir exists"
  ansible.builtin.file:
    path: "{{ ags_apps_units_launcher_backup | dirname }}"
    state: directory
    mode: "0755"
  when:
    - not ansible_check_mode
    - app.launcher is defined
    - ags_apps_units_previous_launcher.stat.exists | default(false)

- name: "{{ app.app }} : back up the previous launcher before replacing it"
  ansible.builtin.copy:
    src: "{{ ags_apps_units_launcher_path }}"
    dest: "{{ ags_apps_units_launcher_backup }}"
    remote_src: true
    mode: "0755"
  when:
    - not ansible_check_mode
    - app.launcher is defined
    - ags_apps_units_previous_launcher.stat.exists | default(false)

- name: "{{ app.app }} : quiesce before any link change (AD-32)"
  ansible.builtin.include_tasks: _quiesce.yml

- name: "{{ app.app }} : block — install, repoint, start, verify; rollback on failure"
  block:
    - name: "{{ app.app }} : ensure install/config/XDG/bin/log parents exist"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ags_apps_units_install_root }}/{{ app.installDir }}"
        - "{{ ags_apps_units_spine_config_dir }}"
        - "{{ ags_apps_units_xdg_config_home }}"
        - "{{ ags_apps_units_bin_dir | trim }}"
        - "{{ ags_apps_units_state_root }}/ags"

    - name: "{{ app.app }} : check whether the immutable tag is installed"
      ansible.builtin.stat:
        path: "{{ ags_apps_units_unit_dir }}/app.tsx"
      register: ags_apps_units_unit_check

    - name: "{{ app.app }} : clone the standalone tag (shallow, anonymous HTTPS)"
      ansible.builtin.git:
        repo: "{{ app.repo }}"
        dest: "{{ ags_apps_units_unit_dir }}"
        version: "{{ app.tag }}"
        depth: 1
        single_branch: true
      register: ags_apps_units_clone
      retries: 3
      delay: 5
      until: ags_apps_units_clone is succeeded
      when:
        - not ansible_check_mode
        - not ags_apps_units_unit_check.stat.exists

    - name: "{{ app.app }} : remove the clone's .git (deploy as a source tree)"
      ansible.builtin.file:
        path: "{{ ags_apps_units_unit_dir }}/.git"
        state: absent
      when: not ansible_check_mode

    # Generations v3 migration: a pre-v3 runtime wrote appearance.css (and,
    # earlier, skin.css/skin.json/colors*) through the config/<app> symlink
    # into the released tag. Reinstall/rollback must make the tag immutable
    # again: delete those known runtime artifacts only, never app source.
    - name: "{{ app.app }} : find stale runtime artifacts in the immutable tag"
      ansible.builtin.find:
        paths: "{{ ags_apps_units_unit_dir }}"
        patterns: "{{ ags_apps_units_forbidden_runtime_artifacts }}"
        recurse: true
        hidden: true
        file_type: any
      register: ags_apps_units_tag_stale_artifacts
      when: not ansible_check_mode

    - name: "{{ app.app }} : remove stale runtime artifacts from the immutable tag"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ ags_apps_units_tag_stale_artifacts.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      when:
        - not ansible_check_mode
        # Runtime-owned artifacts are files or symlinks. A real directory that
        # happens to share an allowlisted basename is never removed.
        - item.islnk | default(false) or not (item.isdir | default(false))

    - name: "{{ app.app }} : find any remaining runtime artifact in the tag"
      ansible.builtin.find:
        paths: "{{ ags_apps_units_unit_dir }}"
        patterns: "{{ ags_apps_units_forbidden_runtime_artifacts }}"
        recurse: true
        hidden: true
        file_type: any
      register: ags_apps_units_tag_runtime_artifacts
      when: not ansible_check_mode

    - name: "{{ app.app }} : assert the tag carries no runtime artifact"
      ansible.builtin.assert:
        that:
          - ags_apps_units_tag_runtime_artifacts.matched | default(0) | int == 0
        fail_msg: >-
          {{ ags_apps_units_unit_dir }} still contains runtime-owned artifact(s)
          {{ ags_apps_units_tag_runtime_artifacts.files | default([])
             | map(attribute='path') | list }} (contracts generations.md §6,
          AD-37). Runtime writes belong under
          $XDG_STATE_HOME/dotfiles/current/; an app tag is immutable. Remove
          the listed path(s) or install a tag that does not ship them.
      when: not ansible_check_mode

    - name: "{{ app.app }} : record the installed tag outside the immutable tree"
      ansible.builtin.copy:
        content: "{{ app.tag }}\n"
        dest: "{{ ags_apps_units_pin_file }}"
        mode: "0644"
        force: true

    - name: "{{ app.app }} : verify the tag's manifest identity and handler"
      ansible.builtin.include_tasks: _verify_unit.yml
      when: not ansible_check_mode

    - name: "{{ app.app }} : repoint the spine link at the immutable tag"
      ansible.builtin.file:
        src: "{{ ags_apps_units_unit_dir }}"
        dest: "{{ ags_apps_units_spine_link }}"
        state: link
        force: true

    - name: "{{ app.app }} : expose the spine link at its XDG config path"
      ansible.builtin.file:
        src: "{{ ags_apps_units_spine_link }}"
        dest: "{{ ags_apps_units_xdg_link }}"
        state: link
        force: true

    - name: "{{ app.app }} : verify the app-owned bin entry point exists"
      ansible.builtin.stat:
        path: "{{ ags_apps_units_unit_dir }}/bin/{{ app.binLink }}"
      register: ags_apps_units_bin_source
      when:
        - not ansible_check_mode
        - app.binLink is defined

    - name: "{{ app.app }} : assert the app-owned bin entry point exists in the tag"
      ansible.builtin.assert:
        that: ags_apps_units_bin_source.stat.exists
        fail_msg: >-
          {{ app.app }} declares binLink '{{ app.binLink }}' but
          {{ ags_apps_units_unit_dir }}/bin/{{ app.binLink }} does not exist in
          the immutable tag. The app repo must ship the declared command.
      when:
        - not ansible_check_mode
        - app.binLink is defined

    - name: "{{ app.app }} : install the optional bin link"
      ansible.builtin.file:
        src: "{{ ags_apps_units_unit_dir }}/bin/{{ app.binLink }}"
        dest: "{{ ags_apps_units_bin_link }}"
        state: link
        force: true
      when: app.binLink is defined

    - name: "{{ app.app }} : render the provisioned launcher through the launch lock"
      ansible.builtin.template:
        src: ags-app-launcher.j2
        dest: "{{ ags_apps_units_launcher_path }}"
        mode: "0755"
      when: app.launcher is defined

    - name: "{{ app.app }} : verify the declared ownership surfaces"
      ansible.builtin.include_tasks: _verify_surfaces.yml
      when: not ansible_check_mode

    - name: "{{ app.app }} : assert the shared launch-lock wrapper is installed"
      ansible.builtin.stat:
        path: "{{ ags_apps_units_run_locked }}"
      register: ags_apps_units_run_locked_check
      when:
        - not ansible_check_mode
        - (app.launch == 'always') or (ags_apps_units_cutover | bool)

    - name: "{{ app.app }} : require cli_tools' ags-run-locked wrapper for starts"
      ansible.builtin.assert:
        that: ags_apps_units_run_locked_check.stat.exists
        fail_msg: >-
          {{ ags_apps_units_run_locked }} is missing — cli_tools installs the
          shared launch-lock wrapper and runs before this role in bootstrap
          order. Every `ags run` path must use it (AD-28).
      when:
        - not ansible_check_mode
        - (app.launch == 'always') or (ags_apps_units_cutover | bool)

    # REQ-023 / BUG-009: the two always-on apps are supervised by systemd
    # --user. The pre-cutover _quiesce stopped the existing unit under the
    # launch lock; after the link surfaces, the installer explicitly starts the
    # unit and refuses to treat an already-active unit as success. It never
    # starts them through the raw wrapper path. On-demand cutover proofs keep
    # the wrapper.
    - name: "{{ app.app }} : ensure the user systemd unit directory exists"
      ansible.builtin.file:
        path: "{{ ags_apps_units_systemd_user_dir }}"
        state: directory
        mode: "0755"
      when: app.launch == 'always'

    - name: "{{ app.app }} : ensure the default.target wants directory exists"
      ansible.builtin.file:
        path: "{{ ags_apps_units_unit_wants_dir }}"
        state: directory
        mode: "0755"
      when: app.launch == 'always'

    - name: "{{ app.app }} : render the always-on systemd --user unit"
      ansible.builtin.template:
        src: dotfiles-ags-app.service.j2
        dest: "{{ ags_apps_units_unit_file }}"
        mode: "0644"
      when: app.launch == 'always'

    - name: "{{ app.app }} : clear a previous start-limit failure on the unit"
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - reset-failed
          - "{{ ags_apps_units_unit_name }}"
      changed_when: false
      failed_when: false
      when:
        - not ansible_check_mode
        - app.launch == 'always'
        - ags_apps_units_manager_probe.rc | default(1) == 0

    - name: "{{ app.app }} : reload the user manager after rendering the unit"
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - daemon-reload
      changed_when: false
      when:
        - not ansible_check_mode
        - app.launch == 'always'
        - ags_apps_units_manager_probe.rc | default(1) == 0

    - name: "{{ app.app }} : enable the always-on unit"
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - enable
          - "{{ ags_apps_units_unit_name }}"
      changed_when: false
      when:
        - not ansible_check_mode
        - app.launch == 'always'
        - ags_apps_units_manager_probe.rc | default(1) == 0

    # BUG-009: `state: started` against an already-active unit is a no-op, so
    # an old process survives the link repoint. Require the pre-cutover stop to
    # have left the unit inactive; only then does an explicit start prove the
    # new link came up.
    - name: "{{ app.app }} : read the unit state before the explicit start"
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - is-active
          - --quiet
          - "{{ ags_apps_units_unit_name }}"
      register: ags_apps_units_unit_prestart
      changed_when: false
      failed_when: false
      when:
        - not ansible_check_mode
        - app.launch == 'always'
        - ags_apps_units_manager_probe.rc | default(1) == 0

    - name: "{{ app.app }} : refuse an already-active unit before the explicit start"
      ansible.builtin.assert:
        that:
          - ags_apps_units_unit_prestart.rc | default(0) != 0
        fail_msg: >-
          {{ ags_apps_units_unit_name }} is still active before the explicit
          start. The cutover stop did not release the old process, so
          `systemctl --user start` would be a no-op and verify would reach the
          previous generation. Stop the unit before the link repoint.
      when:
        - not ansible_check_mode
        - app.launch == 'always'
        - ags_apps_units_manager_probe.rc | default(1) == 0

    - name: "{{ app.app }} : explicitly start the always-on unit on the new link"
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - start
          - "{{ ags_apps_units_unit_name }}"
      register: ags_apps_units_unit_start
      failed_when: false
      when:
        - not ansible_check_mode
        - app.launch == 'always'
        - ags_apps_units_manager_probe.rc | default(1) == 0

    - name: "{{ app.app }} : read the unit state after the explicit start"
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - show
          - --property=ActiveState
          - --property=MainPID
          - --value
          - "{{ ags_apps_units_unit_name }}"
      register: ags_apps_units_unit_state
      changed_when: false
      when:
        - not ansible_check_mode
        - app.launch == 'always'
        - ags_apps_units_manager_probe.rc | default(1) == 0

    - name: "{{ app.app }} : assert the explicit start brought the new unit up"
      ansible.builtin.assert:
        that:
          - ags_apps_units_unit_start.rc | default(1) == 0
          - >-
            ags_apps_units_unit_state.stdout_lines | default([])
            | map('trim') | select('equalto', 'active') | list | length == 1
          - >-
            ags_apps_units_unit_state.stdout_lines | default([])
            | map('trim') | select('match', '^[1-9][0-9]*$') | list | length >= 1
        fail_msg: >-
          systemctl --user start {{ ags_apps_units_unit_name }} returned
          rc={{ ags_apps_units_unit_start.rc | default('?') }} but the unit is
          not active with a main PID (state={{
          ags_apps_units_unit_state.stdout | default('') | trim }}). The old
          process may still own the bus; the cutover must stop the unit before
          relinking and start it after.
      when:
        - not ansible_check_mode
        - app.launch == 'always'
        - ags_apps_units_manager_probe.rc | default(1) == 0

    - name: "{{ app.app }} : enable the always-on unit without a live manager (R-6)"
      ansible.builtin.file:
        src: "{{ ags_apps_units_unit_file }}"
        dest: "{{ ags_apps_units_unit_wants_link }}"
        state: link
        force: true
      when:
        - app.launch == 'always'
        - ags_apps_units_manager_probe.rc | default(1) != 0

    - name: "{{ app.app }} : verify the always-on unit is installed and enabled"
      ansible.builtin.include_tasks: _verify_always_on_unit.yml
      when:
        - not ansible_check_mode
        - app.launch == 'always'

    - name: "{{ app.app }} : start an on-demand cutover proof through the launch lock"
      ansible.builtin.command:
        argv:
          - "{{ ags_apps_units_run_locked }}"
          - --expect-instance
          - "{{ app.instance }}"
          - --lock-timeout
          - "{{ ags_apps_units_lock_timeout }}"
          - --register-timeout
          - "{{ ags_apps_units_register_timeout }}"
          - -d
          - "{{ ags_apps_units_xdg_link }}"
          - --log-file
          - "{{ ags_apps_units_log_file }}"
      environment:
        PATH: "{{ ags_apps_units_bin_dir | trim }}:{{ ansible_facts.env.PATH }}"
      register: ags_apps_units_start
      when:
        - not ansible_check_mode
        - app.launch == 'on-demand'
        - ags_apps_units_cutover | bool

    - name: "{{ app.app }} : record that this run started the always-on unit"
      ansible.builtin.set_fact:
        ags_apps_units_started_this_run: true
      when:
        - not ansible_check_mode
        - app.launch == 'always'
        - ags_apps_units_manager_probe.rc | default(1) == 0

    - name: "{{ app.app }} : record that this run started the on-demand proof"
      ansible.builtin.set_fact:
        ags_apps_units_started_this_run: true
      when:
        - not ansible_check_mode
        - app.launch == 'on-demand'
        - ags_apps_units_cutover | bool

    - name: "{{ app.app }} : verify the running identity, handler and ownership surfaces"
      ansible.builtin.include_tasks: _verify_runtime.yml
      when:
        - not ansible_check_mode
        - ags_apps_units_started_this_run | default(false)

    - name: "{{ app.app }} : stop an on-demand app after cutover verification"
      ansible.builtin.include_tasks: _quiesce.yml
      when:
        - not ansible_check_mode
        - app.launch == 'on-demand'
        - ags_apps_units_cutover | bool
        - not ags_apps_units_was_running | default(false)

  rescue:
    - name: "{{ app.app }} : ROLLBACK — restore the previous owner surfaces"
      ansible.builtin.include_tasks: _rollback.yml

    - name: "{{ app.app }} : fail after rollback (the epoch did not verify)"
      ansible.builtin.fail:
        msg: >-
          {{ app.app }} cutover/verification failed; rollback restored the
          previous links and restarted the old instance when it was running.
          Failed task: {{ ansible_failed_task.name | default('unknown') }}.
          Failed result: {{ ansible_failed_result | default('') }}
