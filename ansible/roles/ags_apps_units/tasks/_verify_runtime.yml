# Runtime verification for one standalone app that this run STARTED (AD-28).
# It proves the new instance is the one on the AGS bus and, for live apps, that
# its appearance-refresh handler answers through the v3 contract. Read-only: no file
# is written and no palette state is changed by the verification itself.
#
# The caller sets `app`, `ags_apps_units_started_this_run` and the path facts.

# A unit start returns as soon as systemd has exec'd the command; the AGS name
# registers a moment later. Bound the wait so a delegated/failed start still
# fails the identity assert below instead of racing it.
- name: "{{ app.app }} : wait for the instance to register on the AGS bus"
  ansible.builtin.shell:
    cmd: |
      for _ in $(seq 1 50); do
          if ags list 2>/dev/null | grep -qx "$AGS_INSTANCE"; then
              exit 0
          fi
          sleep 0.2
      done
      exit 1
    executable: /bin/bash
  environment:
    AGS_INSTANCE: "{{ app.instance }}"
  changed_when: false
  failed_when: false

- name: "{{ app.app }} : list running AGS instances"
  ansible.builtin.command:
    cmd: ags list
  register: ags_apps_units_running_list
  changed_when: false

- name: "{{ app.app }} : assert the new instance owns its bus name"
  ansible.builtin.assert:
    that:
      - app.instance in (ags_apps_units_running_list.stdout_lines | map('trim') | list)
    fail_msg: >-
      {{ app.app }} started through {{ ags_apps_units_run_locked }}, but
      '{{ app.instance }}' is not on the AGS bus. Identity is
      manifest.instance == app.tsx instanceName == `ags list` (AD-26).

- name: "{{ app.app }} : invoke the appearance-refresh handler"
  ansible.builtin.command:
    argv:
      - ags
      - request
      - appearance-refresh
      - "{{ ags_apps_units_verify_gen_hash }}"
      - -i
      - "{{ app.instance }}"
  register: ags_apps_units_handler
  changed_when: false
  failed_when: false
  when:
    - ags_apps_units_manifest.mode == 'live'
    - ags_apps_units_verify_handler | bool

- name: "{{ app.app }} : assert the live appearance-refresh handler answered"
  ansible.builtin.assert:
    that:
      - ags_apps_units_handler.rc | default(1) == 0
      - >-
        ags_apps_units_handler.stdout
        is search('"applied"[ ]*:[ ]*"' ~ ags_apps_units_verify_gen_hash ~ '"')
        or (ags_apps_units_handler.stdout is search('"deferred"')
            and ags_apps_units_handler.stdout
                is search('"' ~ ags_apps_units_verify_gen_hash ~ '"'))
    fail_msg: >-
      {{ app.app }} is live but its appearance-refresh handler did not return
      {"applied":"<genHash>"} or a deferred response naming the requested
      generation (contracts v0.10.0). A boolean {"ok":true} ack is not
      generation-bound and is rejected. rc={{
      ags_apps_units_handler.rc | default('?') }}, stdout={{
      ags_apps_units_handler.stdout | default('') | trim }}, stderr={{
      ags_apps_units_handler.stderr | default('') | trim }}.
  when:
    - ags_apps_units_manifest.mode == 'live'
    - ags_apps_units_verify_handler | bool
