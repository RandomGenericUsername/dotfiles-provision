# Wlogout-config role (Story 3.4 / shell wiring) — renders the wlogout
# stylesheet from the Jinja template that ships in the pinned `dotfiles-assets`
# corpus (`templates/wlogout/style.css.tpl`, read from <install>/assets/<tag>/
# since S3) into the config-in-spine home <install>/config/wlogout/style.css.
# The role also PRUNES the pre-S3 residue <spine>/config/wlogout/style.css.tpl —
# a copied template that nothing rendered and nothing should keep.
#
# Previously the .tpl was COPIED VERBATIM by config_copies, so wlogout loaded a
# template with unresolved {{VARS}} and nonexistent @color16/@color10/@color7
# names. This role renders it with vars resolved to the actual provisioned
# paths; since assets v0.6.4 the template consumes palette.v1 semantic roles
# (`@on_surface`, `@primary_container`) instead of the retired carrier tokens.
#
# Design:
# - Runs AFTER assets (icons + wallpaper exist) and BEFORE config_links.
# - Vars resolve: COLORS_FILE_PATH → the v3 generation palette
#   `$XDG_STATE_HOME/dotfiles/current/palette/colors.gtk.css` (the rendered
#   @define-color file wlogout imports). This is a DIRECT runtime-state read:
#   provisioning never routes it through an AGS app tag or a config copy.
#   STATE_ROOT icons/wallpaper → current/{icons,wallpaper} in the same state
#   root. font from the tunable shell vars (group_vars/all.yml).
# - Since assets v0.15.1 the static template also ends with a relative
#   `@import url("appearance.css");` (W-2.6). The `state_links` role creates
#   `<spine>/config/wlogout/appearance.css` after the seed, so that import
#   resolves to the generated `current/appearance/wlogout.css` at launch. The
#   template therefore needs no new render variable: the generated import is
#   relative to the rendered style.css.
# - The `template` module has full check-mode support — no --check gate.
# - User-scoped: NO become.

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that: install_dir is defined and install_dir | trim | length > 0
    fail_msg: >-
      install_dir is undefined or empty — the wlogout_config role requires the
      install_dir seam extra-var (the orchestrator resolves
      $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)

- name: Ensure wlogout config dir exists in the spine
  ansible.builtin.file:
    path: "{{ wlogout_config_spine_dir }}"
    state: directory

# S3 prune (idempotent): before the template moved to the pinned corpus,
# `config_copies` copied the whole wlogout dir into the spine, leaving a
# `style.css.tpl` beside the rendered `style.css`. Nothing reads it, and a stale
# template in the directory wlogout loads is exactly the residue the split is
# supposed to remove. `state: absent` is a no-op when it is already gone, so the
# task converges on a fresh machine and cleans a pre-S3 one in the same pass.
- name: Remove the pre-S3 wlogout template from the spine (moved to the pinned corpus)
  ansible.builtin.file:
    path: "{{ wlogout_config_legacy_template_path }}"
    state: absent

- name: Render wlogout style.css
  ansible.builtin.template:
    src: "{{ wlogout_config_assets_templates_dir }}/wlogout/style.css.tpl"
    dest: "{{ wlogout_config_spine_dir }}/style.css"
  vars:
    COLORS_FILE_PATH: "{{ wlogout_config_state_palette_file }}"
    # gt-4-2 follow-up: icons + wallpaper read the RUNTIME state-root current/
    # pointers (single source, palette-fresh per wallpaper set) — the pre-Epic-4
    # <install>/generated/icons tree is deleted; the default.png hardcode never
    # followed wallpaper changes.
    STATE_ROOT: "{{ wlogout_config_state_root | trim }}"
    CURRENT_WALLPAPER_SYMLINK: "{{ wlogout_config_state_root | trim }}/dotfiles/current/wallpaper.png"
