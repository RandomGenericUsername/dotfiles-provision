# gloview_plugin role vars.
#
# gloview_plugin_so_path: install path of the plugin artifact. This is the
#   gloview-git AUR package's install location (upstream PKGBUILD:
#   install -Dm755 build/gloview.so /usr/lib/gloview.so). Arch-only reality,
#   documented here: if a Debian build of the plugin ever exists, override
#   per-distro (NFR-3) instead of branching in tasks.
gloview_plugin_so_path: /usr/lib/gloview.so

# gloview_plugin_bin_dir: where the composition's gloview-activate and
#   gloview-rebuild scripts are installed. Resolved exactly as uv resolves the
#   tool bin dir ($UV_TOOL_BIN_DIR -> $XDG_BIN_HOME -> $HOME/.local/bin), so
#   the unit's ExecStart matches where the activator actually lands.
gloview_plugin_bin_dir: >-
  {{ ansible_facts.env.UV_TOOL_BIN_DIR
     | default(ansible_facts.env.XDG_BIN_HOME | default(ansible_facts.env.HOME + '/.local/bin', true), true) }}

# gloview_plugin_unit_name: the systemd --user oneshot that owns activation.
#   The composition's autostart.lua no longer launches gloview-activate.
gloview_plugin_unit_name: dotfiles-gloview.service

# gloview_plugin_scripts_dir: composition source for the activator and the
#   interactive rebuild helper. The composition owns these scripts (same seam
#   as cli_tools' gloview-activate install); this role deploys the unit and the
#   helper, never a second copy of the script.
gloview_plugin_scripts_dir: "{{ manifests_dir }}/scripts"

# Supervision tuning. A failed oneshot must not hot-loop, and the activator may
# wait up to 60 s for Hyprland IPC plus a bounded 5 s load verification.
gloview_plugin_start_limit_interval_sec: 60
gloview_plugin_start_limit_burst: 3
gloview_plugin_timeout_start_sec: 90
