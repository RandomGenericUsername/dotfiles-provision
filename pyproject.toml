[project]
name = "dotfiles-provision"
version = "0.1.27"
description = "Machine provisioning orchestrator for the dotfiles system (plan/apply/verify/bootstrap via Ansible)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "cli-output",
    "ansible-core>=2.16",
    "PyYAML>=6.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.scripts]
dotfiles-provision = "provisioning.cli.main:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provisioning"]

# The wheel must be a self-contained engine: the CLI runs the Ansible tree, and
# a `uv tool install git+…@tag` has no checkout beside site-packages. The tree
# ships as package data under `provisioning/_ansible` and `cli/main.py` resolves
# it through `importlib.resources` (R-15). The sdist keeps `ansible/` at the
# repo root, so a source install builds the same wheel.
[tool.hatch.build.targets.wheel.force-include]
"ansible" = "provisioning/_ansible"

# The harness trees (.agents/, _bmad/, .opencode/, openspec/, tickets/, .github/)
# are not release content. `ansible/` IS included: it is the engine the CLI runs,
# and the sdist is the source-installable form of that engine.
[tool.hatch.build.targets.sdist]
only-include = [
    "pyproject.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "ansible",
    "src/provisioning",
    "tests",
]

[tool.uv.sources]
cli-output = { git = "https://github.com/RandomGenericUsername/cli-output", tag = "v0.1.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: test requires a real ansible-playbook + collections (FR-25)",
    "container_target: test requires podman/docker to provision a disposable target (FR-25 apply+verify)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Test bodies carry long single-line fixture payloads and failure messages that
# read better unwrapped; production code stays at the 100-column limit.
"tests/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
disable_error_code = ["import-untyped"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.17",
    "mypy>=1.10",
]
