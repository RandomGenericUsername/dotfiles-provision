# Assets to deploy into the install spine (verified repo inventory, plan §5).
#
# `assets:` is the PINNED CORPUS (spine AD-6): the repository, the exact tag,
# and the destination class map. The assets role clones repo@tag ONCE into
# <install>/assets/<tag>/ and every corpus entry below reads from that checkout;
# nothing reads a composition-repo tree. A pin bump edits `assets.tag` AND the
# four checkout sources below (the role + verify mirrors are parity-locked by
# tests, and the sources are checked against `assets.tag`).
#
# Each entry is tagged with an AssetKind; `AssetKind.spine_segment()` resolves
# the deploy target under $XDG_DATA_HOME/dotfiles/. `source` is the path Ansible
# copies FROM: an ABSOLUTE install-spine path into the pinned assets checkout
# (or, for `tpr-templates`, into the pinned tpr checkout — spine AD-10). Rich
# keys are validated by YamlManifestReader but not captured into the domain view
# — Ansible reads the full YAML directly.
kind: assets

assets:
  repo: https://github.com/RandomGenericUsername/dotfiles-assets
  tag: v0.12.2
  classes:
    icons:     { dest: icons,     schema: icons/schema.json }
    templates: { dest: templates, schema: "**/*.vars.schema.json" }
    configs:   { dest: configs,   schema: null }
    content:   { dest: content,   schema: null }
    desktop:   { dest: desktop,   schema: desktop/desktop.yaml }
    skins:     { dest: skins,     schema: skins/schema.json }

entries:
  - name: wallpapers
    kind: wallpaper
    source: "{{ install_dir | trim }}/assets/v0.12.2/content/wallpapers/wallpapers.tar.gz"
  - name: icon-templates
    kind: icon-template
    source: "{{ install_dir | trim }}/assets/v0.12.2/icons/templates/"
  - name: icon-mappings
    kind: icon-mapping
    source: "{{ install_dir | trim }}/assets/v0.12.2/icons/mappings/"
  - name: skins
    kind: skins
    # REQ-020: the skin plane is root-level DATA deployed to <install>/skins,
    # the runtime's first skin root. Manifests + templates + the vendored
    # contracts/PIN and local schema envelope all ride the class mirror; no
    # render, no validate script, no runtime reconcile.
    source: "{{ install_dir | trim }}/assets/v0.12.2/skins/"
  - name: tpr-templates
    kind: tpr-template
    # REQ-010: the sole palette producer's projection catalog, copied FROM
    # the pinned tpr checkout into the XDG-discovered spine config
    # (config/theme-producer/templates — the exact path runtime TprAdapter
    # reads). cli-tools.yaml runs BEFORE assets.yaml, so the checkout exists,
    # and the tag is the `cli_tools_tags.tpr` fact (REQ-014) — never a literal.
    source: "{{ install_dir | trim }}/cli-tools/tpr/{{ cli_tools_tags.tpr }}/src/theme_producer/defaults/templates"
  - name: weg-effects
    kind: weg-effects
