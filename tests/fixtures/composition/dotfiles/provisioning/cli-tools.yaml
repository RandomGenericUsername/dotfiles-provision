# CLI tools installed by the `cli_tools` role (fixture mirror).
#
# Every entry is addressed as `{name, repo, tag}` after REQ-002 moved the
# runtime to its own pinned repo. The role shallow-clones `<repo>@<tag>` into
# `<install>/cli-tools/<name>/<tag>/`, removes `.git`, records the pin in
# `<install>/cli-tools/<name>/pinned`, and installs the tool FROM that checkout.
# Exactly one shape per entry: `source` XOR (`repo` + `tag`); no entry uses
# `source` today.
kind: cli-tools
entries:
  - name: csg
    repo: https://github.com/RandomGenericUsername/color-scheme-generator
    tag: v0.2.0
  - name: weg
    repo: https://github.com/RandomGenericUsername/wallpaper-effects-generator
    tag: v0.2.0
  - name: itr
    repo: https://github.com/RandomGenericUsername/icon-templates-renderer
    tag: v0.2.0
  - name: dotfiles-runtime
    repo: https://github.com/RandomGenericUsername/dotfiles-runtime
    tag: v0.2.2
