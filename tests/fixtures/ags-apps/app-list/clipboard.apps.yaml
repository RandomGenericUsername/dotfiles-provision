# Clipboard cutover fixture: the clipboard pilot is standalone while the bar
# remains legacy. Mirrors the dotfiles-v3 follow-up entry — app/instance
# `clipboard`, config/spine/XDG surfaces `ags-clipboard`, launcher
# `clipboard-ui`, autostart identity `clipboard`.
apps:
  - app: bar
    installDir: bar
    owner: legacy
    instance: ags
    configDir: ags
    configLink: ags
    spineLink: ags
    xdgLink: ags
    autostart: ags
    launch: always
    barPalettePointer: true
    cutoverId: REQ-015

  - app: clipboard
    installDir: clipboard
    owner: standalone
    repo: PLACEHOLDER
    tag: v0.1.0
    instance: clipboard
    configDir: ags-clipboard
    configLink: ags-clipboard
    spineLink: ags-clipboard
    xdgLink: ags-clipboard
    launcher: clipboard-ui
    autostart: clipboard
    launch: on-demand
    cutoverId: REQ-009
