# FINAL all-standalone app list (REQ-008 / AD-31/AD-32/AD-37).
#
# This is the host-shape fixture for the seven standalone AGS apps the final
# cutover composes: bar, notifications, capture, clipboard,
# wallpaper-selector, icme and btop-theme-studio. Every entry is
# `owner: standalone`; `ags_apps_units` is the ONE installer/owner of its
# <install>/apps/<installDir>/<tag> unit and every config/spine/XDG/bin/
# launcher/autostart surface. The retired `ags_apps` monorepo role does not
# exist.
#
# `repo`/`tag` are overridden by the execution harness; the checked-in values
# only document the shape. The bar keeps the ONE stable palette pointer
# (colors.css -> the runtime-owned XDG state pointer); its v0.1.1 tag is the
# state-migration release. Autostart identities mirror dotfiles-assets v0.6.2:
# only the always-on bar and notification overlay plus the boot-staggered
# capture and clipboard overlays appear there; the on-demand launchers carry no
# autostart entry.
apps:
  - app: bar
    installDir: bar
    owner: standalone
    repo: PLACEHOLDER
    tag: v0.1.0
    instance: ags
    configDir: ags
    configLink: ags
    spineLink: ags
    xdgLink: ags
    autostart: ags
    launch: always
    barPalettePointer: true
    cutoverId: REQ-015

  - app: notifications
    installDir: notifications
    owner: standalone
    repo: PLACEHOLDER
    tag: v0.1.0
    instance: notifications
    configDir: ags-notifications
    configLink: ags-notifications
    spineLink: ags-notifications
    xdgLink: ags-notifications
    autostart: notifications
    launch: always
    cutoverId: REQ-012

  - app: capture
    installDir: capture
    owner: standalone
    repo: PLACEHOLDER
    tag: v0.1.0
    instance: capture
    configDir: ags-capture
    configLink: ags-capture
    spineLink: ags-capture
    xdgLink: ags-capture
    binLink: capture-tool
    launcher: capture-ui
    autostart: capture
    launch: on-demand
    cutoverId: REQ-011

  - app: clipboard
    installDir: clipboard
    owner: standalone
    repo: PLACEHOLDER
    tag: v0.1.0
    instance: clipboard
    configDir: ags-clipboard
    configLink: ags-clipboard
    spineLink: ags-clipboard
    xdgLink: ags-clipboard
    launcher: clipboard-ui
    autostart: clipboard
    launch: on-demand
    cutoverId: REQ-009

  - app: wallpaper-selector
    installDir: wallpaper-selector
    owner: standalone
    repo: PLACEHOLDER
    tag: v0.1.0
    instance: wallpaper-selector
    configDir: ags-wallpaper-selector
    configLink: ags-wallpaper-selector
    spineLink: ags-wallpaper-selector
    xdgLink: ags-wallpaper-selector
    launcher: wallpaper-selector-ui
    launch: on-demand
