  integration:
    tests:
      - tests/integration/test_ansible_dryrun.py
      - tests/integration/test_apply_verify_container.py
      - tests/integration/test_btop_theme_deployment_e2e.py
      - tests/integration/test_btop_theme_e2e.py
      - tests/integration/test_settings_parity.py

# Ordered rules. First match wins; every changed path must match one or fall
# back to the full fast suite. `match` is an fnmatch pattern against the
# repo-relative POSIX path; `prefix` is a literal prefix. A rule may carry:
#   role: true       -> roles.<role> + role_common_tests
#   playbook: true   -> the playbook's role tests + test_bootstrap_playbook.py
#   self: true       -> the changed test file itself
#   groups: [names]  -> named suites above
#   checks: [names]  -> global checks without pytest tests (docs-only changes)
#   full_suite: true -> deliberately broad; `reason` is printed
rules:
  # Gate-sensitive inputs: a change here can invalidate the mapping or the
  # release gates themselves, so never narrow the run.
  - match: "Makefile"
    full_suite: true
    reason: "Makefile defines GATES and the dev targets"
  - match: "pyproject.toml"
    full_suite: true
    reason: "pyproject.toml controls pytest/ruff/build across the whole suite"
  - match: "uv.lock"
    full_suite: true
    reason: "the lock file can change every test dependency"
  - match: "scripts/gate-map.yaml"
    full_suite: true
    reason: "the mapping itself changed"
  - match: "scripts/gate_diff.py"
    full_suite: true
    reason: "the gate implementation changed"
  - match: "scripts/ci-gates-parity.py"
    full_suite: true
    reason: "gate-set parity changed"
  - match: "scripts/*"
    full_suite: true
    reason: "a repository script changed; scripts are gate-sensitive"

  # The engine's shared test fixture contract.
  - match: "tests/support.py"
    groups: [test-support]

  # Ansible tree.
  - prefix: "ansible/roles/"
    role: true
  - prefix: "ansible/inventory/"
    groups: [inventory]
  - match: "ansible/playbooks/bootstrap.yaml"
    groups: [bootstrap]
  - match: "ansible/playbooks/config-links-post-seed.yaml"
    groups: [config-links-post-seed]
  - match: "ansible/playbooks/runtime-seed.yaml"
    groups: [runtime-seed]
  - match: "ansible/playbooks/_publish_cli_tool_tags.yml"
    groups: [cli-tools-playbook]
  - prefix: "ansible/playbooks/"
    playbook: true
  - prefix: "ansible/"
    groups: [ansible-scaffold]

  # Python orchestrator (hexagonal layers).
  - prefix: "src/provisioning/adapters/"
    groups: [src-adapters]
  - prefix: "src/provisioning/application/"
    groups: [src-application]
  - prefix: "src/provisioning/cli/"
    groups: [src-cli]
  - prefix: "src/provisioning/domain/"
    groups: [src-domain]
  - prefix: "src/provisioning/ports/"
    groups: [src-ports]
  - prefix: "src/provisioning/"
    groups: [src-package]

  # Test inputs. Fixtures are shared by many role/seam tests.
  - prefix: "tests/fixtures/composition/"
    groups: [fixtures-composition, pin]
  - prefix: "tests/fixtures/ags-apps/"
    groups: [fixtures-ags-apps, pin]
  - prefix: "tests/fixtures/contracts/"
    groups: [fixtures-contracts]
  - prefix: "tests/integration/"
    groups: [integration]
  - match: "tests/unit/assets_templates.py"
    groups: [fixtures-contracts, test-support]
  - prefix: "tests/unit/"
    self: true
  - prefix: "tests/architecture/"
    self: true
  - match: "tests/test_*.py"
    self: true

  # Docs and planning artifacts are verified by docs-check; no pytest file
  # asserts them, so this is the one intentional check-only mapping.
  - prefix: "docs/"
    checks: [docs-check]
  - prefix: "tickets/"
    checks: [docs-check]
  - prefix: "openspec/"
    checks: [docs-check]
  - match: "*.md"
    checks: [docs-check]
  - match: "LICENSE"
    checks: [docs-check]

  # CI configuration is release-sensitive even though no unit test reads it.
  - prefix: ".github/"
    full_suite: true
    reason: "CI workflow/config changed; release-gate parity is gate-sensitive"

# Run `scripts/pin-audit.py` whenever a pin-bearing manifest, fixture, role
# vars file, or pin tool changes. This is a cheap global check, not a pytest
# selector.
pin_audit_when:
  - "ansible/roles/*/vars/*"
  - "tests/fixtures/composition/*"
  - "tests/fixtures/composition/**/*"
  - "tests/fixtures/ags-apps/*"
  - "tests/fixtures/ags-apps/**/*"
  - "tests/fixtures/contracts/*"
  - "tests/fixtures/contracts/**/*"
  - "scripts/pin-audit.py"
  - "pyproject.toml"
  - "uv.lock"

# Always run on every `make dev` invocation.
global_checks:
  - ruff
  - docs-check
