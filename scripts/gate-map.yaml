# REQ-054 — explicit changed-path to test mapping for `make dev` / `make gates-diff`.
#
# DEV FEEDBACK ONLY. `make gates` (GATES in the Makefile) and CI remain the
# release authority. This map deliberately fails closed: an unrecognised path,
# a gate-sensitive path, or any path that resolves to zero tests falls back to
# the full fast suite.
#
# Keep this file explicit. Do not replace it with `pytest --lf`, coverage data,
# or import-graph guessing: a stale cache must never narrow a gate silently.

version: 1

# Every test file below is resolved relative to the repository root and must
# exist (tests/unit/test_gate_diff.py asserts this).

# Extra tests that assert an Ansible role through a seam or shared fixture.
# Applied to every ansible/roles/<role>/ change and every role playbook change.
role_common_tests:
  - tests/unit/test_composition_seam.py
  - tests/unit/test_template_vars_parity.py

# One entry per engine role. The transitive role -> test mapping is:
#   ansible/roles/<role>/** -> roles.<role> + role_common_tests
# A role path with no entry here is a gate-map defect and falls back to the
# full fast suite.
roles:
  ags_apps_units:
    - tests/unit/test_ags_apps_units_role.py
    - tests/unit/test_ags_units_supervision.py
  ags_platform:
    - tests/unit/test_ags_platform_role.py
  assets:
    - tests/unit/test_assets_role.py
  btop_config:
    - tests/unit/test_btop_config_role.py
    - tests/unit/test_compositor_skeleton_configs.py
  cli_tools:
    - tests/unit/test_cli_tools_role.py
  compositor_configs:
    - tests/unit/test_compositor_configs_role.py
    - tests/unit/test_compositor_skeleton_configs.py
  config_copies:
    - tests/unit/test_config_copies_role.py
  config_links:
    - tests/unit/test_config_links_role.py
    - tests/unit/test_v3_locality.py
  display_manager:
    - tests/unit/test_display_manager_role.py
  filesystem:
    - tests/unit/test_filesystem_role.py
  gloview_plugin:
    - tests/unit/test_gloview_plugin_role.py
    - tests/unit/test_gloview_units.py
  gui_tools:
    - tests/unit/test_gui_tools_role.py
  kitty_config:
    - tests/unit/test_kitty_config_role.py
    - tests/unit/test_compositor_skeleton_configs.py
  packages:
    - tests/unit/test_packages_role.py
  power_options:
    - tests/unit/test_power_options_role.py
  runtime_clipboard:
    - tests/unit/test_runtime_clipboard_role.py
  runtime_daemon:
    - tests/unit/test_runtime_daemon_role.py
    - tests/unit/test_runtime_seed_playbook.py
  settings:
    - tests/unit/test_settings_role.py
  state_links:
    - tests/unit/test_v3_locality.py
    - tests/unit/test_config_links_role.py
  verify:
    - tests/unit/test_verify_role.py
  wlogout_config:
    - tests/unit/test_wlogout_config_role.py
    - tests/unit/test_compositor_skeleton_configs.py
  zsh_config:
    - tests/unit/test_zsh_config_role.py
  zsh_tools:
    - tests/unit/test_zsh_tools_role.py

# Named suites used by path rules. A group is a deterministic list of test
# files, or all_roles: true (every role's tests, for bootstrap-wide changes).
groups:
  gate-tests:
    tests:
      - tests/unit/test_gate_diff.py
      - tests/unit/test_pytest_shard.py
      - tests/unit/test_release_preflight.py
  ansible-scaffold:
    tests:
      - tests/unit/test_ansible_scaffold.py
      - tests/unit/test_packages_role.py
      - tests/unit/test_template_vars_parity.py
  inventory:
    tests:
      - tests/unit/test_ansible_scaffold.py
      - tests/unit/test_packages_role.py
      - tests/unit/test_template_vars_parity.py
      - tests/unit/test_display_manager_role.py
      - tests/unit/test_zsh_config_role.py
  bootstrap:
    all_roles: true
    tests:
      - tests/unit/test_bootstrap_playbook.py
      - tests/unit/test_ansible_scaffold.py
  config-links-post-seed:
    tests:
      - tests/unit/test_bootstrap_playbook.py
      - tests/unit/test_config_links_role.py
      - tests/unit/test_v3_locality.py
      - tests/unit/test_composition_seam.py
  runtime-seed:
